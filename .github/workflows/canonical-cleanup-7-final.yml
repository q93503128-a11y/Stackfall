name: Canonical cleanup 7 final
on:
  push:
    branches: [validation/canonical-cleanup-7-final]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded ownership transform
        run: node .validation/canonical-cleanup-7-transform.mjs
      - name: Check transformed ownership surface
        shell: bash
        run: |
          set -euo pipefail
          ! grep -REn --include='*.js' '\bhurtPlayer\s*=\s*function\b' src
          ! grep -REn --include='*.js' '\bupdateWeapons\s*=\s*function\b' src
          node scripts/runtime-ownership-contract.mjs
          node --check scripts/awakening-runtime-checks.mjs
          node --check scripts/apex-foundation-browser.mjs
      - name: Validate full source and write build fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Prepare Chrome wrapper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/stackfall-chrome" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          profile=''
          args=()
          for arg in "$@"; do
            case "$arg" in
              --user-data-dir=*) profile="${arg#--user-data-dir=}"; args+=("$arg") ;;
              --remote-debugging-port=0) args+=("--remote-debugging-port=9223" "--remote-debugging-address=127.0.0.1") ;;
              *) args+=("$arg") ;;
            esac
          done
          args+=("--no-sandbox" "--disable-dev-shm-usage")
          if [[ -n "$profile" ]]; then
            mkdir -p "$profile"
            (for _ in $(seq 1 100); do printf '9223\n' > "$profile/DevToolsActivePort" 2>/dev/null || true; sleep 0.1; done) &
          fi
          exec /usr/bin/google-chrome "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/stackfall-chrome"
      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/stackfall-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/stackfall-http.log
          exit 1
      - name: Chromium full smoke
        id: smoke
        continue-on-error: true
        env:
          STACKFALL_CHROME: ${{ runner.temp }}/stackfall-chrome
          STACKFALL_ALLOW_GPU_SKIP: '1'
          STACKFALL_ALLOW_CONTEXT_SKIP: '1'
        run: node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/
      - name: Persist smoke diagnostic
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='test-results/stackfall-smoke.json';
          let out={missing:true};
          if(fs.existsSync(p)){
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            out={ok:r.ok,failures:r.failures,skips:r.skips,scenarios:(r.scenarios||[]).map(s=>({name:s.name,ok:s.ok,failures:s.failures}))};
          }
          fs.mkdirSync('.validation',{recursive:true});
          fs.writeFileSync('.validation/smoke-diagnostic.json',JSON.stringify(out,null,2)+'\n');
          NODE
          git config user.name 'Stackfall validation bot'
          git config user.email 'stackfall-validation@users.noreply.github.com'
          git add .validation/smoke-diagnostic.json
          git commit -m 'Record cleanup 7 smoke diagnostic [skip ci]' || true
          git push origin HEAD:validation/canonical-cleanup-7-final
      - name: Report smoke result
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='test-results/stackfall-smoke.json';
          if(!fs.existsSync(p)){console.error('SMOKE_RESULT_MISSING');process.exit(1);}
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          console.log('SMOKE_DIAGNOSTIC='+JSON.stringify({ok:r.ok,failures:r.failures,skips:r.skips,scenarios:r.scenarios?.map(s=>({name:s.name,ok:s.ok,failures:s.failures}))}));
          if(!r.ok)process.exit(1);
          NODE
      - name: Persist validated clean source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .validation test-results
          rm -f .github/workflows/canonical-cleanup-7-final.yml
          rm -f .github/workflows/canonical-cleanup-gate-temp.yml
          rm -f .github/workflows/canonical-export-temp.yml
          rm -f .github/workflows/canonical-audit-temp.yml
          rm -rf .github/tmp
          git config user.name 'Stackfall validation bot'
          git config user.email 'stackfall-validation@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Persist validated canonical cleanup 7 [skip ci]'
          git push origin HEAD:validation/canonical-cleanup-7-final
