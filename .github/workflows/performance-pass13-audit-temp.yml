name: Temporary Stackfall performance pass 13 audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-pass13-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Audit long-run allocation and lifecycle hotspots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files=sorted(Path('src').rglob('*.js'))
          categories={
            'listeners/timers': [r'addEventListener\s*\(',r'setInterval\s*\(',r'setTimeout\s*\(',r'requestAnimationFrame\s*\('],
            'array allocations': [r'\.filter\s*\(',r'\.map\s*\(',r'\.slice\s*\(',r'\.flatMap\s*\(',r'Array\.from\s*\(',r'Object\.entries\s*\(',r'Object\.values\s*\('],
            'sorting': [r'\.sort\s*\('],
            'per-frame clocks': [r'performance\.now\s*\(',r'Date\.now\s*\('],
            'cache/container growth': [r'new Map\s*\(',r'new Set\s*\(',r'\.set\s*\(',r'\.push\s*\('],
          }
          hot_hints=('update','draw','render','tick','frame','projectile','particle','enemy','gem','hud','spawn','loop','combat')
          for title,patterns in categories.items():
            print(f'\n=== {title} ===')
            rx=[re.compile(p) for p in patterns]
            count=0
            for p in files:
              lines=p.read_text(encoding='utf-8').splitlines()
              for i,line in enumerate(lines,1):
                if any(r.search(line) for r in rx):
                  context=' '.join(lines[max(0,i-3):min(len(lines),i+1)]).lower()
                  score=sum(h in context for h in hot_hints)
                  if score or title in ('listeners/timers','per-frame clocks'):
                    print(f'{p}:{i}: {line.strip()}')
                    count+=1
                    if count>=220:
                      print('... truncated ...');break
              if count>=220:break

          print('\n=== suspicious state containers declared or lazily grown ===')
          for p in files:
            lines=p.read_text(encoding='utf-8').splitlines()
            for i,line in enumerate(lines,1):
              s=line.strip()
              if re.search(r'(state\.|player\.|window\.)[A-Za-z_$][\w$]*\s*=\s*(?:new Map|new Set|\[\]|\{\})',s) or re.search(r'\|\|\s*\[\]|\|\|\s*\{\}',s):
                print(f'{p}:{i}: {s}')

          print('\n=== top files by allocation-like calls ===')
          rows=[]
          alloc_rx=re.compile(r'\.filter\s*\(|\.map\s*\(|\.slice\s*\(|\.flatMap\s*\(|Object\.entries\s*\(|Object\.values\s*\(|new Map\s*\(|new Set\s*\(|setTimeout\s*\(|requestAnimationFrame\s*\(')
          for p in files:
            n=sum(1 for line in p.read_text(encoding='utf-8').splitlines() if alloc_rx.search(line))
            if n:rows.append((n,str(p)))
          for n,p in sorted(rows,reverse=True)[:30]:print(f'{n:4d} {p}')
          PY
