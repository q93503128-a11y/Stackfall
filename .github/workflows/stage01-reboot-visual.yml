name: Stage 1 visual audit

on:
  push:
    branches: [main]
    paths:
      - 'src/stage01-visual-reboot.js'
      - 'src/stage01-complete.js'
      - 'src/stage01-closure-art.js'
      - 'src/stage01-audio-polish.js'
      - 'src/stage-world-reboot-metadata.js'
      - 'src/run-modes.js'
      - 'src/stage-runtime.js'
      - 'src/stage-physical-objects.js'
      - 'src/elite-renderers.js'
      - 'src/render*.js'
      - 'scripts/stage01-reboot-visual.mjs'
      - '.github/workflows/stage01-reboot-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Korean capture fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          echo '0.0.0.0 fonts.googleapis.com fonts.gstatic.com' | sudo tee -a /etc/hosts
      - name: Capture Stage 1 final frames
        env:
          STACKFALL_CHROME: /usr/bin/google-chrome
        run: node scripts/stage01-reboot-visual.mjs
      - name: Upload Stage 1 frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage01-final-visual
          path: test-results/stage01-reboot
          if-no-files-found: error
