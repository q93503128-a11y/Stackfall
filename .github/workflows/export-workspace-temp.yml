name: Export workspace temp

on:
  push:
    branches:
      - fix/magnet-apex-runtime-audit

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: stackfall-workspace-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
