name: Achievement redesign audit

on:
  pull_request:
    paths:
      - 'src/endless-progression-v2.js'
      - 'src/run-modes.js'
      - 'scripts/achievement-redesign-contract.mjs'
      - 'scripts/achievement-redesign-browser.mjs'
      - '.github/workflows/achievement-redesign-audit.yml'
  workflow_dispatch:

jobs:
  achievement-redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check src/endless-progression-v2.js
      - name: Validate achievement redesign contract
        run: node scripts/achievement-redesign-contract.mjs
      - name: Validate achievement browser behavior
        run: node scripts/achievement-redesign-browser.mjs
