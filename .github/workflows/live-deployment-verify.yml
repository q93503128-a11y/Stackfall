name: Verify Stackfall live deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for deployed asset fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected=$(node --input-type=module -e "import {computeBuildFingerprint} from './scripts/build-fingerprint.mjs'; console.log(computeBuildFingerprint(process.cwd()).sha)")
          mkdir -p test-results
          printf '%s\n' "$expected" > test-results/expected-build-fingerprint.txt
          echo "expected=$expected"
          for attempt in $(seq 1 24); do
            body=$(curl -fsS "https://stackfall.pages.dev/src/build-info.js?build-check=${GITHUB_SHA}-${attempt}" || true)
            if printf '%s' "$body" | grep -Fq "$expected"; then
              echo "deployed fingerprint matched on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: deployment not ready"
            sleep 15
          done
          echo "deployed fingerprint did not match $expected" >&2
          exit 1
      - name: Verify Search Console ownership file
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl -fsS "https://stackfall.pages.dev/googlea1b39620fd8849c7.html?ownership-check=${GITHUB_SHA}-${attempt}" -o test-results/search-console-verification.txt && cmp -s googlea1b39620fd8849c7.html test-results/search-console-verification.txt; then
              echo "ownership file matched on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: ownership file not ready"
            sleep 15
          done
          echo "ownership file did not match repository source" >&2
          exit 1
      - name: Prepare CI Chrome wrapper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/stackfall-chrome" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          profile=''
          args=()
          for arg in "$@"; do
            case "$arg" in
              --user-data-dir=*)
                profile="${arg#--user-data-dir=}"
                args+=("$arg")
                ;;
              --remote-debugging-port=0)
                args+=("--remote-debugging-port=9223" "--remote-debugging-address=127.0.0.1")
                ;;
              *) args+=("$arg") ;;
            esac
          done
          args+=("--no-sandbox" "--disable-dev-shm-usage")
          if [[ -n "$profile" ]]; then
            mkdir -p "$profile"
            (
              for _ in $(seq 1 100); do
                printf '9223\n' > "$profile/DevToolsActivePort" 2>/dev/null || true
                sleep 0.1
              done
            ) &
          fi
          exec /usr/bin/google-chrome "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/stackfall-chrome"
      - name: Live browser smoke
        env:
          STACKFALL_CHROME: ${{ runner.temp }}/stackfall-chrome
        run: node scripts/run-live-smoke.mjs --url=https://stackfall.pages.dev --result=test-results/live-smoke.json
      - name: Publish live smoke status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'test-results/live-smoke.json';
            let state = 'failure';
            let description = 'live smoke did not produce a result';
            if (fs.existsSync(path)) {
              const result = JSON.parse(fs.readFileSync(path, 'utf8'));
              state = result.ok ? 'success' : 'failure';
              const deployed = result.deployedBuildSha || 'missing build fingerprint';
              description = result.ok
                ? `live smoke passed: ${deployed}`
                : `live smoke failed: ${(result.failures || []).length} assertion(s)`;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'stackfall/live-smoke',
              description: description.slice(0, 140),
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Upload live smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackfall-live-smoke
          path: test-results
          if-no-files-found: ignore
