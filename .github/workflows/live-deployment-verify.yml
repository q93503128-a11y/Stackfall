name: Verify Stackfall live deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Harden Chrome shutdown and profile cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/browser-smoke.mjs')
          text=path.read_text()
          old="""  if(browser&&!browser.killed){browser.kill();await Promise.race([new Promise(done=>browser.once('exit',done)),sleep(3000)]);}
  const tempRoot=resolve(tmpdir())+sep,target=resolve(profile);if(target.startsWith(tempRoot)){try{rmSync(target,{recursive:true,force:true,maxRetries:5,retryDelay:200});}catch(error){failures.push(`[harness] temporary profile cleanup failed: ${error.message}`);}}"""
          new="""  if(browser&&browser.exitCode===null){browser.kill();await Promise.race([new Promise(done=>browser.once('exit',done)),sleep(3000)]);if(browser.exitCode===null){browser.kill('SIGKILL');await Promise.race([new Promise(done=>browser.once('exit',done)),sleep(2000)]);}}
  const tempRoot=resolve(tmpdir())+sep,target=resolve(profile);if(target.startsWith(tempRoot)){let cleanupError=null;for(let attempt=0;attempt<8;attempt++){try{rmSync(target,{recursive:true,force:true,maxRetries:3,retryDelay:200});cleanupError=null;break;}catch(error){cleanupError=error;await sleep(250*(attempt+1));}}if(cleanupError)failures.push(`[harness] temporary profile cleanup failed after retries: ${cleanupError.message}`);}"""
          if new in text:
              print('cleanup hardening already present')
          elif old in text:
              path.write_text(text.replace(old,new))
          else:
              raise SystemExit('cleanup block not found')
          PY
          node --check scripts/browser-smoke.mjs
      - name: Wait for deployed asset fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected=$(node --input-type=module -e "import {computeBuildFingerprint} from './scripts/build-fingerprint.mjs'; console.log(computeBuildFingerprint(process.cwd()).sha)")
          echo "expected=$expected"
          for attempt in $(seq 1 24); do
            body=$(curl -fsS "https://stackfall.pages.dev/src/build-info.js?build-check=${GITHUB_SHA}-${attempt}" || true)
            if printf '%s' "$body" | grep -Fq "$expected"; then
              echo "deployed fingerprint matched on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: deployment not ready"
            sleep 15
          done
          echo "deployed fingerprint did not match $expected" >&2
          exit 1
      - name: Live browser smoke
        env:
          STACKFALL_CHROME: /usr/bin/google-chrome
        run: node scripts/browser-smoke.mjs --url=https://stackfall.pages.dev --result=test-results/live-smoke.json
      - name: Commit verified harness repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-smoke-cleanup.yml
          git config user.name "Stackfall Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/browser-smoke.mjs .github/workflows/fix-smoke-cleanup.yml
          if ! git diff --cached --quiet; then
            git commit -m "Harden browser smoke profile cleanup"
            git push origin HEAD:main
          fi
      - name: Publish live smoke status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'test-results/live-smoke.json';
            let state = 'failure';
            let description = 'live smoke did not produce a result';
            if (fs.existsSync(path)) {
              const result = JSON.parse(fs.readFileSync(path, 'utf8'));
              state = result.ok ? 'success' : 'failure';
              const deployed = result.deployedBuildSha || 'missing build fingerprint';
              description = result.ok
                ? `live smoke passed: ${deployed}`
                : `live smoke failed: ${(result.failures || []).length} assertion(s)`;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'stackfall/live-smoke',
              description: description.slice(0, 140),
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Upload live smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackfall-live-smoke
          path: test-results
          if-no-files-found: ignore
