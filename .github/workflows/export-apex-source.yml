name: Export apex tuning source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apex-pattern-timer-balance
      - uses: actions/upload-artifact@v4
        with:
          name: apex-tuning-source
          path: |
            .
            !.git
