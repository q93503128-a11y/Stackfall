name: Temporary Stackfall performance pass 9

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-pass9-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate patch script
        run: python -m py_compile scripts/performance-pass9-temp.py
      - name: Apply performance pass 9
        run: python scripts/performance-pass9-temp.py
      - name: Validate optimized runtime and regenerate build fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Commit optimized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/systems-base.js src/systems.js src/performance-guard.js src/build-info.js scripts/performance-audit-contract.mjs
          git diff --cached --check
          git commit -m 'perf: pool transient combat effect descriptors'
          git push origin HEAD:main
