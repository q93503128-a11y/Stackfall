name: Cleanup 9 runner temp

on:
  push:
    branches:
      - cleanup9-runtime-ownership-validation

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup9-runtime-ownership-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute canonicalization script from transformer source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/cleanup9-transform-temp.yml').read_text(encoding='utf-8')
          start_marker="          python3 - <<'PY'\n"
          end_marker="\n          PY\n"
          start=source.index(start_marker)+len(start_marker)
          end=source.index(end_marker,start)
          body=source[start:end]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(code,'cleanup9-transform','exec'),{})

          contract_path=Path('scripts/awakening-first-set-contract.mjs')
          contract=contract_path.read_text(encoding='utf-8')
          old='source.includes("if(!awake(\'core\'))return baseSpawnCoreShot")'
          new='source.includes("registerCoreShotInterceptor(\'weapon-awakening-effects-a1-a7.js:stellarCoreShot\'")&&source.includes("if(!awake(\'core\'))return next(target,echoed)")'
          if contract.count(old)!=1:
              raise SystemExit(f'awakening contract legacy assertion count={contract.count(old)}')
          contract_path.write_text(contract.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate transformed tree
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src -type f -name '*.js' -print0 | sort -z)
          node scripts/runtime-ownership-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Commit validated production tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cleanup9-transform-temp.yml .github/workflows/cleanup9-runner-temp.yml
          git add src scripts
          git diff --cached --check
          git config user.name coworkaccount
          git config user.email cyp1jhh2@gmail.com
          git commit -m 'Validate Cleanup 9 runtime ownership tree'
          git push origin HEAD:cleanup9-runtime-ownership-validation
