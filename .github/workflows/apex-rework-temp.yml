name: Temporary Stackfall Apex Rework

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apex-rework-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate patch scripts
        run: |
          python -m py_compile scripts/apex-rework-temp.py
          python -m py_compile scripts/apex-rework-finalize-temp.py
      - name: Apply Apex rework
        run: |
          python scripts/apex-rework-temp.py
          python scripts/apex-rework-finalize-temp.py
      - name: Check changed JavaScript
        run: |
          node --check src/boss-patterns.js
          node --check src/bosses.js
          node --check src/elite-renderers.js
          node --check src/dark-cosmic-polish.js
          node --check src/render-space.js
          node --check src/boss-catalog.js
          node --check scripts/apex-encounter-contract.mjs
          node --check scripts/community-feedback-contract.mjs
          node --check scripts/polish-contract-check.mjs
          node --check scripts/endgame-balance-contract.mjs
          node --check scripts/performance-audit-contract.mjs
          node --check scripts/source-ownership-contract.mjs
      - name: Check Apex contracts
        run: |
          node scripts/apex-encounter-contract.mjs
          node scripts/community-feedback-contract.mjs
          node scripts/polish-contract-check.mjs
          node scripts/endgame-balance-contract.mjs
          node scripts/performance-audit-contract.mjs
          OWNERSHIP_GROUP=docs node scripts/source-ownership-contract.mjs
      - name: Check production contracts
        run: node scripts/build-fingerprint.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit Apex rework
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/GAME_DESIGN.md docs/WIKI.md src/boss-patterns.js src/bosses.js src/elite-renderers.js src/dark-cosmic-polish.js src/render-space.js src/boss-catalog.js scripts/apex-encounter-contract.mjs scripts/community-feedback-contract.mjs scripts/polish-contract-check.mjs scripts/endgame-balance-contract.mjs scripts/performance-audit-contract.mjs scripts/source-ownership-contract.mjs src/build-info.js
          git diff --cached --quiet && { echo 'No Apex changes'; exit 1; }
          git commit -m "feat: rework apex identities and combat pressure"
          git push origin HEAD:main

# trigger: synced-apex-docs
