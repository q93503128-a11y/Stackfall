name: Apply enemy projectile normalization

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/enemy-projectile-normalization
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-projectiles/part* | base64 -d | gzip -dc > .tmp-projectiles/apply.mjs
          echo 'fd732352046b6ec5f41e94c0673c3ba7d9ae8fada11a15e8733a3f6ea6726c06  .tmp-projectiles/apply.mjs' | sha256sum -c -
          node --check .tmp-projectiles/apply.mjs
          node .tmp-projectiles/apply.mjs
          node scripts/build-fingerprint.mjs
      - name: Syntax and contract checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
          node scripts/polish-contract-check.mjs
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/ --result=test-results/enemy-projectiles-smoke.json
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stackfall-maintenance-bot'
          git config user.email 'stackfall-maintenance-bot@users.noreply.github.com'
          git add README.md docs/GAME_DESIGN.md docs/WIKI.md scripts/browser-smoke.mjs scripts/polish-contract-check.mjs src/systems-base.js src/boss-catalog.js src/boss-patterns.js src/bosses.js src/render-entities.js src/performance-guard.js src/build-info.js
          git diff --cached --check
          git commit -m 'Normalize enemy projectiles and swept collisions'
          git push origin HEAD:agent/enemy-projectile-normalization
