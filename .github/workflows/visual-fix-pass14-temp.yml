name: Temporary Stackfall visual fix pass 14

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-fix-pass14-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate patch script
        run: python -m py_compile scripts/visual-fix-pass14-temp.py
      - name: Apply live visual QA fixes
        run: python scripts/visual-fix-pass14-temp.py
      - name: Validate fixes
        shell: bash
        run: |
          set -euo pipefail
          node --check src/interface.js
          node --check src/ability-ledger-audit.js
          node --check scripts/community-feedback-contract.mjs
          node scripts/community-feedback-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Commit visual fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css src/interface.js src/ability-ledger-audit.js scripts/community-feedback-contract.mjs src/build-info.js
          git diff --cached --check
          git commit -m 'fix: resolve mobile visual QA regressions'
          git push origin HEAD:main
# trigger pass 14 visual repair rerun
