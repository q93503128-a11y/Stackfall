name: tmp-answer-v16-finalize
on:
  push:
    branches:
      - feature/void-apex-answer-v1
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch V16
        run: python scripts/tmp_finalize_v16.py
      - name: Validate
        shell: bash
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/void-apex-answer-contract.mjs
          for f in scripts/*contract*.mjs; do [ "$f" = "scripts/void-apex-answer-contract.mjs" ] || node "$f"; done
          node scripts/build-fingerprint.mjs
      - name: Commit verified result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf assets/answer/.v16
          git rm -f scripts/tmp_finalize_v16.py .github/workflows/tmp-answer-v16-finalize.yml
          for f in assets/answer/answer_cracks_p1.svg assets/answer/answer_cracks_p2.svg assets/answer/answer_cracks_p3.svg assets/answer/answer_cracks_p4.svg; do [ ! -e "$f" ] || git rm "$f"; done
          git add src/void-apex-answer-v1.js scripts/void-apex-answer-contract.mjs scripts/build-fingerprint.mjs assets/answer/answer_body_v16.b64
          git commit -m "Replace Answer with approved dark cosmic body"
          git push origin HEAD:feature/void-apex-answer-v1
