name: Fingerprint probe
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print public asset fingerprint
        run: node --input-type=module -e "import {computeBuildFingerprint} from './scripts/build-fingerprint.mjs'; console.log('STACKFALL_EXPECTED='+computeBuildFingerprint(process.cwd()).sha)"
