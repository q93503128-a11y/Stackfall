name: Apex runtime temp

on:
  push:
    branches:
      - fix/magnet-apex-runtime-audit

permissions:
  contents: read

jobs:
  apex-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate Last Constellation repro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apex-foundation-browser.mjs')
          s=p.read_text()
          old="for(const form of ['chronophage','starforge','lastconstellation']){"
          new="for(const form of ['lastconstellation']){"
          if old not in s:
              raise SystemExit('expected Apex form loop not found')
          s=s.replace(old,new,1)
          old_before="const before=await probe('({clock:stackfallApexClockDiagnostics(),boss:state.entities.enemies.find(e=>e.id===state.apexActiveId)})');"
          new_before="const before=await probe(`(()=>{const b=state.entities.enemies.find(e=>e.id===state.apexActiveId);return{clock:stackfallApexClockDiagnostics(),boss:{id:b?.id,apexElapsed:b?.apexElapsed,skillCd:b?.skillCd,hp:b?.hp,maxHp:b?.maxHp,phase:b?.apexPhase}};})()`);"
          if old_before not in s:
              raise SystemExit('expected Apex before snapshot not found')
          p.write_text(s.replace(old_before,new_before,1))
          PY
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/stackfall-http.log 2>&1 &
          echo $! > /tmp/stackfall-http.pid
          sleep 1
      - name: Run real Apex browser QA
        env:
          STACKFALL_ALLOW_GPU_SKIP: '1'
          STACKFALL_ALLOW_CONTEXT_SKIP: '1'
        run: node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/ --apex-only
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-runtime-evidence-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
