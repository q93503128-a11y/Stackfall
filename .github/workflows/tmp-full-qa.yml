name: One-shot full endless visual QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-full-qa.yml'

permissions:
  contents: read

jobs:
  runtime-visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser QA and capture bosses + awakenings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/bosses/mini audit/bosses/boss audit/bosses/void audit/bosses/apex audit/awakenings
          python3 -m http.server 4173 >/tmp/stackfall-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          cat > ./stackfall-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1280,height:720},deviceScaleFactor:1});
          const pageErrors=[];
          const consoleErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
          page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
          await page.goto('http://127.0.0.1:4173/?dev=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.stackfallDeveloperTest?.enabled===true,{timeout:20000});

          async function prep(){
            await page.evaluate(()=>{
              const api=window.stackfallDeveloperTest;
              if(window.stackfallMeta && window.STACKFALL_FEATURE_DEFS){
                window.stackfallMeta.unlockedFeatures=Object.keys(window.STACKFALL_FEATURE_DEFS);
                window.stackfallSaveMeta?.();
              }
              api.startEndless();
              api.setInvincible(true);
              api.setLevelUpsDisabled(true);
              state.weaponSlots=[]; state.weaponStacks={}; state.awakenedWeapons={};
              player.x=0; player.y=0; state.camera.x=0; state.camera.y=0;
              for(const value of Object.values(state.entities||{})) if(Array.isArray(value)) value.length=0;
              state.bossActiveId=null; state.apexActiveId=null; state.apexArena=null;
              updateHUD?.(); renderLoadout?.();
            });
            await page.waitForTimeout(180);
          }

          async function spawnForm(category,form,phase='base'){
            await prep();
            const info=await page.evaluate(({category,form,phase})=>{
              const e=window.stackfallSpawnEliteForm?.(category,form);
              if(!e) throw new Error(`failed to spawn ${category}:${form}`);
              e.x=player.x+220; e.y=player.y; e.speed=0; e.damage=0;
              e.maxHp=Math.max(1000000,Number(e.maxHp)||0); e.hp=e.maxHp;
              state.bossActiveId=e.id;
              if(category==='apex'){
                state.apexActiveId=e.id;
                state.apexArena={x:player.x,y:player.y,r:470};
                if(phase==='final') e.hp=e.maxHp*.12;
              }
              return {id:e.id,name:typeof bossDisplayName==='function'?bossDisplayName(e):(e.name||form),category,form};
            },{category,form,phase});
            await page.waitForTimeout(phase==='final'?1500:900);
            return info;
          }

          const pools={
            mini:['knight','warden','executioner','colossus','harvester','mirror'],
            boss:['eclipse','seraph','pulsar','leviathan','archivist','heliarch','tempest','nullengine'],
            void:['maw','oracle','weaver','grave','paradox'],
            apex:['chronophage','starforge','lastconstellation']
          };
          const bossResults=[];
          for(const category of ['mini','boss','void']){
            for(const form of pools[category]){
              const info=await spawnForm(category,form);
              await page.screenshot({path:`audit/bosses/${category}/${form}.png`,fullPage:false});
              bossResults.push(info);
            }
          }
          for(const form of pools.apex){
            let info=await spawnForm('apex',form,'base');
            await page.screenshot({path:`audit/bosses/apex/${form}-base.png`,fullPage:false});
            bossResults.push({...info,phase:'base'});
            info=await spawnForm('apex',form,'final');
            await page.screenshot({path:`audit/bosses/apex/${form}-final.png`,fullPage:false});
            bossResults.push({...info,phase:'final'});
          }

          const awakeningKeys=await page.evaluate(()=>Object.keys(window.stackfallAwakeningDefs||{}));
          const awakeningResults=[];
          for(const key of awakeningKeys){
            const errorsBefore=pageErrors.length;
            await page.evaluate(key=>{
              const api=window.stackfallDeveloperTest;
              api.startEndless(); api.setInvincible(true); api.setLevelUpsDisabled(true);
              if(window.stackfallMeta && window.STACKFALL_FEATURE_DEFS){
                window.stackfallMeta.unlockedFeatures=Object.keys(window.STACKFALL_FEATURE_DEFS);
                window.stackfallSaveMeta?.();
              }
              for(const value of Object.values(state.entities||{})) if(Array.isArray(value)) value.length=0;
              api.equipOnly(key,6,true);
              player.x=0; player.y=0; state.camera.x=0; state.camera.y=0;
              const e=spawnEnemy('boss');
              if(e){e.x=230;e.y=0;e.speed=0;e.damage=0;e.maxHp=Math.max(1000000,e.maxHp||0);e.hp=e.maxHp;state.bossActiveId=e.id;}
              for(let i=0;i<7;i++){
                const m=spawnEnemy('normal'); if(!m) continue;
                const a=i/7*Math.PI*2; m.x=Math.cos(a)*(150+i*9);m.y=Math.sin(a)*(150+i*9);m.speed=0;m.damage=0;m.maxHp=Math.max(250000,m.maxHp||0);m.hp=m.maxHp;
              }
            },key);
            const before=await page.evaluate(()=>({hp:(state.entities.enemies||[]).reduce((s,e)=>s+(e?.hp||0),0),kills:state.kills||0}));
            await page.waitForTimeout(2200);
            await page.screenshot({path:`audit/awakenings/${key}.png`,fullPage:false});
            await page.waitForTimeout(1400);
            const after=await page.evaluate(key=>{
              const entityCounts={}; for(const [name,value] of Object.entries(state.entities||{})) if(Array.isArray(value)) entityCounts[name]=value.length;
              return {armed:state.awakenedWeapons?.[key]===true && (state.weaponStacks?.[key]||0)>=6,stack:state.weaponStacks?.[key]||0,hp:(state.entities.enemies||[]).reduce((s,e)=>s+(e?.hp||0),0),kills:state.kills||0,entityCounts};
            },key);
            awakeningResults.push({key,armed:after.armed,stack:after.stack,hpDelta:Math.max(0,before.hp-after.hp),killDelta:Math.max(0,after.kills-before.kills),entityCounts:after.entityCounts,newPageErrors:pageErrors.slice(errorsBefore)});
            if(!after.armed) throw new Error(`awakening did not arm: ${key}`);
            if(pageErrors.length>errorsBefore) throw new Error(`runtime error during awakening ${key}: ${pageErrors.slice(errorsBefore).join(' | ')}`);
          }

          const runtime=await page.evaluate(()=>({eventClockKeys:Object.keys(state.eventClocks||{}),mode:window.stackfallCurrentRunConfig?.().mode||null,awakeningCount:Object.keys(window.stackfallAwakeningDefs||{}).length}));
          const manifest={bossResults,awakeningResults,runtime,pageErrors,consoleErrors};
          fs.writeFileSync('audit/manifest.json',JSON.stringify(manifest,null,2));
          await browser.close();
          if(pageErrors.length) throw new Error(`page errors: ${pageErrors.join(' | ')}`);
          JS
          node ./stackfall-qa.mjs
          rm -f ./stackfall-qa.mjs
          echo '--- audit manifest summary ---'
          node -e "const m=require('./audit/manifest.json'); console.log(JSON.stringify({bossShots:m.bossResults.length,awakenings:m.awakeningResults.length,eventClockKeys:m.runtime.eventClockKeys,pageErrors:m.pageErrors,consoleErrors:m.consoleErrors.slice(0,5)},null,2))"
      - name: Upload QA captures
        uses: actions/upload-artifact@v4
        with:
          name: stackfall-full-qa-captures
          path: audit
          if-no-files-found: error
          retention-days: 2
