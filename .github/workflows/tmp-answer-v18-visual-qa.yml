name: tmp-answer-v18-visual-qa
on:
  push:
    branches: [feature/void-apex-answer-v1]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
      - name: Capture Answer V18 runtime geometry
        run: |
          mkdir -p qa-answer-v18
          cat > qa-answer-v18-run.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const expected='sha256-bdba9364c8bc87aeabaf35f447090394bf9cc92f3c54fc83b2711b7d556f2386';
          const browser=await chromium.launch({channel:'chrome',headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:900},deviceScaleFactor:1});
          const errors=[],samples=[];
          page.on('pageerror',e=>errors.push('PAGE '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text());});
          async function waitBuild(){for(let i=0;i<18;i++){await page.goto(`https://feature-void-apex-answer-v1.stackfall.pages.dev/?dev=1&t=${Date.now()}`,{waitUntil:'networkidle',timeout:60000});if(await page.evaluate(e=>window.STACKFALL_BUILD_SHA===e,expected))return;await page.waitForTimeout(2500);}throw new Error('Preview did not reach expected build fingerprint');}
          await waitBuild();
          await page.waitForFunction(()=>window.stackfallDeveloperTest&&window.stackfallAnswerCombatForcePattern&&window.stackfallAnswerCombatDiagnostics,{timeout:30000});
          const boot=await page.evaluate(()=>{state.mode='playing';state.choiceLocked=false;state.choiceOpening=false;state.xp=0;if(state.entities?.gems)state.entities.gems.length=0;if(state.entities?.enemies)state.entities.enemies.length=0;if(state.entities?.enemyProjectiles)state.entities.enemyProjectiles.length=0;return window.stackfallDeveloperTest.startAnswerPrototype();});
          await page.waitForFunction(()=>document.documentElement.dataset.answerPreview==='1',{timeout:20000});
          await page.evaluate(()=>{const menu=document.querySelector('#menu');if(menu)menu.style.display='none';const panel=document.querySelector('#stackfallDevPanel');if(panel)panel.style.display='none';for(const el of document.querySelectorAll('button'))if(el.textContent?.trim()==='DEV')el.style.display='none';player.invuln=999;});
          const snap=async label=>samples.push({label,combat:await page.evaluate(()=>window.stackfallAnswerCombatDiagnostics?.())});
          async function shot(path){await page.screenshot({path:`qa-answer-v18/${path}.png`});await snap(path);}
          async function resetPhase(phase){await page.evaluate(p=>{window.stackfallAnswerCombatForcePhase(p);player.invuln=999;},phase);await page.waitForTimeout(140);}
          await resetPhase(1);await shot('00-p1');
          await page.evaluate(()=>{const d=window.stackfallAnswerCombatDiagnostics(),c=document.createElement('canvas');c.id='qaGeometryOverlay';c.width=innerWidth;c.height=innerHeight;c.style='position:fixed;inset:0;z-index:999999;pointer-events:none';document.body.append(c);const g=c.getContext('2d'),p=d.bodyPolygonScreen;g.strokeStyle='rgba(0,255,180,.95)';g.lineWidth=2;g.setLineDash([6,5]);g.beginPath();g.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)g.lineTo(p[i].x,p[i].y);g.closePath();g.stroke();if(d.bodyTarget){g.fillStyle='#00ffb4';g.beginPath();g.arc(d.bodyTarget.x,d.bodyTarget.y,6,0,Math.PI*2);g.fill();}if(d.fissureRoot){g.fillStyle='#ffdb4d';g.beginPath();g.arc(d.fissureRoot.x,d.fissureRoot.y,6,0,Math.PI*2);g.fill();}});await shot('01-body-geometry');await page.evaluate(()=>document.querySelector('#qaGeometryOverlay')?.remove());
          await resetPhase(1);await page.evaluate(()=>window.stackfallAnswerCombatForcePattern('spike'));
          await page.waitForFunction(()=>{const s=window.stackfallAnswerCombatDiagnostics?.().spikeDetails?.[0];return s&&s.age>.55&&s.age<s.warn;});await shot('02-spike-warning');
          await page.waitForFunction(()=>{const s=window.stackfallAnswerCombatDiagnostics?.().spikeDetails?.[0];return s&&s.age>s.warn+.08&&s.age<s.warn+s.thrust+s.hold;});await shot('03-spike-active');
          await resetPhase(2);await shot('04-p2-fissures');
          await page.evaluate(()=>window.stackfallAnswerCombatForcePattern('beam'));
          await page.waitForFunction(()=>{const m=window.stackfallAnswerCombatDiagnostics?.().majorDetails;return m?.kind==='beam'&&m.age>.9&&m.age<m.warn;});await shot('05-beam-warning');
          await page.waitForFunction(()=>{const m=window.stackfallAnswerCombatDiagnostics?.().majorDetails;return m?.kind==='beam'&&m.age>m.warn+.09&&m.age<m.warn+m.active;});await shot('06-beam-active');
          await resetPhase(3);await shot('07-p3-fissures');
          await resetPhase(1);await page.evaluate(()=>{const d=window.stackfallAnswerCombatDiagnostics(),e=state.entities.enemies.find(x=>x?.answerBoss),p=d.bodyPolygonScreen[Math.floor(d.bodyPolygonScreen.length*.72)],cam=window.stackfallVoidApexAnswerDiagnostics().camera,w={x:cam.x+p.x-innerWidth/2,y:cam.y+p.y-innerHeight/2};enemyCircleOverlap(e,w.x,w.y,5);dealDamage(e,1,{source:'qa-impact'});});await page.waitForTimeout(55);await shot('08-impact-location');
          const diag=await page.evaluate(()=>({build:window.STACKFALL_BUILD_SHA,answer:window.stackfallVoidApexAnswerDiagnostics?.(),combat:window.stackfallAnswerCombatDiagnostics?.(),mode:state.mode,hp:player.hp,maxHp:player.maxHp}));
          fs.writeFileSync('qa-answer-v18/report.json',JSON.stringify({boot,diag,samples,errors},null,2));
          await browser.close();
          if(errors.length){console.log(errors.join('\n'));process.exitCode=1;}
          EOF
          node qa-answer-v18-run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: answer-v18-visual-qa
          path: qa-answer-v18
          retention-days: 1
