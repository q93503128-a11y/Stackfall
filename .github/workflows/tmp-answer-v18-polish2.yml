name: tmp-answer-v18-polish2
on:
  push:
    branches: [feature/void-apex-answer-v1]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run Answer V18 second-pass visual patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply second-pass visual patch
        run: python scripts/tmp-answer-v18-polish2.py
      - name: Parse changed JavaScript
        run: |
          node --check src/void-apex-answer-combat-v1.js
          node --check src/void-apex-answer-v1.js
          node --check scripts/void-apex-answer-contract.mjs
      - name: Focused Answer contract
        run: node scripts/void-apex-answer-contract.mjs
      - name: Full validation and fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Recheck focused contract
        run: node scripts/void-apex-answer-contract.mjs
      - name: Verify second-pass invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "profile=[[0,1.10],[.04,1.24],[.10,.78]" src/void-apex-answer-combat-v1.js
          grep -F "{phase:2,points:[[.392,.600]" src/void-apex-answer-combat-v1.js
          grep -F "{phase:3,points:[[.302,.620]" src/void-apex-answer-combat-v1.js
          grep -F "bud=spikePolygon(s,.06+.07*p)" src/void-apex-answer-combat-v1.js
          grep -F "runtime.lastImpactUsed=" src/void-apex-answer-combat-v1.js
          grep -F "visualRevision:'v18'" src/void-apex-answer-v1.js
          ! grep -F "phase:1,major:true" src/void-apex-answer-combat-v1.js
          git diff --check
      - name: Commit verified second pass
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-answer-v18-polish2.yml
          rm -f scripts/tmp-answer-v18-polish2.py
          node scripts/void-apex-answer-contract.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine Answer tendril spikes and fissure growth'
          git push origin HEAD:feature/void-apex-answer-v1
