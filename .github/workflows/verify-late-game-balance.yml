name: Verify late-game balance expansion

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/late-game-prism-search-console
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if text.count(old)<count:
                  raise SystemExit(f'{path}: expected replacement not found: {old[:100]!r}')
              p.write_text(text.replace(old,new,count),encoding='utf-8')

          replace('src/map-event-expansion.js',
            "armChoiceClock(LIMITS.choice,()=>{if(locked)return;locked=true;(timeoutAction||(()=>cards[0]?.action()))();});",
            "clearChoiceClock();")
          replace('src/map-event-expansion.js',
            "function openVault(){const pool=[card('▲',tx('power')",
            "function openVault(){const pool=[...(stat('multiplicity')<PASSIVES.multiplicity.max?[card('✣',lang()==='ko'?'다중 투영 코어':'PROJECTION CORE',lang()==='ko'?'투사체·칼날·프리즘·드론 등 실제 공격체 수 +1. 최대 2중첩.':'Adds one real attack body to projectiles, blades, prisms and drones. Max 2 stacks.','#9fe8ff',()=>{const before=stat('multiplicity');state.passives.multiplicity=before+1;showUpgradeNotice('NEBULA ARCHIVE',[{name:passiveText('multiplicity').name,before,after:stat('multiplicity')}]);finishChoice('vault');})]:[]),card('▲',tx('power')")
          replace('src/progression-expansion.js',
            "for(const[key,p]of Object.entries(PASSIVES))if(stat(key)<p.max)fallback.push",
            "for(const[key,p]of Object.entries(PASSIVES))if(!p.eventOnly&&stat(key)<p.max)fallback.push")
          replace('src/bosses.js',
            "const base=Math.atan2(dy,dx),shots=threat>=9?2:1;for(let i=0;i<shots;i++){const a=base+(i-(shots-1)/2)*.13;",
            "const base=Math.atan2(dy,dx),shots=threat>=9?2:1,angles=shots===2?[0,(e.rangedVolleySide=(e.rangedVolleySide||-1)*-1)*.13]:[0];for(const offset of angles){const a=base+offset;")

          p=Path('src/endgame-balance-expansion.js'); text=p.read_text(encoding='utf-8')
          old="  const baseSpawnEnemyProjectile=spawnEnemyProjectile;let rangedPairIndex=0,rangedPairStamp=-1;spawnEnemyProjectile=function centeredEnemyProjectile(x,y,a,speed,damage,color,r=5,life=4,visual=null){const now=Math.round((state.time||0)*1000);if(visual==='ranged-bolt'||visual==='fan'){if(now!==rangedPairStamp){rangedPairStamp=now;rangedPairIndex=0;}rangedPairIndex++;if(rangedPairIndex===1)a=Math.atan2(player.y-y,player.x-x);}return baseSpawnEnemyProjectile(x,y,a,speed,damage,color,r,life,visual);};\n\n"
          if old not in text: raise SystemExit('enemy projectile wrapper boundary not found')
          text=text.replace(old,'',1)
          marker="  const baseFireNovaPulse=fireNovaPulse;"
          insert="""  const baseFireBoomerang=fireBoomerang;
          fireBoomerang=function multiplicityBoomerang(target,n,echoed=false,origin=null,ricochet=false){baseFireBoomerang(target,n,echoed,origin,ricochet);if(echoed||ricochet||!target)return;const extra=multishotStacks();for(let i=0;i<extra;i++)scheduleWeaponAction(55+i*42,()=>baseFireBoomerang(target,n,false,{x:player.x,y:player.y},true));};
          const baseFireMeteorDrones=fireMeteorDrones;
          fireMeteorDrones=function multiplicityDrones(n,echoed=false){baseFireMeteorDrones(n,echoed);if(echoed)return;const extra=multishotStacks(),targets=nearestEnemies(player.x,player.y,extra,null,weaponRange('drone'));for(let i=0;i<extra;i++){const target=targets[i]||nearestWeaponTarget('drone');if(!target)continue;const a=i/Math.max(1,extra)*TAU+player.angle*.31,x=player.x+Math.cos(a)*(orbitRadiusFor('drone')+18),y=player.y+Math.sin(a)*(orbitRadiusFor('drone')+18),aim=Math.atan2(target.y-y,target.x-x);spawnPlayerProjectile({x,y,vx:Math.cos(aim)*530,vy:Math.sin(aim)*530,r:5.1,life:1.35,maxRange:weaponRange('drone'),damage:(9+n*2.6)*.72,color:'#baffea',pierce:n>=4?1:0,source:'drone-multiplicity',homingTargetId:target.id,homingReacquire:true,homingTurn:3.6});}};
          const baseUpdateWeapons=updateWeapons;
          updateWeapons=function multiplicityOrbitWeapons(dt){baseUpdateWeapons(dt);const extra=multishotStacks(),n=weaponCount('blade');if(!extra||!n)return;player.multiplicityBladeTick=(player.multiplicityBladeTick??0)-dt;if(player.multiplicityBladeTick>0)return;player.multiplicityBladeTick=.14*hasteMult();const orbit=orbitRadiusFor('blade'),bladeR=(n>=6?29:n>=3?23:20)*weaponSizeMultiplier();for(let i=0;i<extra;i++){const a=player.angle+(i+.5)*TAU/extra,bx=player.x+Math.cos(a)*orbit,by=player.y+Math.sin(a)*orbit;forEachNearbyEnemyCandidate(bx,by,bladeR+70,e=>{if(!e.dead&&(e.x-bx)**2+(e.y-by)**2<(e.r+bladeR)**2)dealDamage(e,(5+n*1.7)*.72,{color:'#a9f5ff',source:'blade-multiplicity'});});}};
          const baseDrawEquippedOrbits=drawEquippedOrbits;
          drawEquippedOrbits=function multiplicityOrbitVisuals(x,y,t){baseDrawEquippedOrbits(x,y,t);const extra=multishotStacks();if(!extra)return;const size=weaponSizeMultiplier(),bladeN=weaponCount('blade'),prismN=weaponCount('prism'),droneN=weaponCount('drone');if(bladeN){const orbit=orbitRadiusFor('blade');for(let i=0;i<extra;i++){const a=player.angle+(i+.5)*TAU/extra;ctx.save();ctx.translate(x+Math.cos(a)*orbit,y+Math.sin(a)*orbit);ctx.rotate(a+Math.PI/2);ctx.scale(size*.86,size*.86);ctx.fillStyle='#a9f5ff';ctx.shadowBlur=12;ctx.shadowColor='#7ce8ff';ctx.beginPath();ctx.moveTo(-4,-24);ctx.bezierCurveTo(15,-12,13,12,-2,24);ctx.bezierCurveTo(3,8,1,-8,-4,-24);ctx.fill();ctx.restore();}}if(prismN){const base=prismN>=6?3:prismN>=2?2:1,points=prismPositions(Math.min(5,base+extra));for(let i=base;i<points.length;i++){const s=worldToScreen(points[i].x,points[i].y);ctx.save();ctx.translate(s.x,s.y);ctx.rotate(-points[i].a+t*.00057);ctx.scale(size*.9,size*.9);ctx.fillStyle='#e2d8ff';ctx.shadowBlur=12;ctx.shadowColor='#c2a7ff';ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(7,0);ctx.lineTo(0,9);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();ctx.restore();}}if(droneN){for(let i=0;i<extra;i++){const a=i/Math.max(1,extra)*TAU+player.angle*.31,s=worldToScreen(player.x+Math.cos(a)*(orbitRadiusFor('drone')+18),player.y+Math.sin(a)*(orbitRadiusFor('drone')+18));ctx.save();ctx.translate(s.x,s.y);ctx.rotate(a+Math.PI/2);ctx.fillStyle='#12333c';ctx.strokeStyle='#d5fff4';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(7,5);ctx.lineTo(0,2);ctx.lineTo(-7,5);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}}};

          """
          if marker not in text: raise SystemExit('nova marker not found')
          p.write_text(text.replace(marker,insert+marker,1),encoding='utf-8')

          sections={
            'README.md':"""\n\n### 후반 위협·프리즘·선택 조작\n\n- 성좌 프리즘은 0.25초 기본 피해 틱을 사용하며 공격 주기 감소가 틱 간격을 줄인다. 최대 출력 배율을 낮추고 공격 펄스 사이에 시각적 공백을 둔다.\n- 일반 무기 피해는 프리즘을 제외하고 8% 상향하며, 4분 이후 위협 단계에 따라 적 피해와 이동 속도가 추가 상승한다.\n- 이벤트 능력 선택지는 전투가 멈추므로 자동 선택 제한시간을 사용하지 않는다.\n- 레벨업·보스 보상·이벤트 선택지는 숫자 1·2·3으로 선택할 수 있고 카드에 단축키를 표시한다.\n- 다중 투영 코어는 최대 2중첩의 이벤트 전용 패시브로 투사체와 공전 공격체 수를 늘린다. 일반 레벨업 풀에는 등장하지 않는다.\n- 초월체 등장 간격은 600초(10분)다.\n""",
            'docs/GAME_DESIGN.md':"""\n\n## 후반 성장곡선 및 지속 피해 규칙\n\n- 0~4분에는 추가 후반 보정을 적용하지 않는다. 4분 이후 위협 단계와 경과 시간에 따라 적 피해·속도를 점진적으로 높여 중후반 난도를 유지한다.\n- 어려움 난이도는 적 체력·피해 125%, 속도 110%, 원거리 비중 122%를 사용한다.\n- 부메랑은 왕복 경로의 서로 다른 적을 모두 타격하며 5중첩 잔광은 실제 지속 피해와 저강도 파동으로 표시한다.\n- 혜성 창 5중첩 잔광 항로는 0.17초 간격의 실제 지속 피해를 남기고 입자 궤적으로 판독한다.\n- 회복 강화는 획득 경로와 무관하게 동일한 중첩 보정을 적용한다. 재생 장갑은 중첩당 최대 체력 24와 즉시 회복 40, 자가 복원은 4초마다 중첩당 총 3.5 회복에 해당한다.\n""",
            'docs/WIKI.md':"""\n\n## 숫자 선택·다중 투영·초월체 유산\n\n선택 카드가 열리면 마우스뿐 아니라 1·2·3 키로 선택할 수 있습니다. 이벤트 선택은 전투가 정지된 상태이므로 시간 제한이 없습니다. 성운 보관소 등 특수 보상에서만 나오는 `다중 투영 코어`는 최대 2중첩이며 투사체, 펄스 블레이드, 성좌 프리즘, 유성 드론처럼 화면에 실제로 존재하는 공격체 수를 늘립니다. 능력 탭에서는 패시브·무기 특수효과·초월체 유산 카드를 눌러 상세 효과를 확인할 수 있습니다.\n"""
          }
          for path,addition in sections.items():
              p=Path(path); text=p.read_text(encoding='utf-8')
              marker=addition.strip().splitlines()[0]
              if marker not in text:p.write_text(text.rstrip()+addition,encoding='utf-8')
          PY
          node scripts/build-fingerprint.mjs
      - name: Syntax and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
          node scripts/polish-contract-check.mjs
          node scripts/endgame-balance-contract.mjs
          node scripts/build-fingerprint.mjs --check
          test "$(cat googlea1b39620fd8849c7.html)" = 'google-site-verification: googlea1b39620fd8849c7.html'
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/ --result=test-results/late-game-balance-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: late-game-balance-smoke
          path: test-results
          if-no-files-found: warn
      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stackfall-maintenance-bot'
          git config user.email 'stackfall-maintenance-bot@users.noreply.github.com'
          git add README.md docs/GAME_DESIGN.md docs/WIKI.md googlea1b39620fd8849c7.html index.html scripts/endgame-balance-contract.mjs src/endgame-balance-expansion.js src/map-event-expansion.js src/progression-expansion.js src/bosses.js src/build-info.js
          git diff --cached --check
          git commit -m 'Rebalance prism and strengthen late-game threats'
          git push origin HEAD:agent/late-game-prism-search-console
