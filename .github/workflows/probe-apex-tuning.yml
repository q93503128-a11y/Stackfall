name: Probe apex tuning

on:
  push:
    branches: [agent/apex-pattern-timer-balance]

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/apex-pattern-timer-balance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check applied sources
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'APEX_INTERVAL_SECONDS=480' src/boss-catalog.js
          grep -Fq 'function chronophageSignature' src/boss-patterns.js
          grep -Fq 'function bossAntiIdleSkill' src/boss-patterns.js
          grep -Fq 'c.hp*=.88*d.enemyHp' src/difficulty-augment-expansion.js
          test -f scripts/apex-encounter-contract.mjs
          node scripts/apex-encounter-contract.mjs
      - name: Publish probe status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ steps.verify.outcome }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'stackfall/apex-tuning-probe',
              description: state === 'success' ? 'apex tuning sources and contracts passed' : 'apex tuning sources not applied or contract failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
