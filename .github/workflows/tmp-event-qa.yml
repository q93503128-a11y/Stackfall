name: One-shot Endless event QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-event-qa.yml'

permissions:
  contents: read

jobs:
  event-runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run all Endless event paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p event-qa/screens
          python3 -m http.server 4173 >/tmp/stackfall-event-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          cat > ./event-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:720},deviceScaleFactor:1});
          const pageErrors=[],consoleErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());});
          const results=[];
          const assert=(ok,message)=>{if(!ok)throw new Error(message);};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          await page.goto('http://127.0.0.1:4173/?dev=1',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.stackfallDeveloperTest?.enabled===true&&typeof window.stackfallDeveloperTest.spawnEndlessEvent==='function',{timeout:20000});
          await page.evaluate(()=>{GAME_SETTINGS.audio.master=false;window.stackfallDeveloperTest.startEndless();window.stackfallDeveloperTest.setInvincible(true);window.stackfallDeveloperTest.setLevelUpsDisabled(true);state.startLevelBonusRemaining=0;state.choiceOpening=false;state.choiceLocked=false;state.mode='playing';ui.choice?.classList.add('hidden');});
          await sleep(120);

          async function prep(){
            await page.evaluate(()=>{
              const api=window.stackfallDeveloperTest;api.startEndless();api.setInvincible(true);api.setLevelUpsDisabled(true);api.setDevGameSpeed?.(1);
              state.startLevelBonusRemaining=0;state.choiceOpening=false;state.choiceLocked=false;state.mode='playing';ui.choice?.classList.add('hidden');if(ui.choiceCards)ui.choiceCards.innerHTML='';
              window.closeMapEventOverlays?.();document.querySelector('#worldEventScreen')?.classList.add('hidden');
              if(state.realmTransition)window.cancelRealmTransition?.('space');
              state.mapEventActive=null;for(const key of ['enemies','enemyProjectiles','projectiles','telegraphs','beams','curves','wells','mapEvents']){const list=state.entities?.[key];if(Array.isArray(list))list.length=0;}
              state.bossActiveId=null;state.apexActiveId=null;state.pendingApexForm=null;state.apexArena=null;state.nextApexAt=999999;player.hp=player.maxHp;player.x=0;player.y=0;state.camera.x=0;state.camera.y=0;updateHUD?.();
            });
            await sleep(80);
          }
          async function signalCheck(type){
            await prep();
            const info=await page.evaluate(type=>{const r=window.stackfallDeveloperTest.spawnEndlessEvent(type,false);const m=state.entities.mapEvents?.[0];return{r,count:state.entities.mapEvents?.length||0,markerType:m?.type||null,life:m?.life||0};},type);
            assert(info.r?.ok,`${type}: signal spawn failed ${JSON.stringify(info)}`);assert(info.count===1&&info.markerType===type,`${type}: signal marker mismatch ${JSON.stringify(info)}`);return info;
          }
          async function start(type){
            await prep();
            const info=await page.evaluate(type=>{const r=window.stackfallDeveloperTest.spawnEndlessEvent(type,true);return{r,active:state.mapEventActive?.type||null,overlay:!document.querySelector('#worldEventScreen')?.classList.contains('hidden'),overlayType:document.querySelector('#worldEventScreen')?.dataset.eventType||null,cards:document.querySelectorAll('#worldEventCards .world-event-card').length};},type);
            assert(info.r?.ok,`${type}: immediate start failed ${JSON.stringify(info)}`);await sleep(120);return info;
          }
          async function rewardAndChoose(type){
            await page.waitForFunction(()=>!document.querySelector('#worldEventScreen')?.classList.contains('hidden')&&document.querySelectorAll('#worldEventCards .world-event-card').length>0,{timeout:3000});
            const cards=await page.locator('#worldEventCards .world-event-card').count();assert(cards>=2,`${type}: reward choice count ${cards}`);await page.screenshot({path:`event-qa/screens/${type}-reward.png`});await page.locator('#worldEventCards .world-event-card').first().click();await sleep(100);assert(await page.evaluate(()=>document.querySelector('#worldEventScreen')?.classList.contains('hidden')&&state.mode==='playing'),`${type}: reward choice did not resume play`);return cards;
          }

          const eventTypes=['vault','crash','void','distress','meteor','predator','relay','storm'];
          for(const type of eventTypes)await signalCheck(type);

          // Vault: choice overlay and reward application.
          let info=await start('vault');assert(info.overlay&&info.overlayType==='vault'&&info.cards===3,`vault: overlay invalid ${JSON.stringify(info)}`);await page.screenshot({path:'event-qa/screens/vault-choice.png'});await page.locator('#worldEventCards .world-event-card').first().click();await sleep(100);assert(await page.evaluate(()=>state.mode==='playing'&&document.querySelector('#worldEventScreen')?.classList.contains('hidden')),'vault: choice did not close');results.push({type:'vault',signal:true,start:true,complete:true});

          // Crash: ordinary wave path to salvage.
          await prep();info=await page.evaluate(()=>{state.crashEventCount=0;const r=window.stackfallDeveloperTest.spawnEndlessEvent('crash',true);const ev=state.mapEventActive;return{r,type:ev?.type,dreadnought:ev?.dreadnought,waves:ev?.waves?.length};});assert(info.r.ok&&info.type==='crash'&&!info.dreadnought&&info.waves===3,`crash: normal start invalid ${JSON.stringify(info)}`);await page.screenshot({path:'event-qa/screens/crash-active.png'});
          await page.evaluate(()=>{const ev=state.mapEventActive;ev.remaining=0;ev.wave=ev.waves.length-1;ev.between=-1;state.entities.enemies=state.entities.enemies.filter(e=>e.eventKind!=='crash');updateMapEvents(.016);});await rewardAndChoose('crash');
          // Every third crash is a dreadnought, and it also resolves to salvage after boss death.
          await prep();info=await page.evaluate(()=>{state.crashEventCount=2;const r=window.stackfallDeveloperTest.spawnEndlessEvent('crash',true);const ev=state.mapEventActive;const boss=state.entities.enemies.find(e=>e.eventVariant==='dreadnought');return{r,dreadnought:ev?.dreadnought,boss:!!boss,bossKind:boss?.kind};});assert(info.r.ok&&info.dreadnought&&info.boss&&info.bossKind==='crash-boss',`crash dreadnought: invalid ${JSON.stringify(info)}`);await page.screenshot({path:'event-qa/screens/crash-dreadnought.png'});await page.evaluate(()=>{const ev=state.mapEventActive;ev.remaining=0;ev.wave=ev.waves.length-1;ev.between=-1;state.entities.enemies=state.entities.enemies.filter(e=>e.eventKind!=='crash');updateMapEvents(.016);});await rewardAndChoose('crash-dreadnought');results.push({type:'crash',signal:true,start:true,normalComplete:true,dreadnought:true,dreadnoughtComplete:true});

          // Void: enter choice -> transition -> actual dedicated boss -> kill -> reward.
          info=await start('void');assert(info.overlay&&info.overlayType==='void'&&info.cards===2,`void: entry choice invalid ${JSON.stringify(info)}`);await page.screenshot({path:'event-qa/screens/void-choice.png'});await page.locator('#worldEventCards .world-event-card').first().click();await page.waitForFunction(()=>state.mapEventActive?.type==='void'&&state.mapEventActive?.bossId,{timeout:5000});const voidBoss=await page.evaluate(()=>{const e=state.entities.enemies.find(x=>x.id===state.mapEventActive?.bossId);return{id:e?.id,kind:e?.kind,form:e?.eliteForm,name:e?.name};});assert(voidBoss.id&&voidBoss.kind==='void',`void: dedicated boss missing ${JSON.stringify(voidBoss)}`);await page.screenshot({path:'event-qa/screens/void-boss.png'});await page.evaluate(()=>{const e=state.entities.enemies.find(x=>x.id===state.mapEventActive?.bossId);if(e){e.hp=1;dealDamage(e,999999,{source:'event-qa',canCrit:false});}});await rewardAndChoose('void');results.push({type:'void',signal:true,start:true,boss:voidBoss,complete:true});

          // Distress: hold the rescue zone long enough, then reward.
          info=await start('distress');assert(info.active==='distress',`distress: active missing ${JSON.stringify(info)}`);await page.screenshot({path:'event-qa/screens/distress-active.png'});await page.evaluate(()=>{for(let i=0;i<24&&state.mapEventActive?.type==='distress';i++){player.x=state.mapEventActive.center.x;player.y=state.mapEventActive.center.y;updateMapEvents(.5);}});await rewardAndChoose('distress');
          await prep();await page.evaluate(()=>{window.stackfallDeveloperTest.spawnEndlessEvent('distress',true);state.mapEventActive.remainingTime=.1;player.x=state.mapEventActive.center.x+400;updateMapEvents(.2);});assert(await page.evaluate(()=>!state.mapEventActive&&document.querySelector('#worldEventScreen')?.classList.contains('hidden')),'distress: failure path did not clear');results.push({type:'distress',signal:true,start:true,complete:true,failure:true});

          // Meteor: follow moving core; progress must reach target and reward.
          info=await start('meteor');assert(info.active==='meteor',`meteor: active missing ${JSON.stringify(info)}`);await page.screenshot({path:'event-qa/screens/meteor-active.png'});await page.evaluate(()=>{for(let i=0;i<30&&state.mapEventActive?.type==='meteor';i++){player.x=state.mapEventActive.center.x;player.y=state.mapEventActive.center.y;updateMapEvents(.5);}});await rewardAndChoose('meteor');
          await prep();await page.evaluate(()=>{window.stackfallDeveloperTest.spawnEndlessEvent('meteor',true);state.mapEventActive.remainingTime=.1;player.x=state.mapEventActive.center.x+500;updateMapEvents(.2);});assert(await page.evaluate(()=>!state.mapEventActive&&document.querySelector('#worldEventScreen')?.classList.contains('hidden')),'meteor: failure path did not clear');results.push({type:'meteor',signal:true,start:true,complete:true,failure:true});

          // Predator: only kills inside the nebula should count.
          info=await start('predator');assert(info.active==='predator',`predator: active missing ${JSON.stringify(info)}`);await page.screenshot({path:'event-qa/screens/predator-active.png'});
          const predatorCount=await page.evaluate(()=>{const ev=state.mapEventActive;const far=spawnEnemy('normal');far.x=ev.center.x+500;far.y=ev.center.y;far.hp=1;dealDamage(far,99999,{source:'qa',canCrit:false});const afterFar=ev.kills;for(let i=0;i<ev.target;i++){const e=spawnEnemy('normal');e.x=ev.center.x+20;e.y=ev.center.y;e.hp=1;dealDamage(e,99999,{source:'qa',canCrit:false});}updateMapEvents(.016);return{afterFar,target:ev.target};});assert(predatorCount.afterFar===0,`predator: far kill incorrectly counted ${JSON.stringify(predatorCount)}`);await rewardAndChoose('predator');
          await prep();await page.evaluate(()=>{window.stackfallDeveloperTest.spawnEndlessEvent('predator',true);state.mapEventActive.remainingTime=.1;updateMapEvents(.2);});assert(await page.evaluate(()=>!state.mapEventActive),'predator: failure path did not clear');results.push({type:'predator',signal:true,start:true,insideKillGate:true,complete:true,failure:true});

          // Relay: three sequential nodes, each requiring sustained proximity.
          info=await start('relay');assert(info.active==='relay',`relay: active missing ${JSON.stringify(info)}`);await page.screenshot({path:'event-qa/screens/relay-active.png'});const relayIndexes=await page.evaluate(()=>{const seen=[];while(state.mapEventActive?.type==='relay'){const ev=state.mapEventActive;seen.push(ev.index);for(let i=0;i<10&&state.mapEventActive?.type==='relay'&&state.mapEventActive.index===ev.index;i++){player.x=state.mapEventActive.point.x;player.y=state.mapEventActive.point.y;updateMapEvents(.25);}}return[...new Set(seen)];});assert(JSON.stringify(relayIndexes)==='[0,1,2]',`relay: sequential indexes invalid ${JSON.stringify(relayIndexes)}`);await rewardAndChoose('relay');
          await prep();await page.evaluate(()=>{window.stackfallDeveloperTest.spawnEndlessEvent('relay',true);state.mapEventActive.remainingTime=.1;updateMapEvents(.2);});assert(await page.evaluate(()=>!state.mapEventActive),'relay: failure path did not clear');results.push({type:'relay',signal:true,start:true,indexes:relayIndexes,complete:true,failure:true});

          // Storm: safe-eye survival completion. Also record current outside-eye behavior for design review.
          info=await start('storm');assert(info.active==='storm',`storm: active missing ${JSON.stringify(info)}`);await page.screenshot({path:'event-qa/screens/storm-active.png'});await page.evaluate(()=>{for(let i=0;i<45&&state.mapEventActive?.type==='storm';i++){player.x=state.mapEventActive.center.x;player.y=state.mapEventActive.center.y;updateMapEvents(1);}});await rewardAndChoose('storm');
          await prep();const stormOutside=await page.evaluate(()=>{window.stackfallDeveloperTest.spawnEndlessEvent('storm',true);const ev=state.mapEventActive;player.x=ev.center.x+1000;player.y=ev.center.y+1000;ev.remainingTime=.1;updateMapEvents(.2);return{active:state.mapEventActive?.type||null,rewardPending:!document.querySelector('#worldEventScreen')?.classList.contains('hidden'),mode:state.mode};});await sleep(520);const stormOutsideReward=await page.evaluate(()=>!document.querySelector('#worldEventScreen')?.classList.contains('hidden')&&document.querySelectorAll('#worldEventCards .world-event-card').length>0);if(stormOutsideReward)await page.locator('#worldEventCards .world-event-card').first().click();results.push({type:'storm',signal:true,start:true,complete:true,outsideStillCompletes:stormOutsideReward,outsideImmediate:stormOutside});

          // Crash and Void timeout failure paths.
          await prep();await page.evaluate(()=>{state.crashEventCount=0;window.stackfallDeveloperTest.spawnEndlessEvent('crash',true);state.mapEventActive.remainingTime=.05;updateMapEvents(.1);});assert(await page.evaluate(()=>!state.mapEventActive),'crash: timeout failure did not clear');
          await prep();await page.evaluate(()=>{window.stackfallDeveloperTest.spawnEndlessEvent('void',true);document.querySelector('#worldEventCards .world-event-card')?.click();});await page.waitForFunction(()=>state.mapEventActive?.type==='void',{timeout:3000});await page.evaluate(()=>{state.mapEventActive.remainingTime=.05;updateMapEvents(.1);});await page.waitForFunction(()=>!state.mapEventActive,{timeout:3000});

          const runtime=await page.evaluate(()=>({mode:state.mode,eventHistory:state.eventHistory,eventClocks:state.eventClocks,gameSpeed:window.stackfallGameSpeed?.(),diagnostics:window.stackfallRuntimeDiagnostics?.()}));
          const report={ok:pageErrors.length===0&&consoleErrors.length===0,results,runtime,pageErrors,consoleErrors};
          fs.writeFileSync('event-qa/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          if(pageErrors.length||consoleErrors.length)throw new Error(`runtime errors page=${pageErrors.length} console=${consoleErrors.length}`);
          JS
          node ./event-qa.mjs
          rm -f ./event-qa.mjs
      - name: Upload event QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackfall-event-qa
          path: event-qa
          if-no-files-found: error
          retention-days: 2
