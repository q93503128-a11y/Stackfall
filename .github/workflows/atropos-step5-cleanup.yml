name: Atropos step 5 cleanup

on:
  push:
    branches:
      - feature/atropos-world-devourer-prototype
    paths:
      - .github/workflows/atropos-step5-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply renderer, history and legacy-isolation cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old,new,1)

          p=Path('src/atropos-world-devourer-prototype.js')
          text=p.read_text()
          text=replace_once(text,"  const ENTRY_DURATION=6.2;\n",'', 'remove duplicate entry duration')
          text=replace_once(text,"  const HISTORY_LIMIT=1500;","  const HISTORY_LIMIT=900;",'history limit')
          text=replace_once(text,"  const PART_KEYS=['head',...Array.from({length:BODY_COUNT},(_,i)=>`body-${String(i+1).padStart(2,'0')}`),'tail'];\n","  const PART_KEYS=['head',...Array.from({length:BODY_COUNT},(_,i)=>`body-${String(i+1).padStart(2,'0')}`),'tail'];\n  const PERF={poseBuilds:0,historySegmentsVisited:0,maxHistoryLength:0};\n",'performance counters')
          text=replace_once(text,"\n  const APEX_ENTRY={serial:null,mobs:[],removed:false,form:null};",'', 'remove duplicate entry state')

          old_sample="""  function sampleHistory(history,distance){
    if(!history.length)return{x:player.x,y:player.y,a:0,orbitA:0};
    let remaining=Math.max(0,distance),newer=history[history.length-1];
    for(let i=history.length-2;i>=0;i--){
      const older=history[i],dx=newer.x-older.x,dy=newer.y-older.y,len=Math.hypot(dx,dy);
      if(len>0&&remaining<=len){
        const q=remaining/len;
        return{x:newer.x-dx*q,y:newer.y-dy*q,a:Math.atan2(dy,dx),orbitA:lerp(newer.orbitA,older.orbitA,q)};
      }
      remaining-=len;newer=older;
    }
    const a=history.length>1?Math.atan2(history[1].y-history[0].y,history[1].x-history[0].x):0;
    return{x:history[0].x,y:history[0].y,a,orbitA:history[0].orbitA||0};
  }
"""
          new_sample="""  function sampleHistoryDistances(history,distances){
    const out=new Array(distances.length);
    if(!history.length){for(let i=0;i<out.length;i++)out[i]={x:player.x,y:player.y,a:0,orbitA:0};return out;}
    let newer=history[history.length-1],walked=0,target=0;
    for(let i=history.length-2;i>=0&&target<distances.length;i--){
      const older=history[i],dx=newer.x-older.x,dy=newer.y-older.y,len=Math.hypot(dx,dy);PERF.historySegmentsVisited++;
      if(len>0){
        const end=walked+len;
        while(target<distances.length&&distances[target]<=end){
          const q=clamp((Math.max(0,distances[target])-walked)/len,0,1);
          out[target++]={x:newer.x-dx*q,y:newer.y-dy*q,a:Math.atan2(dy,dx),orbitA:lerp(newer.orbitA,older.orbitA,q)};
        }
        walked=end;
      }
      newer=older;
    }
    const fallbackA=history.length>1?Math.atan2(history[1].y-history[0].y,history[1].x-history[0].x):0,fallback=history[0];
    while(target<out.length)out[target++]={x:fallback.x,y:fallback.y,a:fallbackA,orbitA:fallback.orbitA||0};
    return out;
  }
"""
          text=replace_once(text,old_sample,new_sample,'one-pass history sampler')

          old_build="""    const scaleUnit=motionScale(),points=[];
    for(let i=0;i<PART_KEYS.length;i++){
      const tailT=i/(PART_KEYS.length-1),dist=i*SAMPLE_SPACING*scaleUnit*(1+tailT*.05),p=sampleHistory(serpent.history,dist);
      const screen=worldToScreen(p.x,p.y),depth=Math.sin((p.orbitA||0)+.35);
      const taper=i===0?1.22:i===PART_KEYS.length-1?.38:lerp(1.08,.62,tailT);
      points.push({...p,sx:screen.x,sy:screen.y,key:PART_KEYS[i],index:i,tailT,depth,taper,scaleUnit});
    }
    serpent.points=points;
"""
          new_build="""    PERF.poseBuilds++;PERF.maxHistoryLength=Math.max(PERF.maxHistoryLength,serpent.history.length);
    const scaleUnit=motionScale(),points=[],distances=[];
    for(let i=0;i<PART_KEYS.length;i++){const tailT=i/(PART_KEYS.length-1);distances.push(i*SAMPLE_SPACING*scaleUnit*(1+tailT*.05));}
    const samples=sampleHistoryDistances(serpent.history,distances);
    for(let i=0;i<PART_KEYS.length;i++){
      const tailT=i/(PART_KEYS.length-1),p=samples[i],screen=worldToScreen(p.x,p.y),depth=Math.sin((p.orbitA||0)+.35);
      const taper=i===0?1.22:i===PART_KEYS.length-1?.38:lerp(1.08,.62,tailT);
      points.push({...p,sx:screen.x,sy:screen.y,key:PART_KEYS[i],index:i,tailT,depth,taper,scaleUnit});
    }
    serpent.points=points;
"""
          text=replace_once(text,old_build,new_build,'build pose one-pass sampling')

          text=replace_once(text,"  function drawSprite(img,p,w,h,alpha=1,glow=0,flip=false){","  function drawSprite(img,p,w,h,alpha=1,glow=0,flip=false,scaleX=1,scaleY=1){",'sprite scale signature')
          text=replace_once(text,"    ctx.save();ctx.translate(p.sx,p.sy);ctx.rotate(p.a);if(flip)ctx.scale(1,-1);","    ctx.save();ctx.translate(p.sx,p.sy);ctx.rotate(p.a);ctx.scale(scaleX,scaleY);if(flip)ctx.scale(1,-1);",'sprite scale transform')
          text=replace_once(text,"    const serpent=buildSerpentPose(e);if(!serpent?.points?.length)return;","    const serpent=ensureSerpent(e);if(!serpent?.points?.length)return;",'draw layer no pose rebuild')
          text=replace_once(text,"      if(i===0){drawSprite(art.head,p,445*p.scaleUnit,223*p.scaleUnit,.98*alpha,.08);continue;}","      if(i===0){const jaw=window.stackfallAtroposMawJawScale,scaleX=Number(jaw?.x)||1,scaleY=Number(jaw?.y)||1;drawSprite(art.head,p,445*p.scaleUnit,223*p.scaleUnit,.98*alpha,.08,false,scaleX,scaleY);continue;}",'scoped maw head scale')

          old_hooks="""  const baseEnsure=ensureRebornAtropos;
  ensureRebornAtropos=function ensureWorldDevourer(e){const ok=baseEnsure(e);if(!ok)return false;ensureSerpent(e);return true;};
  const basePose=updateAtroposPose;
  updateAtroposPose=function updateWorldDevourerPose(e){basePose(e);if(!e?.atroposReborn||e.apexForm!=='chronophage')return;buildSerpentPose(e);};
"""
          new_hooks="""  const baseEnsure=ensureRebornAtropos;
  ensureRebornAtropos=function ensureWorldDevourer(e){
    if(!e||e.apexForm!=='chronophage')return baseEnsure(e);
    if(!e.atroposReborn){const ok=baseEnsure(e);if(!ok)return false;}
    ensureSerpent(e);return true;
  };
  const basePose=updateAtroposPose;
  updateAtroposPose=function updateWorldDevourerPose(e){if(e?.apexForm==='chronophage'&&e?.atroposReborn?.worldDevourer)return e.atroposReborn.worldDevourer;return basePose(e);};
"""
          text=replace_once(text,old_hooks,new_hooks,'legacy pose isolation')

          old_bg="""  const baseBackground=drawBackground;
  drawBackground=function drawBackgroundWithWorldDevourer(){
    const tr=entryTransition();
    if(tr){
      const p=clamp(tr.elapsed/Math.max(.001,tr.duration),0,1),blend=smooth(clamp((p-.50)/.36,0,1));
      drawTheme(normalizedRealmTheme(tr.from));if(blend>0){ctx.save();ctx.globalAlpha=blend;drawTheme(normalizedRealmTheme(tr.to));ctx.restore();}
      drawSerpentLayer(artManifest(),'back');return;
    }
    const result=baseBackground();if(chronoSceneActive())drawSerpentLayer(artManifest(),'back');return result;
  };

  drawAtroposWorldBody=function drawWorldDevourerTargets(e){if(ensureRebornAtropos(e))updateAtroposPose(e);};
"""
          new_bg="""  const baseBackground=drawBackground;
  drawBackground=function drawBackgroundWithWorldDevourer(){
    const tr=entryTransition();
    if(tr){
      const p=clamp(tr.elapsed/Math.max(.001,tr.duration),0,1),blend=smooth(clamp((p-.50)/.36,0,1));
      drawTheme(normalizedRealmTheme(tr.from));if(blend>0){ctx.save();ctx.globalAlpha=blend;drawTheme(normalizedRealmTheme(tr.to));ctx.restore();}
      const e=serpentEnemy();if(e)buildSerpentPose(e);drawSerpentLayer(artManifest(),'back');return;
    }
    const result=baseBackground();if(chronoSceneActive()){const e=serpentEnemy();if(e)buildSerpentPose(e);drawSerpentLayer(artManifest(),'back');}return result;
  };

  drawAtroposWorldBody=function drawWorldDevourerTargets(e){return ensureRebornAtropos(e);};
"""
          text=replace_once(text,old_bg,new_bg,'single pose build per render')
          text=replace_once(text,"    drawAtroposWorldBody(e);drawSerpentLayer(artManifest(),'mid');drawAtroposSpaceCut(e);","    drawAtroposWorldBody(e);drawSerpentLayer(artManifest(),'mid');",'remove legacy space-cut draw')

          start=text.index("  function clearEntryTransientCombat(){")
          marker="  if(typeof updateAtroposEntryControl==='function')updateAtroposEntryControl=function disableLegacyAtroposEntryControl(){return false;};\n\n"
          end=text.index(marker,start)+len(marker)
          text=text[:start]+text[end:]

          old_diag="entry:entryTransition()?{form:state.realmTransition.form,elapsed:state.realmTransition.elapsed,duration:state.realmTransition.duration,mobs:APEX_ENTRY.mobs.length}:null,clock:window.stackfallApexClockDiagnostics?.()||null"
          new_diag="entry:entryTransition()?{form:state.realmTransition.form,elapsed:state.realmTransition.elapsed,duration:state.realmTransition.duration}:null,performance:{poseBuilds:PERF.poseBuilds,historySegmentsVisited:PERF.historySegmentsVisited,maxHistoryLength:PERF.maxHistoryLength,historyLimit:HISTORY_LIMIT},clock:window.stackfallApexClockDiagnostics?.()||null"
          text=replace_once(text,old_diag,new_diag,'diagnostics cleanup')
          if 'APEX_ENTRY' in text or 'ENTRY_DURATION' in text:
              raise SystemExit('duplicate prototype entry state still present')
          p.write_text(text)

          p=Path('src/atropos-visual-v5.js');text=p.read_text()
          needle="""  script.addEventListener('load',()=>{
    if(typeof apexBossSkill==='function'){
"""
          repl="""  script.addEventListener('load',()=>{
    if(typeof updateAtroposEntryControl==='function')updateAtroposEntryControl=function disableLegacyAtroposEntryControl(){return false;};
    if(typeof apexBossSkill==='function'){
"""
          text=replace_once(text,needle,repl,'legacy entry isolation in loader')
          p.write_text(text)

          p=Path('src/atropos-world-devourer-attack-maw.js');text=p.read_text()
          needle="  function mawStage(a){if(!a)return'idle';const n=a.age;return n<MAW.aim?'aim':n<MAW.warnEnd?'warn':n<MAW.suctionEnd?'suction':n<MAW.biteEnd?'bite':n<MAW.end?'recover':'done';}\n"
          repl=needle+"  function updateJawScale(a){let scale=null;if(a&&mawStage(a)==='bite'){const q=clamp((a.age-MAW.suctionEnd)/MAW.bite,0,1),snap=Math.sin(q*Math.PI);scale={x:1+.10*snap,y:1-.34*snap};}window.stackfallAtroposMawJawScale=scale;}\n"
          text=replace_once(text,needle,repl,'scoped jaw scale helper')
          text=replace_once(text,"    const a=serpent.mawPrototype;if(!a)return false;a.age+=dt;const pts=rebuildFrontHistory(serpent,a),head=pts[0];applySuction(a,head,dt);resolveBite(e,a,head);","    const a=serpent.mawPrototype;if(!a)return false;a.age+=dt;updateJawScale(a);const pts=rebuildFrontHistory(serpent,a),head=pts[0];applySuction(a,head,dt);resolveBite(e,a,head);",'jaw scale update')
          hook_start=text.index("  // The head renderer lives in the visual prototype closure.")
          hook_end=text.index("  window.stackfallTriggerAtroposVoidMaw",hook_start)
          text=text[:hook_start]+text[hook_end:]
          text=replace_once(text,"window.stackfallTriggerAtroposVoidMaw=()=>{const e=serpentEnemy(),s=serpentOf(e);if(!e||!s)return false;s.crossingPrototype=null;s.tailSeverPrototype=null;s.mawPrototype=null;return startMaw(e,s);};","window.stackfallTriggerAtroposVoidMaw=()=>{const e=serpentEnemy(),s=serpentOf(e);if(!e||!s)return false;window.stackfallAtroposMawJawScale=null;s.crossingPrototype=null;s.tailSeverPrototype=null;s.mawPrototype=null;return startMaw(e,s);};",'jaw reset trigger')
          p.write_text(text)

          Path('src/atropos-world-devourer-damage.js').write_text("""// Branch-only damage model for the World Devourer Atropos prototype.
// Player durability remains meaningful: all six patterns scale from normal Apex boss damage and
// still enter the canonical hurtPlayer pipeline at the attack site.
(()=>{
  const apexBaseDamage=e=>Math.max(7,(Number(e?.damage)||0)*.40);
  const DAMAGE_MULTIPLIERS=Object.freeze({giantCrossing:.95,tailSever:1.05,tailRupture:.72,voidMaw:1.35,devourerRing:1.10,pastTrajectory:.92,worldDevour:1.75});
  const patternDamage=(e,key)=>apexBaseDamage(e)*(DAMAGE_MULTIPLIERS[key]??1);
  window.stackfallAtroposPatternDamage=patternDamage;
  window.stackfallAtroposDamageDiagnostics=()=>({model:'boss-damage-scaled-v2-direct',usesPlayerMaxHp:false,base:'max(7, boss.damage * 0.40)',multipliers:{...DAMAGE_MULTIPLIERS},globalHurtPlayerOverride:false});
})();
""")

          Path('scripts/atropos-code-audit.mjs').write_text(r"""import fs from 'node:fs';
import path from 'node:path';

const srcDir='src';
const files=fs.readdirSync(srcDir).filter(name=>/^atropos.*\.js$/i.test(name));
const sources=Object.fromEntries(files.map(name=>[name,fs.readFileSync(path.join(srcDir,name),'utf8')]));
const all=Object.values(sources).join('\n');
const proto=sources['atropos-world-devourer-prototype.js']||'';
const loader=sources['atropos-visual-v5.js']||'';
const damage=sources['atropos-world-devourer-damage.js']||'';
const maw=sources['atropos-world-devourer-attack-maw.js']||'';
const failures=[];
const requireCheck=(ok,msg)=>{if(!ok)failures.push(msg);};
requireCheck(!/player\s*\.\s*maxHp/.test(all),'Atropos source still references player.maxHp');
requireCheck(!/ctx\.drawImage\s*=/.test(all),'Atropos source still globally overrides ctx.drawImage');
requireCheck(!/hurtPlayer\s*=/.test(damage),'Atropos damage module still globally overrides hurtPlayer');
requireCheck(/HISTORY_LIMIT=900/.test(proto),'World Devourer history limit is not the reviewed 900 point cap');
requireCheck(proto.includes('sampleHistoryDistances'),'One-pass multi-distance history sampling is missing');
requireCheck(!proto.includes('APEX_ENTRY')&&!proto.includes('prepareEntryMobs')&&!proto.includes('beginWorldDevourerEncounter'),'Superseded prototype entry implementation still exists');
requireCheck(loader.includes('disableLegacyAtroposEntryControl'),'Legacy Atropos entry controller is not isolated');
requireCheck(loader.includes('worldDevourerLegacySpaceCutGate'),'Legacy temporal space-cut renderer is not isolated');
requireCheck(loader.includes('e.atroposReborn.slash=null')&&loader.includes('e.atroposReborn.slashCd=1e9'),'Legacy temporal slash skill is not isolated');
requireCheck(proto.includes("return e.atroposReborn.worldDevourer;return basePose(e);"),'World Devourer pose does not bypass the legacy pose path');
requireCheck(proto.includes("const serpent=ensureSerpent(e);if(!serpent?.points?.length)return;"),'Render layers still rebuild the serpent pose');
requireCheck(!maw.includes('baseDrawImage')&&maw.includes('updateJawScale'),'Void Maw still uses the global image interception path');
const report={files:files.length,historyLimit:900,onePassHistory:true,renderPoseOwner:'background-once-per-render',legacy:{entry:'isolated',slash:'isolated',spaceCut:'isolated'},damage:{playerMaxHpReferences:false,globalHurtPlayerOverride:false},canvas:{globalDrawImageOverride:false},status:failures.length?'FAIL':'PASS',failures};
console.log(JSON.stringify(report,null,2));
if(failures.length)process.exit(1);
""")

          wf=Path('.github/workflows/atropos-visual-audit.yml');w=wf.read_text()
          if 'Run Atropos code/performance audit' not in w:
              anchor='      - name: Run Atropos runtime visual capture\n'
              if anchor not in w: raise SystemExit('visual audit anchor missing')
              w=w.replace(anchor,"      - name: Run Atropos code/performance audit\n        run: node scripts/atropos-code-audit.mjs\n      - name: Run Atropos runtime visual capture\n",1)
              wf.write_text(w)
          PY
      - name: Validate cleanup statically
        run: |
          node scripts/atropos-code-audit.mjs
          node --check src/atropos-world-devourer-prototype.js
          node --check src/atropos-world-devourer-attack-maw.js
          node --check src/atropos-world-devourer-damage.js
          node --check src/atropos-visual-v5.js
          node --check scripts/atropos-code-audit.mjs
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-prototype.js src/atropos-world-devourer-attack-maw.js src/atropos-world-devourer-damage.js src/atropos-visual-v5.js scripts/atropos-code-audit.mjs .github/workflows/atropos-visual-audit.yml
          git commit -m "Optimize Atropos renderer and isolate legacy runtime"
          git push origin HEAD:feature/atropos-world-devourer-prototype
