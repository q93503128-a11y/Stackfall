name: Temporary Stackfall visual QA pass 14

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-qa-pass14-temp.yml'

permissions:
  contents: write

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for current build fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected="$(grep -o 'sha256-[a-f0-9]*' src/build-info.js | head -1)"
          for i in $(seq 1 100); do
            live="$(curl -fsS "https://stackfall.pages.dev/src/build-info.js?visualqa=${GITHUB_SHA}-${i}" || true)"
            if printf '%s' "$live" | grep -Fq "$expected"; then
              echo "Live fingerprint matched: $expected"
              exit 0
            fi
            sleep 3
          done
          echo "Live deployment did not reach expected fingerprint: $expected" >&2
          exit 1
      - name: Repair and validate temporary harness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/visual-qa-pass14-temp.mjs')
          s=p.read_text(encoding='utf-8')
          old='return{label,mode:'
          new="return{label:'snapshot',mode:"
          if old not in s: raise SystemExit('inspect label anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check scripts/visual-qa-pass14-temp.mjs
      - name: Capture live visual QA
        run: node scripts/visual-qa-pass14-temp.mjs
      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackfall-visual-qa-pass14
          path: test-results/visual-pass14
          if-no-files-found: error
      - name: Commit screenshots and report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d test-results/visual-pass14 ]]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f test-results/visual-pass14
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: capture Stackfall visual QA pass 14'
          git push origin HEAD:main
