name: tmp-answer-v15-apply
on:
  push:
    branches:
      - feature/void-apex-answer-v1
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V15 visual integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src=Path('src/void-apex-answer-v1.js')
          s=src.read_text()
          s=s.replace("STACKFALL_VOID_APEX_ANSWER_VISUAL_REVISION='v14'","STACKFALL_VOID_APEX_ANSWER_VISUAL_REVISION='v15'")

          old="""function answerFrame(){\n  const width=Math.max(720,Number(vw)||1280),height=Math.max(520,Number(vh)||720);\n  // Production crop from the approved 960x540 body asset: x=37..925, y=67..330.\n  // This keeps both fixed galaxies visible while the enormous body remains mostly offscreen above the arena.\n  const ratio=888/263,w=Math.max(width*1.06,height*1.95),h=w/ratio;\n  const visibleDepth=Math.max(300,Math.min(420,height*.42));\n  return{x:(width-w)*.5,y:visibleDepth-h,w,h,visibleDepth,ratio};\n}"""
          new="""function answerFrame(){\n  const width=Math.max(720,Number(vw)||1280),height=Math.max(520,Number(vh)||720);\n  // V15 integration preview: preserve the approved body, but push the unknown upper/side extent offscreen.\n  // The lower cusp sits around 34% of the arena height, leaving materially more player space.\n  const ratio=888/263,w=Math.max(width*1.14,height*2.05),h=w/ratio;\n  const visibleDepth=Math.max(245,Math.min(330,height*.34));\n  return{x:(width-w)*.5,y:visibleDepth-h,w,h,visibleDepth,ratio};\n}"""
          if old not in s:
              raise SystemExit('answerFrame anchor not found')
          s=s.replace(old,new)

          old_draw="ctx.save();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowColor='rgba(206,222,255,.14)';ctx.shadowBlur=14;ctx.drawImage(answerBodyImage,37,67,888,263,frame.x,frame.y,frame.w,frame.h);ctx.restore();"
          new_draw="ctx.save();ctx.globalAlpha=.94;ctx.globalCompositeOperation='source-over';ctx.filter='brightness(.56) saturate(.62) contrast(1.04)';ctx.shadowColor='rgba(188,204,255,.09)';ctx.shadowBlur=10;ctx.drawImage(answerBodyImage,37,67,888,263,frame.x,frame.y,frame.w,frame.h);ctx.restore();"
          if old_draw not in s:
              raise SystemExit('draw anchor not found')
          s=s.replace(old_draw,new_draw)
          src.write_text(s)

          contract=Path('scripts/void-apex-answer-contract.mjs')
          c=contract.read_text()
          c=c.replace("['Answer V14 renders the exact approved q55 raster crop from an embedded data URI',answer.includes(\"STACKFALL_VOID_APEX_ANSWER_VISUAL_REVISION='v14'\")&&answer.includes(\"const ANSWER_BODY_SRC='data:image/webp;base64,\")&&answer.includes('ctx.drawImage(answerBodyImage,37,67,888,263,frame.x,frame.y,frame.w,frame.h)')],",
                      "['Answer V15 preserves the approved q55 raster while integrating it into the game palette',answer.includes(\"STACKFALL_VOID_APEX_ANSWER_VISUAL_REVISION='v15'\")&&answer.includes(\"const ANSWER_BODY_SRC='data:image/webp;base64,\")&&answer.includes(\"ctx.filter='brightness(.56) saturate(.62) contrast(1.04)'\")&&answer.includes('ctx.drawImage(answerBodyImage,37,67,888,263,frame.x,frame.y,frame.w,frame.h)')],")
          c=c.replace("['body framing uses the approved galaxy-bearing canopy crop and reserves player space',answer.includes('const ratio=888/263')&&answer.includes('visibleDepth=Math.max(300,Math.min(420,height*.42))')&&answer.includes('y:visibleDepth-h')],",
                      "['body framing keeps the upper and side extent unknown while reserving more player space',answer.includes('const ratio=888/263,w=Math.max(width*1.14,height*2.05)')&&answer.includes('visibleDepth=Math.max(245,Math.min(330,height*.34))')&&answer.includes('y:visibleDepth-h')],")
          contract.write_text(c)
          PY
      - name: Validate
        run: |
          node --check src/void-apex-answer-v1.js
          node scripts/void-apex-answer-contract.mjs
          node scripts/build-fingerprint.mjs
      - name: Commit stable result and remove temporary workflow
        run: |
          rm .github/workflows/tmp-answer-v15-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/void-apex-answer-v1.js scripts/void-apex-answer-contract.mjs .github/workflows/tmp-answer-v15-apply.yml
          git commit -m "Tune Answer body integration for arena preview"
          git push origin HEAD:feature/void-apex-answer-v1
