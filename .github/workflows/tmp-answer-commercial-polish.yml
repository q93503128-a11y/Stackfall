name: tmp-answer-commercial-polish
on:
  push:
    branches:
      - feature/void-apex-answer-v1
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Answer presentation patch
        run: python scripts/tmp-answer-polish.py
      - name: Parse JavaScript
        run: node --check src/void-apex-answer-combat-v1.js
      - name: Focused Answer contract
        run: node scripts/void-apex-answer-contract.mjs
      - name: Full validation and build fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Recheck Answer contract
        run: node scripts/void-apex-answer-contract.mjs
      - name: Verify requested invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/void-apex-answer-combat-v1.js').read_text()
          checks={
            'shared targeted-spike geometry': 'circleHitsPoly(ps.x,ps.y,hazardPlayerRadius(),poly)' in s and 'const poly=spikePolygon(s,reach)' in s,
            'horizontal row geometry': "axis:'horizontal'" in s and 'rowLaneGeometry(m,i,reach)' in s,
            'warning no opaque white panels': "rgba(255,255,255,${.008+p*.018})" in s,
            'split previews its band': 'lineWidth=band*2' in s,
            'beam previews its width': 'x+side*m.width*.5' in s,
            'diagnostics expose pattern ages': 'spikeDetails:' in s and 'majorDetails:' in s,
          }
          for name,ok in checks.items(): print(('PASS' if ok else 'FAIL'),name)
          if not all(checks.values()): raise SystemExit(1)
          PY
      - name: Commit verified result
        run: |
          rm -f .github/workflows/tmp-answer-commercial-polish.yml scripts/tmp-answer-polish.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Answer hazard readability and material language'
          git push origin HEAD:feature/void-apex-answer-v1
