name: Atropos Past echo final repair

on:
  push:
    branches:
      - feature/atropos-world-devourer-prototype
    paths:
      - scripts/atropos-past-echo-final-fix.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Repair Past Trajectory echo readability
        run: python scripts/atropos-past-echo-final-fix.py
      - name: Validate runtime
        run: |
          node --check src/atropos-world-devourer-attack-past.js
          node scripts/atropos-code-audit.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-attack-past.js
          git commit -m "Restore colossal Past Trajectory echo readability"
          git push origin HEAD:feature/atropos-world-devourer-prototype
