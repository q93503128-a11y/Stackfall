name: Fingerprint refresh
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fingerprint-refresh.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh refined Stage 1 build fingerprint
        run: |
          node scripts/build-fingerprint.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/build-info.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh refined Stage 1 fingerprint"
          git push
