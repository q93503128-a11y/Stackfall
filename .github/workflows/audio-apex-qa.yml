name: Sound and Apex browser QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audio-apex-qa.mjs'
      - '.github/workflows/audio-apex-qa.yml'
      - 'src/runtime-config.js'
      - 'src/stage01-remodel.js'
      - 'src/stage01-polish.js'
      - 'src/stage-runtime.js'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for deployed build fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected=$(node --input-type=module -e "import {computeBuildFingerprint} from './scripts/build-fingerprint.mjs'; console.log(computeBuildFingerprint(process.cwd()).sha)")
          for attempt in $(seq 1 28); do
            body=$(curl -fsS "https://stackfall.pages.dev/src/build-info.js?audio-apex-qa=${GITHUB_SHA}-${attempt}" || true)
            if printf '%s' "$body" | grep -Fq "$expected"; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Prepare CI Chrome wrapper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/stackfall-chrome" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          profile=''
          args=()
          for arg in "$@"; do
            case "$arg" in
              --user-data-dir=*) profile="${arg#--user-data-dir=}"; args+=("$arg") ;;
              --remote-debugging-port=0) args+=("--remote-debugging-port=9225" "--remote-debugging-address=127.0.0.1") ;;
              *) args+=("$arg") ;;
            esac
          done
          args+=("--no-sandbox" "--disable-dev-shm-usage")
          if [[ -n "$profile" ]]; then
            mkdir -p "$profile"
            (for _ in $(seq 1 100); do printf '9225\n' > "$profile/DevToolsActivePort" 2>/dev/null || true; sleep 0.1; done) &
          fi
          exec /usr/bin/google-chrome "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/stackfall-chrome"
      - name: Run sound routing and Apex setpiece QA
        env:
          STACKFALL_CHROME: ${{ runner.temp }}/stackfall-chrome
          STACKFALL_QA_DIR: test-results/audio-apex-qa
        run: node scripts/audio-apex-qa.mjs
      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-apex-qa
          path: test-results/audio-apex-qa
          if-no-files-found: error
