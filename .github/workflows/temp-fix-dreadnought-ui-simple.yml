name: Temporary simple Dreadnought UI validation
on:
  push:
    branches: [fix-dreadnought-ui-simple]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact UI patch
        run: python3 scripts/temp-fix-dreadnought-simple.py
      - name: Validate source and contracts
        run: |
          node --check src/map-event-expansion.js
          node scripts/combat-integrity-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Assert exact collect-all structure
        run: |
          grep -F "el.className=preview?'world-event-card world-event-display':'world-event-card'" src/map-event-expansion.js
          grep -F '.world-event-collect-all{position:relative;' src/map-event-expansion.js
          grep -F '.world-event-card.world-event-display{cursor:default;pointer-events:none}' src/map-event-expansion.js
          ! grep -F 'world-event-preview-card' src/map-event-expansion.js
      - name: Commit validated source state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/map-event-expansion.js scripts/combat-integrity-contract.mjs src/build-info.js
          git commit -m 'Simplify Dreadnought collect-all reward UI'
          git push origin HEAD:fix-dreadnought-ui-simple
