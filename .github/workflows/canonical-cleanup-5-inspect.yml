name: Canonical cleanup 5 inspect
on:
  push:
    branches:
      - validation/canonical-cleanup-5
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Atropos ownership and load order
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const targets=['apexBossSkill','apexPhaseDirector','apexMotionVelocity','dealDamage','updateEnemies'];
          const files=[];
          function walk(dir){for(const ent of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,ent.name);if(ent.isDirectory())walk(p);else if(/\.(?:js|mjs|html)$/.test(ent.name))files.push(p)}}
          walk('src'); files.push('index.html');
          for(const target of targets){
            console.log(`\n===== ${target} =====`);
            const re=new RegExp(`(^|[^\\w$])${target}\\s*(?:=|\\()|function\\s+${target}\\b`);
            for(const file of files){
              const lines=fs.readFileSync(file,'utf8').split(/\r?\n/);
              lines.forEach((line,i)=>{if(re.test(line)){console.log(`--- ${file}:${i+1}`);for(let n=Math.max(0,i-2);n<=Math.min(lines.length-1,i+5);n++)console.log(`${n+1}: ${lines[n]}`)}})
            }
          }
          console.log('\n===== Atropos references =====');
          for(const file of files){
            const lines=fs.readFileSync(file,'utf8').split(/\r?\n/);
            lines.forEach((line,i)=>{if(/Atropos|atropos|chronophage/.test(line)&&/(function|const |let |window\.|=function|apexBossSkill|apexPhaseDirector|apexMotionVelocity|dealDamage|updateEnemies)/.test(line))console.log(`${file}:${i+1}: ${line}`)})
          }
          console.log('\n===== Script load order =====');
          const html=fs.readFileSync('index.html','utf8');
          for(const m of html.matchAll(/<script[^>]+src=["']([^"']+)["'][^>]*>/g))console.log(m[1]);
          NODE
