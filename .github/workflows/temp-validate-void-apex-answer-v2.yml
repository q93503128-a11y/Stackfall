name: Temporary Void Apex Answer V2 Validation

on:
  push:
    branches: [feature/void-apex-answer-v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources and regenerate fingerprint in workspace
        run: node scripts/build-fingerprint.mjs
      - name: Show regenerated build info diff
        if: always()
        run: git diff -- src/build-info.js || true
