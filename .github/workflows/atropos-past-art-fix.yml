name: Atropos Past art repair

on:
  push:
    branches:
      - feature/atropos-world-devourer-prototype
    paths:
      - .github/workflows/atropos-past-art-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Past Trajectory art repair
        run: python scripts/atropos-past-art-fix.py
      - name: Validate repair
        run: |
          node --check src/atropos-world-devourer-attack-past.js
          node scripts/atropos-code-audit.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-attack-past.js
          git commit -m "Restore Atropos silhouette to Past Trajectory replay"
          git push origin HEAD:feature/atropos-world-devourer-prototype
