name: Apply apex reward bundle polish

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/apex-bundle-favicon-shield
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and apply exact patch
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            cat .tmp-apex-v2/part* | base64 -d | gzip -dc > .tmp-apex-v2/apply.mjs
            echo '09484523aa62c97297b4b641c27801131a549ee9d2669325f84f792a2373ec64  .tmp-apex-v2/apply.mjs' | sha256sum -c -
            node --check .tmp-apex-v2/apply.mjs
            node .tmp-apex-v2/apply.mjs
            python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/polish-contract-check.mjs')
          text=path.read_text(encoding='utf-8')
          appended="\n\n{const reward=read('src/reward-refinement.js')"
          if appended not in text:
              raise SystemExit('temporary contract block not found')
          text=text[:text.index(appended)].rstrip()+"\n"
          old="  ['thumbnail metadata',read('index.html').includes('summ.png')]\n];"
          new="""  ['thumbnail metadata',read('index.html').includes('summ.png')],
          ['apex bundle reward screen',read('src/reward-refinement.js').includes('id=\"apexRewardConfirmBtn\"')],
          ['apex bundle confirm',read('src/reward-refinement.js').includes(\"confirm.querySelector('span').textContent='모두 받기'\")],
          ['apex passive stacks',read('src/reward-refinement.js').includes('planApexPassiveRewards(3)')],
          ['apex body reconstruction',read('src/reward-refinement.js').includes('Math.round(player.maxHp*1.12)')],
          ['bulwark attached spikes',read('src/render-space.js').includes('const spikes=bulwarkN>=6?18:bulwarkN>=5?15:12')],
          ['no detached bulwark orbit',!read('src/render-entities.js').includes(\"orbitRadiusFor('bulwark')\")],
          ['browser favicon',read('index.html').includes('favicon.svg?v=3')],
          ['site manifest',read('index.html').includes('site.webmanifest')]
          ];"""
          if old not in text:
              raise SystemExit('contract check array boundary not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
            node scripts/build-fingerprint.mjs
          } 2>&1 | tee /tmp/apex-bundle-apply.log
      - name: Upload application failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apex-bundle-apply-failure
          path: /tmp/apex-bundle-apply.log
          if-no-files-found: error
      - name: Check source and gameplay contracts
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            while IFS= read -r -d '' file; do node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
            node scripts/polish-contract-check.mjs
            test -s favicon.svg
            test -s site.webmanifest
          } 2>&1 | tee /tmp/apex-bundle-contract.log
      - name: Upload contract failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apex-bundle-contract-failure
          path: /tmp/apex-bundle-contract.log
          if-no-files-found: error
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/ --result=test-results/apex-bundle-smoke.json
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stackfall-maintenance-bot'
          git config user.email 'stackfall-maintenance-bot@users.noreply.github.com'
          git add README.md docs/GAME_DESIGN.md docs/WIKI.md index.html favicon.svg site.webmanifest scripts/polish-contract-check.mjs src/reward-refinement.js src/render-entities.js src/render-space.js src/build-info.js
          git diff --cached --check
          git commit -m 'Bundle apex rewards and attach barrier spikes'
          git push origin HEAD:agent/apex-bundle-favicon-shield
