name: Canonical source export temp

on:
  push:
    branches:
      - feature/enemy-director-v1

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/enemy-director-v1
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
