name: Temporary Apex Final Cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apex-final-cleanup-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align live smoke with refined Omega signature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/browser-smoke.mjs')
          text=path.read_text(encoding='utf-8')
          old="const forgeSignature=state.entities.telegraphs.length>=6;"
          new="const forgeSignature=state.entities.telegraphs.length>=5;"
          if text.count(old)!=1:
              raise SystemExit(f'expected exactly one stale Omega smoke assertion, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check scripts/browser-smoke.mjs
          grep -F "const forgeSignature=state.entities.telegraphs.length>=5;" scripts/browser-smoke.mjs
      - name: Remove temporary Apex QA tooling
        shell: bash
        run: |
          rm -f scripts/apex-visual-qa-temp.mjs
          rm -f .github/workflows/apex-visual-qa-temp.yml
          test ! -e scripts/apex-visual-qa-temp.mjs
          test ! -e .github/workflows/apex-visual-qa-temp.yml
      - name: Run focused checks
        run: |
          node --check src/boss-patterns.js
          node --check src/bosses.js
          node --check src/render-space.js
          node scripts/apex-encounter-contract.mjs
          node scripts/polish-contract-check.mjs
          git diff --check
      - name: Commit cleanup and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/apex-final-cleanup-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/browser-smoke.mjs scripts/apex-visual-qa-temp.mjs .github/workflows/apex-visual-qa-temp.yml .github/workflows/apex-final-cleanup-temp.yml
          git diff --cached --check
          git commit -m "test: align live smoke with refined apex signature"
          git push origin HEAD:main
