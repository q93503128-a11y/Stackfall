name: Final runtime validation temp

on:
  push:
    branches:
      - fix/magnet-apex-runtime-audit

permissions:
  contents: read

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full static validation
        run: node scripts/build-fingerprint.mjs
      - name: Verify build-info loader survived fingerprint write
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'loadApexRewardBalance' src/build-info.js
          grep -Fq 'loadOmegaProduction' src/build-info.js
          grep -Fq 'loadAtroposPhase' src/build-info.js
      - name: Start local server
        run: |
          python3 -m http.server 8000 > /tmp/stackfall-http.log 2>&1 &
          echo $! > /tmp/stackfall-http.pid
          sleep 1
      - name: Prepare Chrome wrapper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/stackfall-chrome" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          profile=''
          args=()
          for arg in "$@"; do
            case "$arg" in
              --user-data-dir=*) profile="${arg#--user-data-dir=}"; args+=("$arg") ;;
              --remote-debugging-port=0) args+=("--remote-debugging-port=9223" "--remote-debugging-address=127.0.0.1") ;;
              *) args+=("$arg") ;;
            esac
          done
          args+=("--no-sandbox" "--disable-dev-shm-usage")
          if [[ -n "$profile" ]]; then
            mkdir -p "$profile"
            (for _ in $(seq 1 100); do printf '9223\n' > "$profile/DevToolsActivePort" 2>/dev/null || true; sleep 0.1; done) &
          fi
          exec /usr/bin/google-chrome "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/stackfall-chrome"
      - name: Suction magnet and XP browser QA
        env:
          STACKFALL_CHROME: ${{ runner.temp }}/stackfall-chrome
          STACKFALL_ALLOW_GPU_SKIP: '1'
          STACKFALL_ALLOW_CONTEXT_SKIP: '1'
        run: node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/ --pickup-only
      - name: Last Constellation real lethal browser QA
        env:
          STACKFALL_CHROME: ${{ runner.temp }}/stackfall-chrome
          STACKFALL_ALLOW_GPU_SKIP: '1'
          STACKFALL_ALLOW_CONTEXT_SKIP: '1'
          STACKFALL_APEX_FORM: 'lastconstellation'
        run: node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/ --apex-only
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-runtime-validation-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
