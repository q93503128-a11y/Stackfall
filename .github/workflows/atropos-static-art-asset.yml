name: Atropos static production art asset

on:
  push:
    branches: [feature/atropos-world-devourer-prototype]
    paths: [scripts/atropos-art-chunks/READY]

permissions:
  contents: write

jobs:
  build-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Rebuild static WebP asset
        run: |
          cat scripts/atropos-art-chunks/chunk*.txt | tr -d '\n\r' | base64 -d > assets/atropos-production.webp
          python - <<'PY'
          from pathlib import Path
          b=Path('assets/atropos-production.webp').read_bytes()
          assert len(b)==49262, len(b)
          assert b[:4]==b'RIFF', b[:4]
          assert b[8:12]==b'WEBP', b[8:12]
          print('validated WebP', len(b))
          PY
      - name: Point runtime at static WebP and align frames
        run: |
          cat > src/atropos-production-art-data.js <<'EOF'
          // Approved production raster atlas for Atropos, World Devourer.
          window.stackfallAtroposProductionArt={
            version:'atropos-production-raster-v1',
            width:768,
            height:373,
            src:'assets/atropos-production.webp'
          };
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('src/atropos-world-devourer-prototype.js')
          s=p.read_text()
          start=s.index('  const ART_FRAMES={')
          end=s.index('  };',start)+5
          block="""  const ART_FRAMES={
            headClosed:{x:5,y:6,w:153,h:113},
            headOpen:{x:164,y:6,w:142,h:119},
            neckA:{x:311,y:6,w:128,h:102},
            neckB:{x:444,y:7,w:126,h:102},
            bodyA:{x:577,y:7,w:150,h:107},
            bodyB:{x:5,y:131,w:137,h:105},
            bodyC:{x:148,y:131,w:140,h:110},
            bodyD:{x:293,y:131,w:149,h:101},
            rear:{x:446,y:131,w:146,h:87},
            tail:{x:5,y:247,w:199,h:120}
          };"""
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
      - name: Validate production art runtime
        run: |
          node --check src/atropos-production-art-data.js
          node --check src/atropos-world-devourer-prototype.js
          node --check src/atropos-world-devourer-attack-past.js
          node --check src/atropos-world-devourer-attack-world.js
          node scripts/atropos-code-audit.mjs
      - name: Commit production asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/atropos-production.webp src/atropos-production-art-data.js src/atropos-world-devourer-prototype.js
          git commit -m "Ship Atropos approved production raster asset"
          git push origin HEAD:feature/atropos-world-devourer-prototype
