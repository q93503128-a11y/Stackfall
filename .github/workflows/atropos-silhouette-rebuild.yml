name: Atropos silhouette rebuild

on:
  push:
    branches: [feature/atropos-world-devourer-prototype]
    paths: [scripts/atropos-silhouette-trigger.txt]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Apply silhouette rebuild
        run: |
          python scripts/atropos-silhouette-rebuild.py
          node --check src/atropos-world-devourer-prototype.js
          node --check src/atropos-world-devourer-attack-crossing.js
          node --check src/atropos-world-devourer-attack-maw.js
          node --check src/atropos-world-devourer-attack-ring.js
          node --check src/atropos-world-devourer-attack-past.js
          node --check src/atropos-world-devourer-attack-world.js
          node scripts/atropos-code-audit.mjs
      - name: Commit silhouette rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-prototype.js src/atropos-world-devourer-attack-crossing.js src/atropos-world-devourer-attack-maw.js src/atropos-world-devourer-attack-ring.js src/atropos-world-devourer-attack-past.js src/atropos-world-devourer-attack-world.js
          git commit -m "Rebuild Atropos idle silhouette and shared pathing"
          git push origin HEAD:feature/atropos-world-devourer-prototype
