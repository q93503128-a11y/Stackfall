name: Atropos textured rope v6

on:
  push:
    branches: [feature/atropos-world-devourer-prototype]
    paths: [scripts/atropos-rope-texture-v6-trigger.txt]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Apply textured rope v6
        run: |
          python scripts/atropos-rope-texture-v6.py
          node --check src/atropos-world-devourer-prototype.js
          node scripts/atropos-code-audit.mjs
      - name: Commit textured rope v6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-prototype.js
          git commit -m "Texture Atropos body as a warped rope skin"
          git push origin HEAD:feature/atropos-world-devourer-prototype
