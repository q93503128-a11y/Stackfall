name: Atropos tail QA patch

on:
  push:
    branches:
      - feature/atropos-world-devourer-prototype
    paths:
      - .github/workflows/atropos-tail-qa-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Bring the seven-link rear whip pivot into readable space
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/atropos-world-devourer-attack-crossing.js')
          text=p.read_text(encoding='utf-8')
          old='const pivotIndex=Math.max(6,base.length-7),pivot=base[pivotIndex]'
          new='const pivotIndex=Math.max(6,base.length-8),pivot=base[pivotIndex]'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one tail pivot match, got {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check src/atropos-world-devourer-attack-crossing.js
          git diff --check
      - name: Commit tail readability adjustment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-attack-crossing.js
          git commit -m "Improve Atropos tail whip readability"
          git push origin HEAD:feature/atropos-world-devourer-prototype
