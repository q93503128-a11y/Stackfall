name: Temporary Apex Contract Finalizer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apex-polish-patch-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrate stale Chronophage contract references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements={
              "bosses.includes('addCircle(x,y,r,chase.damage')":"bosses.includes('chronophageScar(x,y,r,chase.damage')",
              "patterns.includes('addCircle(now.x,now.y')":"patterns.includes('chronophageScar(now.x,now.y')",
              "read('src/boss-patterns.js').includes('addCircle(now.x,now.y')":"read('src/boss-patterns.js').includes('chronophageScar(now.x,now.y')",
          }
          changed=[]
          for path in sorted(Path('scripts').glob('*.mjs')):
              text=path.read_text(encoding='utf-8')
              out=text
              for old,new in replacements.items():
                  out=out.replace(old,new)
              if out!=text:
                  path.write_text(out,encoding='utf-8')
                  changed.append(str(path))
          print('migrated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Validate current Apex source and full build
        run: |
          node --check src/boss-patterns.js
          node --check src/bosses.js
          node --check src/render-space.js
          node scripts/apex-encounter-contract.mjs
          node scripts/polish-contract-check.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Commit contract sync and remove finalizer
        shell: bash
        run: |
          rm .github/workflows/apex-polish-patch-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/*.mjs src/build-info.js .github/workflows/apex-polish-patch-temp.yml
          git diff --cached --check
          git commit -m "test: sync apex contracts with temporal scars"
          git push origin HEAD:main
