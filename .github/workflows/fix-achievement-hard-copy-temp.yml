name: Temporary fix hard achievement copy

on:
  push:
    paths:
      - '.github/workflows/fix-achievement-hard-copy-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace legacy hard unlock copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/difficulty-augment-expansion.js')
          s=p.read_text(encoding='utf-8')
          old="locked?'Stage 6 CLEAR':text[key][1]"
          new="locked?(window.stackfallFeatureAchievementCondition?.('hard')||'Achievement required'):text[key][1]"
          if old not in s:
              raise SystemExit('target hard-copy expression not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node scripts/build-fingerprint.mjs
          git rm .github/workflows/fix-achievement-hard-copy-temp.yml
      - name: Commit fix and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/difficulty-augment-expansion.js src/build-info.js
          git commit -m 'fix: show achievement condition for hard difficulty'
          git push origin HEAD:main
