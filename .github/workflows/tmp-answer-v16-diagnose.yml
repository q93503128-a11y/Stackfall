name: tmp-answer-v16-diagnose
on:
  push:
    branches:
      - feature/void-apex-answer-v1
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
      - name: Inspect V16 payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, struct
          p=Path('assets/answer/answer_body_v16.b64')
          text=p.read_text().strip()
          print('TEXT_LEN',len(text))
          try:
            data=base64.b64decode(text,validate=True)
          except Exception as e:
            print('BASE64_ERROR',repr(e)); raise
          print('BYTE_LEN',len(data))
          print('SHA256',hashlib.sha256(data).hexdigest())
          print('HEAD12',data[:12])
          if len(data)>=12 and data[:4]==b'RIFF':
            declared=struct.unpack('<I',data[4:8])[0]+8
            print('RIFF_DECLARED',declared)
            print('RIFF_MATCH',declared==len(data))
          try:
            from PIL import Image
            import io
            im=Image.open(io.BytesIO(data)); im.load()
            print('PIL',im.size,im.mode,im.format)
          except Exception as e:
            print('PIL_ERROR',repr(e))
          PY
