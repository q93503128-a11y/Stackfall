name: Capture Stage 1 review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/capture-stage01-review.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture final Stage 1 live review
        run: node scripts/capture-stage01-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage01-visual-review-final
          path: test-results/stage01-review
          if-no-files-found: error
