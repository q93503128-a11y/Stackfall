name: Capture Stage 1 review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/capture-stage01-review.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture final Stage 1 live review
        run: |
          node scripts/capture-stage01-review.mjs
          node -e "const r=require('./test-results/stage01-review/report.json'); if(r.diagnostics?.errorCount){console.error(JSON.stringify(r.diagnostics,null,2)); process.exit(1)}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage01-visual-review-final
          path: test-results/stage01-review
          if-no-files-found: error
