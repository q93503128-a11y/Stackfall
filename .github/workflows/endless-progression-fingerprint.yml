name: Refresh endless progression fingerprint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/endless-progression-fingerprint.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and refresh build fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Commit build info
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stackfall-build-bot'
          git config user.email 'stackfall-build-bot@users.noreply.github.com'
          git add src/build-info.js
          git diff --cached --quiet && exit 0
          git commit -m 'build: refresh endless progression fingerprint'
          git push origin HEAD:main
