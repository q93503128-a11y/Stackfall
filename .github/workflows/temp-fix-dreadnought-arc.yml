name: Temporary Dreadnought UI and Arc awakening validation

on:
  push:
    branches:
      - fix-dreadnought-ui-arc-awakening

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/temp-fix-dreadnought-arc.py
      - name: Syntax and contracts
        run: |
          node --check src/combat-integrity-v1.js
          node --check src/weapon-awakening-effects-a1-a7.js
          node --check src/map-event-expansion.js
          node scripts/combat-integrity-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "STACKFALL_CHROME=$CHROME" >> "$GITHUB_ENV"
      - name: Full Chromium smoke including awakening runtime checks
        run: |
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          STACKFALL_URL=http://127.0.0.1:8000/ node scripts/browser-smoke.mjs
      - name: Assert Arc and Dreadnought ownership markers
        run: |
          grep -q 'src/combat-integrity-v1.js' index.html
          grep -q 'src/endless-pressure-rewards-v1.js' index.html
          grep -q 'world-event-preview-card' src/map-event-expansion.js
          grep -q 'world-event-timer:empty{display:none}' src/map-event-expansion.js
          ! grep -q 'loadRuntimeIntegrityLayers' src/boss-body-parts.js
      - name: Commit validated source state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html src/boss-body-parts.js src/map-event-expansion.js scripts/combat-integrity-contract.mjs src/build-info.js
          git commit -m "Fix Arc awakening ownership and Dreadnought reward UI"
          git push
