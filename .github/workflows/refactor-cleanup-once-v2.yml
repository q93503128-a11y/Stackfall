name: One-time Stackfall cleanup v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-cleanup-once-v2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refactor stale Stage runtime and remove discarded artifacts
        shell: bash
        run: |
          set -euo pipefail
          cat > .tmp-stackfall-cleanup.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const read=file=>fs.readFileSync(file,'utf8');
          const write=(file,body)=>fs.writeFileSync(file,body);
          const fail=message=>{throw new Error(message);};
          const replaceOnce=(source,needle,replacement,label)=>{
            const index=source.indexOf(needle);
            if(index<0)fail(`missing ${label}`);
            if(source.indexOf(needle,index+needle.length)>=0)fail(`duplicate ${label}`);
            return source.slice(0,index)+replacement+source.slice(index+needle.length);
          };
          const removeBetween=(source,start,end,label)=>{
            const a=source.indexOf(start),b=a<0?-1:source.indexOf(end,a+start.length);
            if(a<0||b<0)fail(`missing range ${label}`);
            return source.slice(0,a)+source.slice(b);
          };

          let catalog=read('src/stage-catalog.js');
          const stageOneStart="    createStage({\n      id:'stage-01'";
          const stageTwoStart="    createStage({\n      id:'stage-02'";
          const a=catalog.indexOf(stageOneStart),b=a<0?-1:catalog.indexOf(stageTwoStart,a+stageOneStart.length);
          if(a<0||b<0)fail('stage catalog Stage 1 block not found');
          const canonicalStageOne=`    createStage({
              id:'stage-01',order:1,constellationId:'constellation-01',status:'available',title:{ko:'외곽 항로',en:'Outer Route'},description:{ko:'붕괴한 외곽 항로를 돌파하는 첫 작전. 파편체의 속도와 사격 밀도가 단계적으로 증가하고, 주기적으로 전장을 가로지르는 항로 파편대를 피한 뒤 궤도 감시자를 격파한다.',en:'The first operation through a collapsed outer route. Enemy speed and fire density escalate in steps; evade route-wide shard sweeps, then destroy the Orbit Warden.'},durationSeconds:300,estimatedMinutes:5,threat:1,node:{x:.18,y:.54},requirements:{previous:null},
              discoveries:{gimmicks:['route-shard-sweep'],weapons:['comet'],events:['route-rush','outer-battery','guard-line']},gimmick:{startAt:80,interval:78,waveEvery:0,accelerate:.08},
              enemySet:[{id:'shardling',type:'grunt',unlockAt:0},{id:'dart',type:'fast',unlockAt:34},{id:'bombardier',type:'ranged',unlockAt:118},{id:'bulwark',type:'tank',unlockAt:205}],
              fixedEvents:[{id:'route-rush',at:52,kind:'wave',variant:'dart',count:5},{id:'outer-battery',at:145,kind:'wave',variant:'bombardier',count:4},{id:'route-sweep-fixed',at:196,kind:'hazard',variant:'route-shard-sweep'},{id:'guard-line',at:238,kind:'wave',variant:'bulwark',count:3},{id:'final-boss',at:300,kind:'boss',variant:'orbit-warden'}],
              boss:{id:'orbit-warden',spawnAt:300,name:{ko:'궤도 감시자',en:'Orbit Warden'}},rewards:[{type:'weapon',key:'comet'},{type:'feature',key:'core-development'},{type:'currency',key:'stardust',amount:140},{type:'currency',key:'coreShard',amount:1,firstClearOnly:true}],challenges:[{id:'clear',type:'clear'}]
            }),
          `;
          catalog=catalog.slice(0,a)+canonicalStageOne+catalog.slice(b);
          write('src/stage-catalog.js',catalog);

          let catalogContract=read('scripts/stage-catalog-contract.mjs');
          const gimmickStart="assert(Number.isFinite(stage.gimmick?.startAt)";
          const gimmickEnd="assert(bossEvents[0]?.at===stage.boss?.spawnAt";
          const ga=catalogContract.indexOf(gimmickStart),gb=ga<0?-1:catalogContract.indexOf(gimmickEnd,ga);
          if(ga<0||gb<0)fail('catalog gimmick contract range not found');
          const gimmickContract=`assert(Number.isFinite(stage.gimmick?.startAt)&&stage.gimmick.startAt>0&&stage.gimmick.startAt<stage.durationSeconds,'invalid persistent gimmick start '+stage.id);
            if(stage.id==='stage-01'){
              assert(stage.gimmick.interval===78,'Stage 1 route sweep cadence drift');
              assert(stage.gimmick.waveEvery===0,'Stage 1 must not inject ambient wave events');
            }else{
              assert(Number.isFinite(stage.gimmick?.interval)&&stage.gimmick.interval>=20&&stage.gimmick.interval<=60,'invalid persistent gimmick cadence '+stage.id);
              assert(Number.isInteger(stage.gimmick?.waveEvery)&&stage.gimmick.waveEvery>=3,'invalid gimmick wave cadence '+stage.id);
            }
            `;
          catalogContract=catalogContract.slice(0,ga)+gimmickContract+catalogContract.slice(gb);
          write('scripts/stage-catalog-contract.mjs',catalogContract);

          let runtime=read('src/stage-runtime.js');
          runtime=removeBetween(runtime,'  function updateStageOneRouteState(run){','  window.stackfallStageBodyShapes=','legacy Stage 1/2 environment state');
          runtime=removeBetween(runtime,'  function stageOneArena(run=stageRuntime()){','  function spawnStageBoss(options={}){','legacy Stage 1 arena');
          runtime=replaceOnce(runtime,",arena=stage.id==='stage-01'?stageOneArena(run):null,e={",',e={','Stage 1 arena boss spawn selector');
          runtime=replaceOnce(runtime,'x:arena?arena.x:player.x+Math.cos(angle)*radius,y:arena?stageOneEntryY(arena):player.y+Math.sin(angle)*radius','x:player.x+Math.cos(angle)*radius,y:player.y+Math.sin(angle)*radius','Stage 1 arena boss coordinates');
          runtime=replaceOnce(runtime,"    if(stage.id==='stage-01'){e.contactSafeUntil=(state.time||0)+1.2;stabilizeRealmTheme?.('stage-01');}\n",'', 'legacy Stage 1 boss init branch');
          runtime=replaceOnce(runtime,"    if(stage.id==='stage-02'){e.x=player.x+18;e.y=player.y-Math.min(vh*.26,230);e.stageTwoAttackCd=1.55;e.stageNebulaBeatUntil=0;e.stageNebulaInhaleUntil=0;e.stageNebulaExhaleUntil=0;e.stageNebulaActiveLobe=-1;e.stageNebulaFlowDir=e.id%2?1:-1;}\n",'', 'legacy Stage 2 boss init branch');
          runtime=replaceOnce(runtime,"if(!def.production&&!['stage-01','stage-02'].includes(stage.id))shockwave","if(!def.production)shockwave",'generic boss spawn shockwave gate');
          runtime=removeBetween(runtime,'  function beginStageOneBossIntro(event){','  function triggerStageEvent(event){','legacy Stage 1/2 boss intros');
          runtime=replaceOnce(runtime,"if(event.kind==='boss'){if(stageDefinition()?.production){beginProductionBossIntro(event);return;}if(run.stage.id==='stage-01'){beginStageOneBossIntro(event);return;}if(run.stage.id==='stage-02'){beginStageTwoBossIntro(event);return;}if(spawnStageBoss())run.eventsTriggered[event.id]=true;return;}","if(event.kind==='boss'){if(stageDefinition()?.production){beginProductionBossIntro(event);return;}if(spawnStageBoss())run.eventsTriggered[event.id]=true;return;}",'boss event dispatch');
          runtime=replaceOnce(runtime,"const run=stageRuntime(),def=stageDefinition();if(!run||!def||run.completed)return;def.production?.environment?.(run,dt);updateObjective(run);if(run.stage.id==='stage-01')updateStageOneRouteState(run);if(run.stage.id==='stage-02')updateStageTwoNebula(run);updateStagePhysicalObjects(dt);","const run=stageRuntime(),def=stageDefinition();if(!run||!def||run.completed)return;def.production?.environment?.(run,dt);updateObjective(run);updateStagePhysicalObjects(dt);",'stage update special-case state');
          runtime=replaceOnce(runtime,"      if(def.production){beginProductionBossIntro(run.stage.fixedEvents.find(event=>event.kind==='boss'));return;}\n      if(run.stage.id==='stage-01'){beginStageOneBossIntro(run.stage.fixedEvents.find(event=>event.kind==='boss'));return;}\n      spawnStageBoss();","      if(def.production){beginProductionBossIntro(run.stage.fixedEvents.find(event=>event.kind==='boss'));return;}\n      spawnStageBoss();",'stage boss threshold dispatch');
          runtime=replaceOnce(runtime,"if(stageDefinition()?.production){beginProductionVictory(run,enemy);return;}if(run.stage.id==='stage-01'){beginStageOneVictory(run,enemy);return;}if(run.stage.id==='stage-02'){beginStageTwoVictory(run,enemy);return;}","if(stageDefinition()?.production){beginProductionVictory(run,enemy);return;}",'legacy Stage victory dispatch');
          runtime=removeBetween(runtime,'  function beginStageOneVictory(run,enemy){','  function ensureStageVictory(enemy=null){','legacy Stage 1/2 victories');
          runtime=replaceOnce(runtime,"if(v.production||['stage-01','stage-02'].includes(v.stageId))","if(v.production)",'victory cinematic completion branch');
          runtime=replaceOnce(runtime,"if(v.production){stageDefinition(v.stageId)?.production?.drawVictory?.(v);return;}if(v.stageId==='stage-01'){drawStageOneVictory(v);return;}if(v.stageId==='stage-02'){drawStageTwoVictory(v);return;}","if(v.production){stageDefinition(v.stageId)?.production?.drawVictory?.(v);return;}",'victory cinematic renderer branch');
          runtime=replaceOnce(runtime,"    state.mode='playing';state.time=Math.max(0,bossAt-previewSeconds);state.spawnTimer=Infinity;if(run.stage.id==='stage-01')updateStageOneRouteState(run);if(run.stage.id==='stage-02')updateStageTwoNebula(run);","    state.mode='playing';state.time=Math.max(0,bossAt-previewSeconds);state.spawnTimer=Infinity;",'developer preview special-case state');
          runtime=removeBetween(runtime,"\n  registerStageRuntime('stage-01',{","\n})();",'embedded Stage 1 base runtime');
          write('src/stage-runtime.js',runtime);

          let remodel=read('src/stage01-remodel.js');
          remodel=removeBetween(remodel,'  const STAGE_ONE_GIMMICK=Object.freeze({','  function projectileVisual(tag){','duplicate Stage 1 catalog shadow data');
          remodel=replaceOnce(remodel,"  const base=window.stackfallStageRuntimeRegistry?.get(STAGE_ID);\n  if(base){\n    const previousStart=base.onStart;\n    const production=Object.freeze({","  if(typeof window.stackfallRegisterStageRuntime==='function'){\n    const production=Object.freeze({",'Stage 1 base patch prelude');
          remodel=replaceOnce(remodel,"enemy.stageProduction=true;enemy.eliteForm=null;enemy.variant='orbit-warden';enemy.stagePhase=1;enemy.stage01BaseSpeed=enemy.speed;enemy.stage01OrbitDir=enemy.id%2?1:-1;enemy.stage01AttackCd=.75;enemy.stage01BurstCd=2.3;enemy.stage01LockCd=3.5;enemy.stage01RingOffset=0;\n        state.stageBossArena=null;stageAudio.playBoss();","enemy.stageProduction=true;enemy.eliteForm=null;enemy.variant='orbit-warden';enemy.stagePhase=1;enemy.stage01BaseSpeed=enemy.speed;enemy.stage01OrbitDir=enemy.id%2?1:-1;enemy.stage01AttackCd=.75;enemy.stage01BurstCd=2.3;enemy.stage01LockCd=3.5;enemy.stage01RingOffset=0;enemy.contactSafeUntil=(state.time||0)+1.2;stabilizeRealmTheme?.(STAGE_ID);\n        stageAudio.playBoss();",'Stage 1 production initialization');
          remodel=replaceOnce(remodel,'    const runtime=Object.freeze({...base,','    const runtime=Object.freeze({','Stage 1 inherited runtime spread');
          remodel=replaceOnce(remodel,"      theme:STAGE_ID,\n      initialSpawnTimer", "      theme:STAGE_ID,objectiveKey:'stage01.objective.boss',fixedEventKey:'stage01.event.fixed',\n      initialSpawnTimer",'Stage 1 runtime keys');
          remodel=replaceOnce(remodel,"      onStart(api){\n        previousStart?.(api);state.stageBossArena=null;api.run.stage01SweepCount=0;api.run.stage01LastSweep=-999;api.run.routeState={quiet:false,open:false};stageAudio.playAmbient();\n      },","      onStart(api){\n        clearStagePhysicalObjects();api.run.stage01SweepCount=0;api.run.stage01LastSweep=-999;api.run.routeState={quiet:false,open:false};stageAudio.playAmbient();\n      },",'Stage 1 start hook');
          remodel=replaceOnce(remodel,"spawnRadius:620,spawnShockwave:190}),\n      production","spawnRadius:180,spawnShockwave:190}),\n      bossSkill:null,\n      production",'Stage 1 boss profile spawn placement');
          remodel=replaceOnce(remodel,'    window.stackfallStageRuntimeRegistry.set(STAGE_ID,runtime);','    window.stackfallRegisterStageRuntime(STAGE_ID,runtime);','Stage 1 canonical registration');
          remodel=removeBetween(remodel,'  const previousClamp=window.stackfallClampStageBossToArena;','  document.querySelector(\'#startBtn\')','obsolete Stage 1 clamp override');
          write('src/stage01-remodel.js',remodel);

          let runContract=read('scripts/run-mode-contract.mjs');
          runContract=replaceOnce(runContract,"remodel.includes(\"window.stackfallStageRuntimeRegistry?.get(STAGE_ID)\")&&polish.includes(\"window.stackfallStageRuntimeRegistry?.get(STAGE_ID)\")","remodel.includes(\"window.stackfallRegisterStageRuntime(STAGE_ID,runtime)\")&&polish.includes(\"window.stackfallStageRuntimeRegistry?.get(STAGE_ID)\")",'run-mode Stage 1 registration contract');
          write('scripts/run-mode-contract.mjs',runContract);

          let bossContract=read('scripts/boss-identity-contract.mjs');
          bossContract=replaceOnce(bossContract,"rejectedStageTokens.every(token=>!stage.includes(token))&&stage.includes('bossSkill:null')","rejectedStageTokens.every(token=>!stage.includes(token))&&remodel.includes('bossSkill:null')&&!stage.includes('stageOneArena(')&&!stage.includes('beginStageOneBossIntro(')&&!stage.includes('beginStageTwoBossIntro(')",'boss generic-runtime debt contract');
          write('scripts/boss-identity-contract.mjs',bossContract);

          const staleFiles=[
            'docs/STAGE01_REBOOT_DESIGN_2026-10-15.md',
            'docs/STAGE01_REWORK_NOTE_2026-10-15.md',
            'docs/STAGE01_REWORK_NOTE_2026-10-15-2.md',
            'docs/STAGE1_VERTICAL_SLICE.md',
            'docs/STAGE_WORLD_REBOOT_2026-10-15.md',
            'docs/STAGE_PRODUCTION_REMAKE.md'
          ];
          const staleNames=[...staleFiles.map(file=>path.basename(file)),'stage1-evidence/'];
          const stripStaleDocLinks=file=>{
            if(!fs.existsSync(file))return;
            const lines=read(file).split(/\r?\n/);
            const next=lines.filter(line=>!staleNames.some(name=>line.includes(name))).join('\n');
            write(file,next.endsWith('\n')?next:next+'\n');
          };
          for(const file of ['README.md','docs/CANONICAL_AUDIT_2026-09-28.md','docs/GAME_DESIGN.md','docs/STACKFALL_PRODUCTION_BIBLE.md','docs/WIKI.md'])stripStaleDocLinks(file);
          for(const file of staleFiles)fs.rmSync(file,{force:true});
          fs.rmSync('docs/stage1-evidence',{recursive:true,force:true});

          const audit=`# Stackfall Refactor / Ownership Audit — 2026-10-17

          ## Current result

          This cleanup removes the remaining Stage-specific compatibility debt that was provably unreachable under the active production runtime. It does not mass-delete active refinement/expansion modules merely because their filenames are historical.

          ### Canonical ownership

          - \`src/stage-catalog.js\` now contains the actual Stage 1 Outer Route metadata, events, gimmick, and Orbit Warden identity. Stage 1 no longer rewrites the catalog or \`stackfallStageById\` at runtime.
          - \`src/stage-runtime.js\` is generic stage orchestration. Historical Stage 1 arena/clamp/intro/victory code and inactive Stage 2 bespoke intro/victory state branches were removed.
          - \`src/stage01-remodel.js\` registers Stage 1 directly. It no longer patches an obsolete embedded Stage 1 runtime and no longer overrides the removed arena clamp.
          - \`src/stage01-polish.js\` remains the deliberate final Stage 1 presentation/hazard layer; it does not replace the stage catalog or global elite spawning.
          - \`src/stage-constellation-backgrounds.js\` remains the constellation background owner, derived from Endless normal space.
          - \`src/stage-audio.js\` remains the authored-stage audio router.

          ### Removed stale artifacts

          Discarded Stage 1 reboot/rework/vertical-slice documents and their old capture bundle were removed. Their history remains available in Git and they no longer compete with the current visual canon.

          ### Intentionally retained

          Files such as \`combat-balance-refinement.js\`, \`community-feedback-refinement.js\`, \`reward-refinement.js\`, \`endgame-balance-expansion.js\`, and similar modules are still active runtime code and/or covered by explicit contracts. Deleting them by filename would be unsafe. Future cleanup should migrate them domain-by-domain only when equivalent canonical ownership is established and validated.

          ### Gate

          Before Stage 2 implementation, syntax checks, all repository contracts, the build fingerprint, and live browser verification must remain green. No new Stage-specific compatibility branch should be added to the generic stage runtime when a stage-owned production hook can express the behavior instead.
          `;
          write('docs/REFACTOR_AUDIT_2026-10-17.md',audit.replace(/^          /gm,''));

          const refs=[];
          const walk=dir=>{
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              if(entry.name==='.git'||entry.name==='node_modules')continue;
              const full=path.join(dir,entry.name);
              if(full==='.tmp-stackfall-cleanup.mjs'||full.startsWith('.github/workflows/refactor-cleanup-once'))continue;
              if(entry.isDirectory())walk(full);
              else if(/\.(?:md|js|mjs|html|yml|yaml)$/i.test(entry.name)){
                const text=read(full);
                for(const name of staleNames)if(text.includes(name))refs.push(`${full}: ${name}`);
              }
            }
          };
          walk('.');
          if(refs.length)fail('stale Stage 1 artifact references remain:\n'+refs.join('\n'));
          NODE
          node .tmp-stackfall-cleanup.mjs
          rm -f .tmp-stackfall-cleanup.mjs
          rm -f .github/workflows/refactor-cleanup-once.yml
          rm -f .github/workflows/refactor-cleanup-once-v2.yml
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Commit cleaned canonical state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stackfall-cleanup-bot'
          git config user.email 'stackfall-cleanup-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes produced.'
            exit 1
          fi
          git commit -m 'refactor: remove obsolete stage runtime debt'
          git push origin HEAD:main
