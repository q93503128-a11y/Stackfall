name: Temporary Dreadnought swarm v2

on:
  push:
    branches:
      - dreadnought-swarm-v2-validation

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/temp-dreadnought-swarm-v2.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check src/map-event-expansion.js
          node --check src/endless-pressure-rewards-v1.js
          node --check src/combat-integrity-v1.js
          node scripts/combat-integrity-contract.mjs
          node scripts/enemy-director-contract.mjs
          node scripts/runtime-ownership-contract.mjs
          node scripts/legacy-chat-requirements-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Commit production changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/map-event-expansion.js src/endless-pressure-rewards-v1.js scripts/combat-integrity-contract.mjs README.md docs/GAME_DESIGN.md docs/WIKI.md src/build-info.js
          git commit -m 'Expand late swarm and Dreadnought salvage rewards'
          git push origin HEAD:dreadnought-swarm-v2-validation
