name: Validate Stackfall

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0 | sort -z)
      - name: Check gameplay contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/polish-contract-check.mjs
          node scripts/apex-encounter-contract.mjs
          node scripts/endgame-balance-contract.mjs
          node scripts/realm-specials-contract.mjs
          node scripts/source-ownership-contract.mjs
