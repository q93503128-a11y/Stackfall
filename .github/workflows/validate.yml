name: Validate Stackfall

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0 | sort -z)
      - name: Check polish contract
        run: node scripts/polish-contract-check.mjs
      - name: Check apex contract
        run: node scripts/apex-encounter-contract.mjs
      - name: Check endgame contract
        run: node scripts/endgame-balance-contract.mjs
      - name: Check realm contract
        run: node scripts/realm-specials-contract.mjs
      - name: Check health ownership
        run: OWNERSHIP_GROUP=health node scripts/source-ownership-contract.mjs
      - name: Check regeneration runtime ownership
        run: OWNERSHIP_GROUP=regen-runtime node scripts/source-ownership-contract.mjs
      - name: Check regeneration documentation
        run: OWNERSHIP_GROUP=regen-docs node scripts/source-ownership-contract.mjs
      - name: Check Hard ownership
        run: OWNERSHIP_GROUP=hard node scripts/source-ownership-contract.mjs
      - name: Check Prism ownership
        run: OWNERSHIP_GROUP=prism node scripts/source-ownership-contract.mjs
      - name: Check targeting ownership
        run: OWNERSHIP_GROUP=targeting node scripts/source-ownership-contract.mjs
      - name: Check documentation ownership
        run: OWNERSHIP_GROUP=docs node scripts/source-ownership-contract.mjs
      - name: Check CI ownership
        run: OWNERSHIP_GROUP=ci node scripts/source-ownership-contract.mjs
      - name: Check community feedback polish
        run: node scripts/community-feedback-contract.mjs
      - name: Check damage result analytics
        run: node scripts/damage-results-contract.mjs
