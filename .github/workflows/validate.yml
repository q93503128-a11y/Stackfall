name: Validate Stackfall

on:
  push:
    branches: [main, fix/magnet-apex-runtime-audit]
  pull_request:

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0 | sort -z)
      - name: Check polish contract
        run: node scripts/polish-contract-check.mjs
      - name: Check meta upgrade contract
        run: node scripts/meta-upgrade-contract.mjs
      - name: Check level choice contract
        run: node scripts/level-choice-contract.mjs
      - name: Check stage catalog contract
        run: node scripts/stage-catalog-contract.mjs
      - name: Check production geometry and lifecycle contracts
        run: |
          node scripts/stage-geometry-contract.mjs
          node scripts/stage-craft-contract.mjs
          node scripts/dev-tools-contract.mjs
          node scripts/performance-audit-contract.mjs
      - name: Check sortie preparation contract
        run: node scripts/sortie-prep-contract.mjs
      - name: Check boss identity contract
        run: node scripts/boss-identity-contract.mjs
      - name: Check stage map contract
        run: node scripts/stage-map-contract.mjs
      - name: Check run mode contract
        run: node scripts/run-mode-contract.mjs
      - name: Check Enemy Director contract
        run: node scripts/enemy-director-contract.mjs
      - name: Check void boss contract
        run: node scripts/void-boss-contract.mjs
      - name: Check apex contract
        run: node scripts/apex-encounter-contract.mjs
      - name: Check endgame contract
        run: node scripts/endgame-balance-contract.mjs
      - name: Check realm contract
        run: node scripts/realm-specials-contract.mjs
      - name: Check health ownership
        run: OWNERSHIP_GROUP=health node scripts/source-ownership-contract.mjs
      - name: Check regeneration runtime ownership
        run: OWNERSHIP_GROUP=regen-runtime node scripts/source-ownership-contract.mjs
      - name: Check regeneration documentation
        run: OWNERSHIP_GROUP=regen-docs node scripts/source-ownership-contract.mjs
      - name: Check Hard ownership
        run: OWNERSHIP_GROUP=hard node scripts/source-ownership-contract.mjs
      - name: Check Prism ownership
        run: OWNERSHIP_GROUP=prism node scripts/source-ownership-contract.mjs
      - name: Check targeting ownership
        run: OWNERSHIP_GROUP=targeting node scripts/source-ownership-contract.mjs
      - name: Check documentation ownership
        run: OWNERSHIP_GROUP=docs node scripts/source-ownership-contract.mjs
      - name: Check CI ownership
        run: OWNERSHIP_GROUP=ci node scripts/source-ownership-contract.mjs
      - name: Check community feedback polish
        run: node scripts/community-feedback-contract.mjs
      - name: Check damage result analytics
        run: node scripts/damage-results-contract.mjs
      - name: Check recovered chat requirements
        run: node scripts/legacy-chat-requirements-contract.mjs
      - name: Check awakening A1-A7 contract
        run: node scripts/awakening-first-set-contract.mjs
      - name: Check awakening A8-A13 contract
        run: node scripts/awakening-second-set-contract.mjs
      - name: Check awakening A14-A19 contract
        run: node scripts/awakening-final-set-contract.mjs
      - name: Export workspace for direct test session
        uses: actions/upload-artifact@v4
        with:
          name: stackfall-workspace-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
