name: Atropos continuity v7

on:
  push:
    branches: [feature/atropos-world-devourer-prototype]
    paths: [scripts/atropos-continuity-v7-trigger.txt]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Apply continuity v7
        run: |
          python scripts/atropos-continuity-v7.py
          node --check src/atropos-world-devourer-prototype.js
          node scripts/atropos-code-audit.mjs
      - name: Commit continuity v7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-prototype.js
          git commit -m "Keep Atropos body visually continuous across depth layers"
          git push origin HEAD:feature/atropos-world-devourer-prototype
