name: tmp-answer-polish2
on:
  push:
    branches:
      - feature/void-apex-answer-v1
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply second-pass patch
        run: |
          python scripts/tmp-answer-polish2.py
          python scripts/tmp-answer-contract2.py
      - name: Parse JavaScript
        run: node --check src/void-apex-answer-combat-v1.js
      - name: Focused Answer contract
        run: node scripts/void-apex-answer-contract.mjs
      - name: Full validation and build fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Recheck Answer contract
        run: node scripts/void-apex-answer-contract.mjs
      - name: Verify second-pass invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/void-apex-answer-combat-v1.js').read_text()
          c=Path('scripts/void-apex-answer-contract.mjs').read_text()
          checks={
            'split uses organic void wisps': "flowT=performance.now()*.00020" in s and 'quadraticCurveTo' in s and 'lineDashOffset=-flow' not in s,
            'fake spikes translucent': "rgba(235,242,252,.34)" in s,
            'true spikes readable rim': "rgba(148,112,179,.74)" in s,
            'clone bolt has readable trail': "c.r*scale*4.2" in s and "rgba(225,229,238,.86)" in s,
            'contract migrated with implementation': "flowT=performance.now()*.00020" in c and "!combat.includes('lineDashOffset=-flow')" in c,
          }
          for name,ok in checks.items(): print(('PASS' if ok else 'FAIL'),name)
          if not all(checks.values()): raise SystemExit(1)
          PY
      - name: Commit verified second pass
        run: |
          rm -f .github/workflows/tmp-answer-polish2.yml scripts/tmp-answer-polish2.py scripts/tmp-answer-contract2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine Answer void flow and hostile readability'
          git push origin HEAD:feature/void-apex-answer-v1
