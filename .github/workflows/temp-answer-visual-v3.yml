name: Temporary Answer Visual V3

on:
  push:
    branches: [feature/void-apex-answer-v1]

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply visual revision
        run: python3 scripts/temp-answer-visual-v3.py
      - name: Validate and regenerate fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Commit revision
        run: |
          if git diff --quiet -- src/void-apex-answer-v1.js scripts/void-apex-answer-contract.mjs src/build-info.js; then
            echo "No revision changes to commit"
            exit 0
          fi
          git config user.name "stackfall-ci"
          git config user.email "stackfall-ci@users.noreply.github.com"
          git add src/void-apex-answer-v1.js scripts/void-apex-answer-contract.mjs src/build-info.js
          git commit -m "Revise Answer fissure lighting and entry threat visuals"
          git push origin HEAD:feature/void-apex-answer-v1
