name: Restore orbit renderer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/restore-orbit-renderer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-orbit-renderer
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore canonical orbit renderer owner
        run: node scripts/restore-orbit-renderer.mjs
      - name: Refresh build fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
      - name: Run gameplay contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/polish-contract-check.mjs
          node scripts/apex-encounter-contract.mjs
          node scripts/endgame-balance-contract.mjs
          node scripts/realm-specials-contract.mjs
          node scripts/source-ownership-contract.mjs
          node scripts/community-feedback-contract.mjs
      - name: Check patch integrity
        run: git diff --check
      - name: Publish source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/render-entities.js src/build-info.js scripts/community-feedback-contract.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Restore equipped orbit renderer owner'
          git push origin HEAD:agent/restore-orbit-renderer
