name: Temporary Answer V8 Validation

on:
  push:
    branches: [feature/void-apex-answer-v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Stackfall sources and contracts
        run: node scripts/build-fingerprint.mjs
