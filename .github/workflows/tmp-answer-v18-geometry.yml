name: tmp-answer-v18-geometry
on:
  push:
    branches: [feature/void-apex-answer-v1]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run Answer V18 geometry refactor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply geometry refactor
        run: python scripts/tmp-answer-v18-geometry.py
      - name: Parse changed JavaScript
        run: |
          node --check src/void-apex-answer-combat-v1.js
          node --check src/void-apex-answer-v1.js
          node --check scripts/void-apex-answer-contract.mjs
      - name: Focused Answer contract
        run: node scripts/void-apex-answer-contract.mjs
      - name: Full validation and build fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Recheck focused contract after fingerprint
        run: node scripts/void-apex-answer-contract.mjs
      - name: Verify structural invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "window.stackfallVoidApexAnswerCombat='v2'" src/void-apex-answer-combat-v1.js
          grep -F "const BODY_UNDERSIDE_SRC=" src/void-apex-answer-combat-v1.js
          grep -F "e.stageBodyShapes=[{kind:'polygon',points}]" src/void-apex-answer-combat-v1.js
          grep -F "rayArenaEnd(origin,aim)" src/void-apex-answer-combat-v1.js
          grep -F "const FISSURE_EDGES=" src/void-apex-answer-combat-v1.js
          grep -F "fissureRootScreen()" src/void-apex-answer-combat-v1.js
          grep -F "STACKFALL_VOID_APEX_ANSWER_VISUAL_REVISION='v18'" src/void-apex-answer-v1.js
          ! grep -F "bodyOrigin=" src/void-apex-answer-combat-v1.js
          git diff --check
      - name: Commit verified implementation and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-answer-geometry-audit.yml
          rm -f .github/workflows/tmp-answer-v18-geometry.yml
          rm -f scripts/tmp-answer-v18-geometry.py
          node scripts/void-apex-answer-contract.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild Answer geometry spikes and fissure attacks'
          git push origin HEAD:feature/void-apex-answer-v1
