# rerun after achievement hub layout balance fix
name: Temporary achievement live visual QA

on:
  push:
    paths:
      - '.github/workflows/achievement-live-qa-temp.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for deployed fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected=$(node --input-type=module -e "import {computeBuildFingerprint} from './scripts/build-fingerprint.mjs'; console.log(computeBuildFingerprint(process.cwd()).sha)")
          for attempt in $(seq 1 24); do
            body=$(curl -fsS "https://stackfall.pages.dev/src/build-info.js?achievement-qa=${GITHUB_SHA}-${attempt}" || true)
            if printf '%s' "$body" | grep -Fq "$expected"; then
              echo "deployed fingerprint matched: $expected"
              exit 0
            fi
            echo "attempt $attempt: waiting for deployment"
            sleep 15
          done
          exit 1
      - name: Run achievement visual QA
        run: node scripts/achievement-live-qa-temp.mjs
      - name: Upload achievement QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackfall-achievement-live-qa
          path: test-results/achievement-live-qa
          if-no-files-found: error
