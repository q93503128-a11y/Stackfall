name: Cleanup 11 scoped documentation sync temp

on:
  push:
    branches:
      - cleanup11-doc-sync-validation

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize canonical docs
        run: python3 scripts/cleanup11-doc-sync-temp.py
      - name: Validate canonical runtime contracts and docs
        shell: bash
        run: |
          set -euo pipefail
          for f in src/*.js; do node --check "$f"; done
          node --check scripts/legacy-chat-requirements-contract.mjs
          node scripts/run-mode-contract.mjs
          node scripts/legacy-chat-requirements-contract.mjs
          node scripts/build-fingerprint.mjs
          grep -Fq 'production gameplay is **Endless-only**' README.md
          grep -Fq 'Active random world events are exactly' README.md
          grep -Fq '**활성 플레이 런타임은 Endless 하나다.**' docs/GAME_DESIGN.md
          grep -Fq '**활성 이벤트 패밀리는 정확히 3종**' docs/GAME_DESIGN.md
          grep -Fq '**현재 유일하게 활성화된 런타임**' docs/WIKI.md
          grep -Fq '현재 runtime은 봉인' docs/WIKI.md
          if grep -Fq '신규 5종은 조난 신호' docs/GAME_DESIGN.md; then exit 1; fi
          git diff --check
      - name: Commit validated clean tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup11-doc-sync-temp.yml scripts/cleanup11-doc-sync-temp.py
          git config user.name coworkaccount
          git config user.email cyp1jhh2@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'Validate Cleanup 11 canonical documentation sync'
          git push origin HEAD:cleanup11-doc-sync-validation
