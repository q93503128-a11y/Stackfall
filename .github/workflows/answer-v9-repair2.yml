name: Repair Answer V9 Retry

on:
  push:
    branches: [feature/void-apex-answer-v1]
    paths:
      - '.github/workflows/answer-v9-repair2.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[answer-v9-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Answer runtime and contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          answer_path=Path('src/void-apex-answer-v1.js')
          contract_path=Path('scripts/void-apex-answer-contract.mjs')
          s=answer_path.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              hits=s.count(old)
              if hits!=1: raise SystemExit(f'{label}: expected exactly one match, got {hits}')
              s=s.replace(old,new,1)

          once("window.STACKFALL_VOID_APEX_ANSWER_VISUAL_REVISION='v8';","window.STACKFALL_VOID_APEX_ANSWER_VISUAL_REVISION='v9';",'revision')
          once("preflightGemCount:0,choiceGateOwned:false\n  };","preflightGemCount:0,choiceGateOwned:false,prepStage:'idle',prepBlock:'',prepElapsed:0\n  };",'preview fields')
          once("  function releasePreparationGate(){if(preview.choiceGateOwned){state.choiceLocked=false;preview.choiceGateOwned=false;}}",
          """  function staleChoiceLock(){
            const hidden=!ui?.choice||ui.choice.classList.contains('hidden');
            return state.mode==='playing'&&state.choiceLocked===true&&state.choiceOpening!==true&&hidden;
          }
          function normalizeStaleChoiceLock(){
            if(!staleChoiceLock())return false;
            state.choiceLocked=false;
            return true;
          }
          function acquirePreparationGate(){
            normalizeStaleChoiceLock();
            if(state.mode!=='playing'||state.choiceOpening===true||state.choiceLocked===true)return false;
            state.choiceLocked=true;preview.choiceGateOwned=true;return true;
          }
          function releasePreparationGate(){if(preview.choiceGateOwned){state.choiceLocked=false;preview.choiceGateOwned=false;}}
          function setPrepState(stage,block=''){preview.prepStage=stage;preview.prepBlock=block;syncDevStatus();}""",'choice gate helpers')
          once("Object.assign(preview,{active:false,preparing:false,defeating:false,defeatAge:0,aftermath:false,runSerial:null,preflightXp:0,preflightGemCount:0});",
               "Object.assign(preview,{active:false,preparing:false,defeating:false,defeatAge:0,aftermath:false,runSerial:null,preflightXp:0,preflightGemCount:0,prepStage:'idle',prepBlock:'',prepElapsed:0});",'clear preview state')

          pattern=r"  function activatePreparedEncounter\(\)\{.*?\n  function activate\(\)\{return beginPreparation\(\);\}"
          replacement="""  function activatePreparedEncounter(){
            if(!preview.preparing||activeExperienceGems().length||state.choiceOpening===true||state.mode!=='playing'||state.choiceLocked||state.xp>=state.xpNeed)return false;
            releasePreparationGate();
            preview.preparing=false;preview.active=true;preview.phase=1;preview.hpRatio=1;preview.defeating=false;preview.defeatAge=0;preview.aftermath=false;
            preview.prepStage='active';preview.prepBlock='';preview.prepElapsed=0;
            state.answerVoidApexPreparing=false;state.answerVoidApexPreview=true;state.answerVoidSealed=false;
            document.documentElement.dataset.answerPreparing='0';document.documentElement.dataset.answerPreview='1';
            preview.camX=player.x;preview.camY=player.y-(Number(vh)||720)*.205;
            player.y=preview.camY+(Number(vh)||720)*.225;player.invuln=Math.max(Number(player.invuln)||0,1.2);
            clampPlayerToArena();syncBossHud();syncDevStatus();state.camera.shake=Math.max(Number(state.camera.shake)||0,3.5);state.flash=Math.max(Number(state.flash)||0,.02);
            try{audio?.tone?.(42,.34,'sawtooth',.022,-8);}catch{}
            return true;
          }
          function activeExperienceGems(){
            const gems=state.entities?.gems||[];
            return gems.filter(g=>typeof experienceGemActive==='function'?experienceGemActive(g):!!(g&&g.active!==false));
          }
          function advancePreparation(){
            if(!preview.preparing)return false;
            const gems=activeExperienceGems();
            if(gems.length){setPrepState('collecting-xp',`${gems.length} gems`);return false;}
            releasePreparationGate();
            if(state.mode==='choice'||state.choiceOpening===true||state.choiceLocked===true){setPrepState('resolving-level-choice','choice-busy');return false;}
            if(state.mode!=='playing'){setPrepState('waiting-mode',String(state.mode||'unknown'));return false;}
            if(state.xp>=state.xpNeed){
              setPrepState('opening-level-choice','xp-ready');
              try{tryLevelUp();}catch(error){console.error('[Stackfall] Answer preflight level-up failed',error);setPrepState('blocked','level-up-error');return false;}
              if(state.mode==='playing'&&state.choiceOpening!==true&&state.choiceLocked!==true&&state.xp<state.xpNeed)return activatePreparedEncounter();
              return false;
            }
            setPrepState('ready','');
            return activatePreparedEncounter();
          }
          function prepareLevelChoicesWhenReady(){return advancePreparation();}
          function beginPreparation(){
            if(state.mode!=='playing'||preview.active||preview.preparing)return false;
            normalizeStaleChoiceLock();
            if(!acquirePreparationGate()){preview.prepStage='blocked';preview.prepBlock='choice-busy';syncDevStatus();return false;}
            try{clearHostileField();}catch(error){releasePreparationGate();preview.prepStage='blocked';preview.prepBlock='field-clear-error';syncDevStatus();console.error('[Stackfall] Answer preflight field clear failed',error);return false;}
            Object.assign(preview,{preparing:true,active:false,phase:1,hpRatio:1,defeating:false,defeatAge:0,aftermath:false,runSerial:state.runSerial,preflightXp:0,preflightGemCount:0,prepStage:'collecting-xp',prepBlock:'',prepElapsed:0});
            preview.choiceGateOwned=true;
            state.answerVoidApexPreparing=true;state.answerVoidApexPreview=false;state.answerVoidSealed=false;
            document.documentElement.dataset.answerPreparing='1';document.documentElement.dataset.answerPreview='0';
            player.invuln=Math.max(Number(player.invuln)||0,5);
            let pulled={count:0,value:0};
            try{if(typeof window.stackfallCollectSuctionMagnet==='function')pulled=window.stackfallCollectSuctionMagnet()||pulled;}catch(error){releasePreparationGate();preview.preparing=false;state.answerVoidApexPreparing=false;preview.prepStage='blocked';preview.prepBlock='xp-magnet-error';syncDevStatus();console.error('[Stackfall] Answer preflight suction failed',error);return false;}
            preview.preflightGemCount=Math.max(0,Number(pulled.count)||0);preview.preflightXp=Math.max(0,Number(pulled.value)||0);
            try{shockwave(player.x,player.y,'#ffdf79',105,.42,2.2);spawnParticle(player.x,player.y,'#fff3ba',12,125,2.5);audio?.pickup?.();}catch{}
            syncDevStatus();
            if(preview.preflightGemCount===0)queueMicrotask(advancePreparation);
            return true;
          }
          function activate(){return beginPreparation();}"""
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'preparation state machine: expected 1 replacement, got {n}')

          once("releasePreparationGate();preview.active=false;preview.preparing=false;preview.defeating=false;preview.defeatAge=0;preview.aftermath=false;",
               "releasePreparationGate();preview.active=false;preview.preparing=false;preview.defeating=false;preview.defeatAge=0;preview.aftermath=false;preview.prepStage='idle';preview.prepBlock='';preview.prepElapsed=0;",'stop prep reset')
          once("state.answerVoidSealed=true;preview.active=false;preview.defeating=false;preview.aftermath=true;state.answerVoidApexPreview=false;",
               "state.answerVoidSealed=true;preview.active=false;preview.defeating=false;preview.aftermath=true;preview.prepStage='aftermath';preview.prepBlock='';state.answerVoidApexPreview=false;",'finish defeat state')
          once("if(preview.preparing){player.invuln=Math.max(Number(player.invuln)||0,.35);prepareLevelChoicesWhenReady();return;}",
               "if(preview.preparing){preview.prepElapsed+=step;player.invuln=Math.max(Number(player.invuln)||0,.35);advancePreparation();syncDevStatus();return;}",'preparing update')

          once("let answerBodyMask=null,answerBodyReady=false,answerBodyFailed=false,answerBodyBounds=null;",
               "let answerBodyMask=null,answerBodyReady=false,answerBodyFailed=false,answerBodyBounds=null,answerBodyMaskStats=null;",'mask diagnostics')
          once("try{buildAnswerBodyLayers();answerBodyReady=true;answerBodyFailed=false;}catch(error){answerBodyReady=false;answerBodyFailed=true;console.error('[Stackfall] Answer body preparation failed',error);}",
               "try{buildAnswerBodyLayers();answerBodyReady=true;answerBodyFailed=false;syncDevStatus();}catch(error){answerBodyReady=false;answerBodyFailed=true;syncDevStatus();console.error('[Stackfall] Answer body preparation failed',error);}",'asset load sync')
          once("answerBodyImage.addEventListener('error',()=>{answerBodyReady=false;answerBodyFailed=true;});",
               "answerBodyImage.addEventListener('error',()=>{answerBodyReady=false;answerBodyFailed=true;syncDevStatus();});",'asset error sync')

          mask_pattern=r"  function buildAnswerMask\(w,h\)\{.*?\n    return canvas;\n  \}"
          mask_replacement="""  function weightedMaskQuantile(counts,total,ratio){
            const target=Math.max(1,total*clamp01(ratio));let acc=0;
            for(let i=0;i<counts.length;i++){acc+=counts[i];if(acc>=target)return i;}
            return Math.max(0,counts.length-1);
          }
          function buildAnswerMask(w,h){
            const canvas=makeCanvas(w,h),g=canvas.getContext('2d',{alpha:true,willReadFrequently:true});
            g.clearRect(0,0,w,h);g.drawImage(answerBodyImage,0,0,w,h);
            const image=g.getImageData(0,0,w,h),data=image.data,histogram=new Uint32Array(256);
            for(let i=3;i<data.length;i+=4)histogram[data[i]]++;
            let strongPixels=0,maxAlpha=0;for(let a=1;a<256;a++){if(histogram[a])maxAlpha=a;if(a>=18)strongPixels+=histogram[a];}
            const threshold=strongPixels>=w*h*.02?18:2,rows=new Uint32Array(h),cols=new Uint32Array(w);let solidPixels=0;
            for(let y=0;y<h;y++)for(let x=0;x<w;x++){
              const i=(y*w+x)*4,a=data[i+3],solid=a>=threshold;
              data[i]=0;data[i+1]=0;data[i+2]=4;data[i+3]=solid?255:0;
              if(solid){solidPixels++;rows[y]++;cols[x]++;}
            }
            if(!solidPixels)throw new Error('Answer body alpha mask is empty');
            g.putImageData(image,0,0);
            const minX=weightedMaskQuantile(cols,solidPixels,.001),maxX=weightedMaskQuantile(cols,solidPixels,.999),minY=weightedMaskQuantile(rows,solidPixels,.001),maxY=weightedMaskQuantile(rows,solidPixels,.999);
            answerBodyBounds={minX,minY,maxX,maxY,width:Math.max(1,maxX-minX+1),height:Math.max(1,maxY-minY+1)};
            answerBodyMaskStats={threshold,solidPixels,coverage:solidPixels/(w*h),maxAlpha};
            return canvas;
          }"""
          s,n=re.subn(mask_pattern,mask_replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'alpha mask: expected 1 replacement, got {n}')

          once("if(baseDraw)draw=function drawWithAnswerAftermath(){ensureRunIdentity();const result=baseDraw();drawAftermathOverlay();return result;};",
               "if(baseDraw)draw=function drawWithAnswerAftermath(){ensureRunIdentity();const result=baseDraw();if(preview.active)syncBossHud();syncDevStatus();drawAftermathOverlay();return result;};",'post draw ownership')

          status_helper="""  function syncDevStatus(){
            const el=document.querySelector('#devAnswerStatus');if(!el)return;
            const assetState=answerBodyFailed?'asset FAIL':answerBodyReady?'asset READY':'asset loading';
            const coverage=answerBodyMaskStats?`${Math.round(answerBodyMaskStats.coverage*1000)/10}%@a${answerBodyMaskStats.threshold}`:'mask -';
            const encounter=preview.active?(preview.defeating?'DEFEAT':`ACTIVE P${preview.phase}`):preview.preparing?`PREP ${preview.prepStage}`:preview.aftermath?'AFTERMATH':preview.prepStage==='blocked'?`BLOCKED ${preview.prepBlock}`:'IDLE';
            const gems=preview.preparing?activeExperienceGems().length:0;
            const text=`${encounter} · mode ${state.mode} · lock ${state.choiceLocked===true?'ON':'off'} · gems ${gems} · ${assetState} · ${coverage}`;
            if(el.textContent!==text)el.textContent=text;
          }

          function installDevControls(){"""
          s,n=re.subn(r"  function installDevControls\(\)\{",status_helper,s,count=1)
          if n!=1: raise SystemExit(f'dev status helper: expected 1 replacement, got {n}')
          once("const button=(text,id,handler,wide=false)=>{const b=document.createElement('button');b.type='button';b.id=id;b.textContent=text;if(wide)b.className='dev-wide';b.addEventListener('click',handler);return b;};",
               "const button=(text,id,handler,wide=false)=>{const b=document.createElement('button');b.type='button';b.id=id;b.textContent=text;if(wide)b.className='dev-wide';b.addEventListener('click',()=>{try{handler();}finally{queueMicrotask(syncDevStatus);}});return b;};",'dev button status')
          once("panel.append(label,grid);",
               "const status=document.createElement('div');status.id='devAnswerStatus';status.className='dev-wide';status.style.cssText='margin:4px 0 14px;padding:8px 10px;border:1px solid rgba(140,174,230,.18);border-radius:9px;background:rgba(9,14,30,.72);color:#92a7cb;font:700 10px/1.45 monospace;word-break:break-word';panel.append(label,grid,status);syncDevStatus();",'append dev status')
          once("answerPrototypeSnapshot:()=>({active:preview.active,preparing:preview.preparing,preflightGemCount:preview.preflightGemCount,preflightXp:preview.preflightXp,phase:preview.phase,hpRatio:preview.hpRatio,defeating:preview.defeating,defeatAge:preview.defeatAge,aftermath:preview.aftermath,voidSealed:state.answerVoidSealed===true,threat:preview.threat,camera:{x:preview.camX,y:preview.camY},bounds:preview.active?worldBounds():null})",
               "answerPrototypeSnapshot:()=>({active:preview.active,preparing:preview.preparing,prepStage:preview.prepStage,prepBlock:preview.prepBlock,preflightGemCount:preview.preflightGemCount,preflightXp:preview.preflightXp,phase:preview.phase,hpRatio:preview.hpRatio,defeating:preview.defeating,defeatAge:preview.defeatAge,aftermath:preview.aftermath,voidSealed:state.answerVoidSealed===true,threat:preview.threat,mode:state.mode,choiceLocked:state.choiceLocked===true,camera:{x:preview.camX,y:preview.camY},bounds:preview.active?worldBounds():null,asset:{ready:answerBodyReady,failed:answerBodyFailed,mask:answerBodyMaskStats}})",'snapshot diagnostics')
          once("version:'v1',visualRevision:'v8',prototypeOnly:true,active:preview.active,preparing:preview.preparing,",
               "version:'v1',visualRevision:'v9',prototypeOnly:true,active:preview.active,preparing:preview.preparing,prepStage:preview.prepStage,prepBlock:preview.prepBlock,",'diagnostics revision')
          once("threat:preview.threat,camera:{x:preview.camX,y:preview.camY},geometry:geometry(),",
               "threat:preview.threat,mode:state.mode,choiceLocked:state.choiceLocked===true,camera:{x:preview.camX,y:preview.camY},geometry:geometry(),",'diagnostics state')
          once("asset:{src:ANSWER_BODY_SRC,ready:answerBodyReady,failed:answerBodyFailed,naturalWidth:answerBodyImage.naturalWidth||0,naturalHeight:answerBodyImage.naturalHeight||0,bounds:answerBodyBounds},",
               "asset:{src:ANSWER_BODY_SRC,ready:answerBodyReady,failed:answerBodyFailed,naturalWidth:answerBodyImage.naturalWidth||0,naturalHeight:answerBodyImage.naturalHeight||0,bounds:answerBodyBounds,mask:answerBodyMaskStats},",'diagnostics mask')
          answer_path.write_text(s,encoding='utf-8')

          c=contract_path.read_text(encoding='utf-8')
          old="['Answer V8 renders the approved raster cosmic body asset',answer.includes(\"STACKFALL_VOID_APEX_ANSWER_VISUAL_REVISION='v8'\")"
          new="['Answer V9 renders the approved raster cosmic body asset',answer.includes(\"STACKFALL_VOID_APEX_ANSWER_VISUAL_REVISION='v9'\")"
          if c.count(old)!=1: raise SystemExit('contract revision check not found')
          c=c.replace(old,new,1)
          needle="  ['body framing preserves the raster aspect ratio and keeps only a cropped upper-screen presence',answer.includes('h=w/ratio')&&answer.includes('visibleDepth=Math.max(185,Math.min(285,height*.285))')&&answer.includes('bodyBottom=(bounds.maxY+1)/naturalH')&&answer.includes('y:visibleDepth-bodyBottom*h')],\n"
          if needle not in c: raise SystemExit('contract framing check not found')
          c=c.replace(needle,needle+"  ['body framing ignores sparse alpha outliers with robust weighted bounds',answer.includes('function weightedMaskQuantile')&&answer.includes('answerBodyMaskStats={threshold,solidPixels,coverage:solidPixels/(w*h),maxAlpha}')&&answer.includes('strongPixels>=w*h*.02?18:2')],\n",1)
          needle2="  ['pre-fight preparation uses the canonical suction magnet path',answer.includes(\"typeof window.stackfallCollectSuctionMagnet==='function'\")&&answer.includes('preview.preflightGemCount')&&answer.includes('preview.preflightXp')],\n"
          if needle2 not in c: raise SystemExit('contract suction check not found')
          c=c.replace(needle2,needle2+"  ['preparation gate repairs only stale playing locks and owns its own lock',answer.includes('function staleChoiceLock()')&&answer.includes(\"state.mode==='playing'&&state.choiceLocked===true&&state.choiceOpening!==true&&hidden\")&&answer.includes('function acquirePreparationGate()')&&answer.includes('preview.choiceGateOwned=true')&&answer.includes('function releasePreparationGate()')],\n  ['developer Answer start keeps the full canonical preparation path',answer.includes(\"button('응답 시안 시작','devAnswerStart',()=>activate(),true)\")&&answer.includes('function activate(){return beginPreparation();}')&&answer.includes('function advancePreparation()')],\n",1)
          needle3="  ['asset load state and alpha bounds are observable for runtime verification',answer.includes('answerBodyReady')&&answer.includes('answerBodyFailed')&&answer.includes('naturalWidth:answerBodyImage.naturalWidth||0')&&answer.includes('bounds:answerBodyBounds')],\n"
          if needle3 not in c: raise SystemExit('contract asset observability check not found')
          c=c.replace(needle3,needle3+"  ['developer diagnostics expose preparation and raster-mask state',answer.includes(\"status.id='devAnswerStatus'\")&&answer.includes('prepStage:preview.prepStage')&&answer.includes('mask:answerBodyMaskStats')],\n",1)
          contract_path.write_text(c,encoding='utf-8')
          PY
      - name: Validate repaired Answer
        run: |
          node --check src/void-apex-answer-v1.js
          node scripts/void-apex-answer-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Commit validated repair
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add src/void-apex-answer-v1.js scripts/void-apex-answer-contract.mjs src/build-info.js
          git commit -m '[answer-v9-patch] Fix canonical preflight and raster framing'
          git push origin HEAD:feature/void-apex-answer-v1
