name: Cleanup Answer V12 temporary files
on:
  push:
    branches: [feature/void-apex-answer-v1]
    paths: [.github/workflows/answer-v12-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/void-apex-answer-v1, fetch-depth: 0}
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f scripts/patch-answer-v12.mjs .github/workflows/answer-v12-patch.yml .github/workflows/answer-v12-cleanup.yml
          git commit -m "Remove temporary Answer V12 patch tooling"
          git push origin HEAD:feature/void-apex-answer-v1
