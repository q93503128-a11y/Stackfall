name: Temporary Stackfall performance pass 4

on:
  push:
    paths:
      - '.github/workflows/performance-pass4-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply render hot-loop optimizations
        run: node scripts/performance-pass4-temp.mjs
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          node --check src/render-entities.js
          node --check src/realm-backgrounds.js
          node scripts/performance-audit-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Commit optimized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/render-entities.js src/realm-backgrounds.js scripts/performance-audit-contract.mjs src/build-info.js
          git commit -m 'perf: reduce hot render loop allocations'
          git push origin HEAD:main
