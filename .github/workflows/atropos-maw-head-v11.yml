name: Atropos Maw head v11

on:
  push:
    branches: [feature/atropos-world-devourer-prototype]
    paths: [scripts/atropos-maw-head-v11-trigger.txt]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Apply Maw head v11
        run: |
          python scripts/atropos-maw-head-v11.py
          node --check src/atropos-world-devourer-prototype.js
          node scripts/atropos-code-audit.mjs
      - name: Commit Maw head v11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-prototype.js
          git commit -m "Use stable Atropos head silhouette for Void Maw"
          git push origin HEAD:feature/atropos-world-devourer-prototype
