name: Capture Stackfall boss gallery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-boss-gallery.mjs'
      - '.github/workflows/capture-boss-gallery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture original endless boss designs
        run: node scripts/capture-boss-gallery.mjs
      - name: Upload gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackfall-boss-gallery
          path: test-results/boss-gallery
          if-no-files-found: error
