name: tmp-answer-hitbox-row-fix
on:
  push:
    branches: [feature/void-apex-answer-v1]
    paths:
      - 'scripts/tmp-answer-hitbox-row-fix.py'
      - '.github/workflows/tmp-answer-hitbox-row-fix.yml'
permissions:
  contents: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hazard geometry patch
        run: python scripts/tmp-answer-hitbox-row-fix.py
      - name: Parse changed JavaScript
        run: |
          node --check src/void-apex-answer-combat-v1.js
          node --check src/void-apex-answer-v1.js
      - name: Focused Answer contracts
        run: |
          node scripts/void-apex-answer-contract.mjs
          node scripts/apex-encounter-contract.mjs
          node scripts/endgame-balance-contract.mjs
          node scripts/level-choice-contract.mjs
      - name: Full contract regression
        run: |
          for f in scripts/*contract*.mjs; do echo "== $f =="; node "$f"; done
      - name: Refresh build fingerprint and recheck Answer contract
        run: |
          node scripts/build-fingerprint.mjs
          node scripts/void-apex-answer-contract.mjs
      - name: Verify requested invariants
        run: |
          grep -F "axis:'horizontal'" src/void-apex-answer-combat-v1.js
          grep -F "function spikePolygon" src/void-apex-answer-combat-v1.js
          grep -F "circleHitsPoly(ps.x,ps.y,hazardPlayerRadius(),poly)" src/void-apex-answer-combat-v1.js
          grep -F "SPLIT_BAND_HALF+hazardPlayerRadius()" src/void-apex-answer-combat-v1.js
          ! grep -F "player.r+15" src/void-apex-answer-combat-v1.js
      - name: Commit verified result and remove temporary files
        run: |
          rm scripts/tmp-answer-hitbox-row-fix.py .github/workflows/tmp-answer-hitbox-row-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align Answer spike visuals and hit geometry'
          git push origin HEAD:feature/void-apex-answer-v1
