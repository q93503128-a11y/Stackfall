name: Apply off-screen guidance restoration

on:
  push:
    branches: [agent/restore-offscreen-guidance]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-validate-publish:
    if: (github.head_ref == 'agent/restore-offscreen-guidance' || github.ref_name == 'agent/restore-offscreen-guidance') && github.event.head_commit.message != 'Restore off-screen boss and event guidance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-offscreen-guidance
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply restoration
        run: |
          set -euo pipefail
          python3 scripts/restore-offscreen-guidance.py
          node scripts/build-fingerprint.mjs
      - name: Verify intended source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git diff --name-only)"
          grep -q 'function drawEliteEdgeArrows()' src/build-audit-ui.js
          grep -q 'guidanceEventArrows' src/build-audit-ui.js
          grep -q 'stackfallGuidanceDiagnostics' src/build-audit-ui.js
          grep -q 'off-screen guidance missing' scripts/browser-smoke.mjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
      - name: Run gameplay contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/community-feedback-contract.mjs
          node scripts/polish-contract-check.mjs
          node scripts/endgame-balance-contract.mjs
          node scripts/realm-specials-contract.mjs
          for group in health regen-runtime regen-docs hard prism docs ci; do OWNERSHIP_GROUP="$group" node scripts/source-ownership-contract.mjs; done
      - name: Run browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && break
            sleep .2
          done
          STACKFALL_ALLOW_CONTEXT_SKIP=1 node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/ --result=test-results/offscreen-guidance.json
      - name: Remove migration artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/restore-offscreen-guidance.yml \
            .github/guidance-restoration-trigger.txt \
            .github/workflows/apply-offscreen-guidance-branch.yml \
            scripts/restore-offscreen-guidance.py
          git diff --check
          test ! -e .github/workflows/restore-offscreen-guidance.yml
          test ! -e .github/guidance-restoration-trigger.txt
          test ! -e .github/workflows/apply-offscreen-guidance-branch.yml
          test ! -e scripts/restore-offscreen-guidance.py
      - name: Publish validated restoration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Restore off-screen boss and event guidance'
          git push origin HEAD:agent/restore-offscreen-guidance
