name: tmp-answer-v18-polish3
on:
  push:
    branches: [feature/void-apex-answer-v1]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run final Answer V18 presentation polish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final presentation polish
        run: python scripts/tmp-answer-v18-polish3.py
      - name: Parse changed JavaScript
        run: node --check src/void-apex-answer-combat-v1.js
      - name: Focused Answer contract
        run: node scripts/void-apex-answer-contract.mjs
      - name: Full validation and fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Recheck focused contract
        run: node scripts/void-apex-answer-contract.mjs
      - name: Verify visual invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "root=16+Math.min(10,fullD*.010)" src/void-apex-answer-combat-v1.js
          grep -F "{phase:2,points:[[.392,.600],[.381,.592]" src/void-apex-answer-combat-v1.js
          grep -F "{phase:3,points:[[.348,.608],[.338,.596]" src/void-apex-answer-combat-v1.js
          grep -F "const gx=ctx.createLinearGradient" src/void-apex-answer-combat-v1.js
          git diff --check
      - name: Commit verified final polish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-answer-v18-polish3.yml
          rm -f scripts/tmp-answer-v18-polish3.py
          node scripts/void-apex-answer-contract.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Answer tendril silhouette fissures and beam'
          git push origin HEAD:feature/void-apex-answer-v1
