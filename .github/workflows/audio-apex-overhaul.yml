name: Apply sound identity and Stage 1 apex overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-apex-overhaul.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Harden music runtime and Apex collision helper
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/runtime-config.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('audio.playChannel=function playCosmicChannel(')
          end=s.index('\naudio.tone=function',start)
          safe="""audio.playChannel=function playCosmicChannel(channel,freq,duration=.06,type='sine',volume=.025,slide=0,pan=0,options={}){if(!this.allowed(channel))return;rawAudioInit();this.ensureOutput();const finite=(value,fallback)=>{const n=Number(value);return Number.isFinite(n)?n:fallback;},opts=options&&typeof options==='object'?options:{},baseFreq=Math.max(30,finite(freq,220)),safeDuration=Math.max(.01,finite(duration,.06)),safeVolume=Math.max(0,finite(volume,.025)),safeSlide=finite(slide,0),safePan=clamp(finite(pan,0),-1,1),t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain(),filter=this.ctx.createBiquadFilter(),panner=typeof this.ctx.createStereoPanner==='function'?this.ctx.createStereoPanner():null,musicBus=opts.bus==='music'&&this.ambientMaster,destination=musicBus?this.ambientMaster:this.outputNode,scaled=safeVolume*(musicBus?1:audioVolume(channel))*5.65;o.type=['sine','triangle','square','sawtooth'].includes(type)?type:'sine';o.detune.value=finite(opts.detune,rand(-5,5));o.frequency.setValueAtTime(baseFreq,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,baseFreq+safeSlide),t+safeDuration);filter.type=opts.filterType||(o.type==='square'||o.type==='sawtooth'?'lowpass':'bandpass');filter.frequency.value=clamp(finite(opts.filterHz,baseFreq*3.1),90,6800);filter.Q.value=finite(opts.q,o.type==='sine'?.75:.58);g.gain.setValueAtTime(Math.max(.0001,scaled),t);g.gain.exponentialRampToValueAtTime(.0001,t+safeDuration);if(panner){panner.pan.value=clamp(safePan+rand(-.10,.10),-1,1);o.connect(filter).connect(g).connect(panner);panner.connect(destination);if(!musicBus&&opts.echo!==false)panner.connect(this.echoInput);}else{o.connect(filter).connect(g);g.connect(destination);if(!musicBus&&opts.echo!==false)g.connect(this.echoInput);}o.start(t);o.stop(t+safeDuration+.03);};"""
          s=s[:start]+safe+s[end:]
          old="this.playChannel('ambient',profile.root*2*ratio(lead-12),stepMs/1000*(apex?.68:.88),profile.leadType||'triangle',(profile.leadGain||.008)*drive*(apex?1+.08*(intensity-1):1),lead%2?pan:-pan,{bus:'music',filterType:'lowpass',filterHz:profile.filter*1.35,echo:false})"
          new="this.playChannel('ambient',profile.root*2*ratio(lead-12),stepMs/1000*(apex?.68:.88),profile.leadType||'triangle',(profile.leadGain||.008)*drive*(apex?1+.08*(intensity-1):1),profile.root*.015,lead%2?pan:-pan,{bus:'music',filterType:'lowpass',filterHz:profile.filter*1.35,echo:false})"
          if old not in s: raise SystemExit('lead sequence call not found')
          s=s.replace(old,new,1)
          old="if(stageId&&(state.stageRun?.bossSpawned||state.stageRun?.bossIntroPending))return production?.music||'apex-warden';"
          new="if(stageId&&(state.stageRun?.bossSpawned||state.stageRun?.bossIntroPending)&&production?.music)return production.music;"
          if old not in s: raise SystemExit('stage music fallback not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('src/stage01-remodel.js')
          s=p.read_text(encoding='utf-8')
          marker="  function startOrbitDominion(enemy,phase){"
          helper="""  function pointSegmentDistance(px,py,x1,y1,x2,y2){const vx=x2-x1,vy=y2-y1,wx=px-x1,wy=py-y1,len2=vx*vx+vy*vy;if(len2<=1e-6)return Math.hypot(px-x1,py-y1);const t=clamp((wx*vx+wy*vy)/len2,0,1),cx=x1+vx*t,cy=y1+vy*t;return Math.hypot(px-cx,py-cy);}\n\n"""
          if marker not in s: raise SystemExit('Orbit Dominion helper insertion point missing')
          if 'function pointSegmentDistance(' not in s:s=s.replace(marker,helper+marker,1)
          s=s.replace('lineDistance(player.x,player.y,enemy.x,enemy.y,x2,y2)','pointSegmentDistance(player.x,player.y,enemy.x,enemy.y,x2,y2)')
          p.write_text(s,encoding='utf-8')
      - name: Validate and refresh fingerprint
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-fingerprint.mjs
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src -type f -name '*.js' -print0 | sort -z)
          node scripts/run-mode-contract.mjs
          node scripts/boss-identity-contract.mjs
          node scripts/stage-catalog-contract.mjs
          node scripts/stage-map-contract.mjs
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stackfall-audio-bot'
          git config user.email 'stackfall-audio-bot@users.noreply.github.com'
          git add src/runtime-config.js src/stage01-remodel.js src/build-info.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden authored music and Apex field runtime'
          git push origin HEAD:main
