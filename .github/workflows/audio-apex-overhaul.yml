name: Apply sound identity and Stage 1 apex overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-apex-overhaul.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover and run authored overhaul
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD~2:.github/workflows/audio-apex-overhaul.yml > /tmp/old-overhaul.yml
          sed -n "/python3 - <<'PY'/,/^          PY$/p" /tmp/old-overhaul.yml | tail -n +2 | head -n -1 | sed 's/^          //' > /tmp/apply-overhaul.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/apply-overhaul.py')
          s=p.read_text()
          s=s.replace("b=text.index('\\n              drawBody(enemy)',a)","b=text.index('\\n    drawBody(enemy)',a)")
          p.write_text(s)
          PY
          python3 -m py_compile /tmp/apply-overhaul.py
          python3 /tmp/apply-overhaul.py
          node scripts/build-fingerprint.mjs
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src -type f -name '*.js' -print0 | sort -z)
          node scripts/run-mode-contract.mjs
          node scripts/boss-identity-contract.mjs
          node scripts/stage-catalog-contract.mjs
          node scripts/stage-map-contract.mjs
      - name: Commit overhaul
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stackfall-audio-bot'
          git config user.email 'stackfall-audio-bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: establish Stackfall music identity and first Apex'
          git push origin HEAD:main
