name: Last Constellation combat audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-audit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/atropos-world-devourer-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Log Last Constellation routing diagnostics
        run: node scripts/last-constellation-routing-debug.mjs
      - name: Run Last Constellation live hit and P1 combat audit
        run: node scripts/last-constellation-combat-audit.mjs
