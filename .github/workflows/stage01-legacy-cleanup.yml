name: Stage legacy cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage01-legacy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove rejected stage design residue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, repl, label):
              out, n = re.subn(pattern, repl, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              return out

          # run-modes: delete the temporary compatibility shim that resurrected
          # rejected Stage 1 production-art globals.
          p = Path('src/run-modes.js')
          s = p.read_text(encoding='utf-8')
          s = sub_once(
              s,
              r"\n  // Stage 1's base realm renderer used to borrow sprites.*?\n  if\(typeof document!==",
              "\n  if(typeof document!==",
              'run-modes legacy shim',
          )
          p.write_text(s, encoding='utf-8')

          # Stage 1 reboot: remove render branches that only existed for the
          # discarded bulkhead/girder/salvage physical-object vocabulary.
          p = Path('src/stage01-visual-reboot.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  const basePhysicalObject=window.stackfallDrawStagePhysicalObject;\n  const basePhysicalWarnings=window.stackfallDrawStagePhysicalWarnings;\n", "")
          s = sub_once(
              s,
              r"\n  function drawStageOnePhysicalObject\(o\)\{.*?\n  function bossPose\(e\)\{",
              "\n  function bossPose(e){",
              'stage01 rejected physical renderers',
          )
          p.write_text(s, encoding='utf-8')

          # Runtime: keep generic stage lifecycle and the new Stage 1 module,
          # but remove the rejected Stage 1 production geometry/hazard and the
          # dormant Codex-authored S1-S18 apex technique library.
          p = Path('src/stage-runtime.js')
          s = p.read_text(encoding='utf-8')

          s = sub_once(
              s,
              r"  function updateStageOneFrontier\(run,dt\)\{.*?\n  \}\n  function updateStageTwoNebula",
              "  function updateStageOneRouteState(run){\n    const time=Math.max(0,state.time||0),route=run.routeState||(run.routeState={});\n    route.quiet=time>=280&&!run.bossSpawned;route.open=run.completed===true;\n  }\n  function updateStageTwoNebula",
              'stage01 frontier state',
          )

          s = sub_once(
              s,
              r"  function stageOneBodyShapes\(e\)\{.*?\n  function stageOneArena",
              "  window.stackfallStageBodyShapes=e=>stageDefinition(e?.eventKind)?.production?.shapes?.(e)||e?.stageBodyShapes||[];\n  function stageOneArena",
              'stage01 production body and collapse hazard',
          )

          # The old player clamp belonged to the loading-bay boss layout and is
          # no longer part of the new Closure encounter.
          s = sub_once(
              s,
              r"  function clampStageOnePlayer\(\)\{.*?\n  window\.stackfallClampStageBossToArena=function\(enemy\)\{.*?\n  \};\n  function spawnStageBoss",
              "  window.stackfallClampStageBossToArena=function(enemy){\n    const arena=state.stageBossArena;if(!enemy||enemy.eventKind!=='stage-01'||arena?.stageId!=='stage-01')return;\n    const pad=Math.max(64,(Number(enemy.visualR)||104)*.78);enemy.x=clamp(enemy.x,arena.x-arena.halfW+pad,arena.x+arena.halfW-pad);enemy.y=clamp(enemy.y,arena.y-arena.halfH+pad,arena.y+arena.halfH-pad);\n  };\n  function spawnStageBoss",
              'stage01 legacy arena clamp',
          )

          s = sub_once(
              s,
              r"    if\(stage\.id==='stage-01'\)\{.*?\}\n    if\(stage\.id==='stage-02'\)",
              "    if(stage.id==='stage-01'){e.contactSafeUntil=(state.time||0)+1.2;stabilizeRealmTheme?.('stage-01');}\n    if(stage.id==='stage-02')",
              'stage01 legacy spawn state',
          )

          s = s.replace("startRealmTransition('stage-01-warden'", "startRealmTransition('stage-01'")
          s = s.replace("localized(run.stage.boss?.name)||'Collapse Warden'", "localized(run.stage.boss?.name)||'Closure'")
          s = s.replace("GAME_SETTINGS.language==='ko'?'항로 봉쇄 프로토콜 가동':'ROUTE LOCKDOWN PROTOCOL'", "GAME_SETTINGS.language==='ko'?'폐쇄 신호 활성':'CLOSURE SIGNAL ACTIVE'")
          s = s.replace("stabilizeRealmTheme?.('stage-01-warden')", "stabilizeRealmTheme?.('stage-01')")
          s = s.replace("audio.stageAttack?.('stage-01','shutter-slam')", "audio.stageAttack?.('stage-01','closure-pulse')")
          s = s.replace('updateStageOneFrontier', 'updateStageOneRouteState')

          s = s.replace("body:{...enemy,stageBodyShapes:[],dead:false,hit:0}", "body:{...enemy,stage01RebootShapes:[],dead:false,hit:0}")
          s = sub_once(
              s,
              r"  function drawStageOneVictory\(v\)\{.*?\n  \}\n  function beginStageTwoVictory",
              "  function drawStageOneVictory(v){\n    const age=v.elapsed,p=worldToScreen(v.x,v.y),body=v.body;ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=1-clamp((age-2.35)/.9,0,1);body.stage01Ram={mode:'recover',progress:clamp(age/1.55,0,1)};drawEliteShape(body);ctx.restore();\n    if(age>.7){ctx.save();ctx.globalAlpha=clamp((age-.7)/.8,0,1);ctx.textAlign='center';ctx.fillStyle='#dbe9ea';ctx.font='800 24px \\\"IBM Plex Sans KR\\\",sans-serif';ctx.fillText(age<1.8?tr('stageClear.targetDown'):tr('stageClear.operationComplete'),vw*.5,vh*.22);ctx.restore();}\n  }\n  function beginStageTwoVictory",
              'stage01 legacy victory renderer',
          )

          # Delete the dormant S1-S18 apex attack/motion library. Active stage
          # modules now own stage-boss combat; planned stages must not silently
          # retain the discarded designs.
          s = sub_once(
              s,
              r"  function stageBossSignatureAlive\(e,api\)\{.*?\n  const ENDLESS_FAMILY_CACHE",
              "  window.updateStageBossSkill=function(enemy,dt){\n    const def=stageDefinition(enemy?.eventKind);if(def?.production?.combat)def.production.combat(enemy,dt,apiFor(stageRuntime()));\n  };\n  const ENDLESS_FAMILY_CACHE",
              'legacy S1-S18 apex library',
          )

          s = s.replace("    onStart(api){clearStagePhysicalObjects();updateStageOneRouteState(api.run,0);},\n    hazard(event,api){if(event.variant==='collapse-pulse')stageOneDeckCollapse(event,api);},\n", "    onStart(api){clearStagePhysicalObjects();updateStageOneRouteState(api.run);},\n")
          s = s.replace("form:'collapse-warden',eventVariant:'stage01-warden'", "form:'closure',eventVariant:'stage01-closure'")
          s = s.replace("updateStageOneRouteState(run,0)", "updateStageOneRouteState(run)")
          s = s.replace("updateStageOneRouteState(api.run,0)", "updateStageOneRouteState(api.run)")
          s = s.replace("updateStageOneRouteState(run,dt)", "updateStageOneRouteState(run)")

          for token in ('stageOneArtPose','FRONTIER_ART','frontierSprite','collapse-warden','stage01-warden','stageOneDeckCollapse','stageOneDebrisSalvo','stageOneShutterClamp','stageOneGirderSweep','stageOneBreachRam'):
              if token in s:
                  raise SystemExit(f'stage-runtime cleanup incomplete: {token}')
          p.write_text(s, encoding='utf-8')

          # Runtime-facing catalog: remove the discarded collapse-pulse and old
          # boss compatibility id from Stage 1. Planned S2-S18 remain gated.
          p = Path('src/stage-world-reboot-metadata.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("// Boss ids remain compatibility ids until each stage receives its production rebuild.\n", "")
          old = "        patch.description=Object.freeze(stageOneDescription);\n        patch.boss=Object.freeze({...row.boss,name:Object.freeze({ko:'폐쇄체',en:'Closure'} )});"
          new = "        patch.description=Object.freeze(stageOneDescription);\n        patch.gimmick=null;\n        patch.discoveries=Object.freeze({...row.discoveries,gimmicks:Object.freeze([])});\n        patch.fixedEvents=Object.freeze(row.fixedEvents.filter(event=>event.kind!=='hazard').map(event=>Object.freeze(event.kind==='boss'?{...event,variant:'closure'}:{...event})));\n        patch.boss=Object.freeze({...row.boss,id:'closure',name:Object.freeze({ko:'폐쇄체',en:'Closure'})});"
          if old not in s:
              raise SystemExit('metadata stage1 patch anchor missing')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

          node --check src/run-modes.js
          node --check src/stage-runtime.js
          node --check src/stage01-visual-reboot.js
          node --check src/stage-world-reboot-metadata.js
          node scripts/stage-catalog-contract.mjs
          node scripts/run-mode-contract.mjs
          node scripts/dev-tools-contract.mjs

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No cleanup changes produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/run-modes.js src/stage-runtime.js src/stage01-visual-reboot.js src/stage-world-reboot-metadata.js
          git commit -m 'refactor(stage): purge rejected stage design residue'
          git push origin HEAD:main
