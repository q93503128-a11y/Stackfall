name: Temporary Last Constellation Defeat QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apex-last-defeat-qa-temp.mjs'
      - '.github/workflows/apex-last-defeat-qa-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  last-defeat-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check harness syntax
        run: node --check scripts/apex-last-defeat-qa-temp.mjs
      - name: Wait for deployed current gameplay fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node --input-type=module -e "import {computeBuildFingerprint} from './scripts/build-fingerprint.mjs'; console.log(computeBuildFingerprint(process.cwd()).sha)")"
          for attempt in $(seq 1 36); do
            body="$(curl -fsSL "https://stackfall.pages.dev/src/build-info.js?last-defeat=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "$body" | grep -Fq "$expected"; then exit 0; fi
            sleep 5
          done
          echo "live fingerprint did not match $expected" >&2
          exit 1
      - name: Capture Last Constellation intro and defeat
        run: node scripts/apex-last-defeat-qa-temp.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-constellation-defeat-qa
          path: test-results/apex-last-defeat
          if-no-files-found: error
          retention-days: 5
      - name: Remove one-shot QA tooling
        if: success()
        shell: bash
        run: |
          rm scripts/apex-last-defeat-qa-temp.mjs .github/workflows/apex-last-defeat-qa-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove one-shot last constellation QA"
          git push origin HEAD:main
