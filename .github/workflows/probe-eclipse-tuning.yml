name: Probe eclipse tuning push

on:
  push:
    branches: [agent/eclipse-health-performance-tuning]

permissions:
  statuses: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'success',context:'stackfall/eclipse-tuning-probe',description:'branch push workflow executed',target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
