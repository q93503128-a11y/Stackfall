name: Atropos end caps v10

on:
  push:
    branches: [feature/atropos-world-devourer-prototype]
    paths: [scripts/atropos-endcaps-v10-trigger.txt]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Apply end-cap v10
        run: |
          python scripts/atropos-endcaps-v10.py
          node --check src/atropos-world-devourer-prototype.js
          node scripts/atropos-code-audit.mjs
      - name: Commit end-cap v10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-prototype.js
          git commit -m "Polish Atropos head overlap and tail point"
          git push origin HEAD:feature/atropos-world-devourer-prototype
