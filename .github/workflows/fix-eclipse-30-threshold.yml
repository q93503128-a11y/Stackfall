name: Fix Eclipse Reactor 30 percent threshold

on:
  push:
    branches: [agent/eclipse-health-performance-tuning]

permissions:
  contents: write
  statuses: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eclipse-health-performance-tuning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix threshold semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def ensure(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old,new),encoding='utf-8')
              elif new not in text:
                  raise SystemExit(f'{path}: expected text not found')

          ensure('src/reward-refinement.js',
            "상시 피해 +20%. 체력 30% 이하에서 최대 +30% 추가 증가(총 최대 +50%).",
            "상시 피해 +20%. 체력 50% 미만부터 추가 피해가 증가해 체력 30% 이하에서 총 최대 +50%.")
          ensure('src/reward-refinement.js',
            "Permanent damage +20%. At or below 30% health, gains up to +30% more (maximum total +50%).",
            "Permanent damage +20%. Bonus damage rises below 50% health and reaches a maximum total of +50% at or below 30% health.")
          ensure('src/ability-ledger-audit.js',
            "상시 피해 +20%. 체력 30% 이하에서 최대 +30% 추가 증가(총 최대 +50%).",
            "상시 피해 +20%. 체력 50% 미만부터 증가해 30% 이하에서 총 최대 +50%.")
          ensure('src/reward-refinement.js',
            "const ECLIPSE_BASE_DAMAGE=.20,ECLIPSE_LOW_HEALTH_DAMAGE=.30,ECLIPSE_THRESHOLD=.30;",
            "const ECLIPSE_BASE_DAMAGE=.20,ECLIPSE_LOW_HEALTH_DAMAGE=.30,ECLIPSE_SURGE_START=.50,ECLIPSE_THRESHOLD=.30;")
          ensure('src/reward-refinement.js',
            "function eclipseDamageBonus(){if(!state.bossTraits?.eclipse)return 0;const ratio=clamp(player.hp/Math.max(1,player.maxHp),0,1),surge=ratio<ECLIPSE_THRESHOLD?(ECLIPSE_THRESHOLD-ratio)/ECLIPSE_THRESHOLD:0;return ECLIPSE_BASE_DAMAGE+ECLIPSE_LOW_HEALTH_DAMAGE*clamp(surge,0,1);}",
            "function eclipseDamageBonus(){if(!state.bossTraits?.eclipse)return 0;const ratio=clamp(player.hp/Math.max(1,player.maxHp),0,1),surge=clamp((ECLIPSE_SURGE_START-ratio)/(ECLIPSE_SURGE_START-ECLIPSE_THRESHOLD),0,1);return ECLIPSE_BASE_DAMAGE+ECLIPSE_LOW_HEALTH_DAMAGE*surge;}")

          ensure('README.md',
            "상시 피해 +20%이며, 체력 30% 이하에서 최대 +30%가 추가되어 총 최대 +50%까지 증가한다.",
            "상시 피해 +20%이며, 체력 50% 미만부터 추가 피해가 증가해 체력 30% 이하에서 총 최대 +50%가 된다.")
          ensure('docs/WIKI.md',
            "상시 피해 +20%를 제공하며 체력이 30% 이하로 내려가면 추가 피해가 점차 증가해 총 최대 +50%가 됩니다.",
            "상시 피해 +20%를 제공하며 체력 50% 미만부터 추가 피해가 증가해 체력 30% 이하에서 총 최대 +50%가 됩니다.")

          p=Path('scripts/realm-specials-contract.mjs'); text=p.read_text(encoding='utf-8')
          old="expect('eclipse exact description',reward.includes('상시 피해 +20%. 체력 30% 이하에서 최대 +30% 추가 증가(총 최대 +50%).')&&ledger.includes('총 최대 +50%'));"
          new="expect('eclipse exact description',reward.includes('체력 50% 미만부터 추가 피해가 증가해 체력 30% 이하에서 총 최대 +50%')&&ledger.includes('30% 이하에서 총 최대 +50%'));"
          if old in text:text=text.replace(old,new)
          elif new not in text:raise SystemExit('eclipse description contract missing')
          old="expect('eclipse real damage function',reward.includes('ECLIPSE_BASE_DAMAGE=.20')&&reward.includes('ECLIPSE_LOW_HEALTH_DAMAGE=.30')&&reward.includes('ECLIPSE_THRESHOLD=.30')&&reward.includes('amount*=1+eclipseDamageBonus()'));"
          new="expect('eclipse real damage function',reward.includes('ECLIPSE_BASE_DAMAGE=.20')&&reward.includes('ECLIPSE_LOW_HEALTH_DAMAGE=.30')&&reward.includes('ECLIPSE_SURGE_START=.50')&&reward.includes('ECLIPSE_THRESHOLD=.30')&&reward.includes('(ECLIPSE_SURGE_START-ratio)/(ECLIPSE_SURGE_START-ECLIPSE_THRESHOLD)')&&reward.includes('amount*=1+eclipseDamageBonus()'));"
          if old in text:text=text.replace(old,new)
          elif new not in text:raise SystemExit('eclipse damage contract missing')
          if "const core=read('src/core.js');" not in text:
              text=text.replace("const ledger=read('src/ability-ledger-audit.js');", "const ledger=read('src/ability-ledger-audit.js');\nconst core=read('src/core.js');\nconst progression=read('src/progression-expansion.js');")
          health_contract="expect('max health passive buffs',core.includes('최대 체력 +24, 즉시 체력 36 회복')&&progression.includes('player.maxHp+=24')&&progression.includes('player.maxHp*1.10')&&reward.includes('player.maxHp+=24')&&reward.includes('player.maxHp*1.10'));"
          anchor="expect('five real weapon special branches'"
          if health_contract not in text:
              index=text.index(anchor)
              text=text[:index]+health_contract+'\n'+text[index:]
          p.write_text(text,encoding='utf-8')

          reward=Path('src/reward-refinement.js').read_text(encoding='utf-8')
          assert 'ECLIPSE_SURGE_START=.50' in reward
          assert '(ECLIPSE_SURGE_START-ratio)/(ECLIPSE_SURGE_START-ECLIPSE_THRESHOLD)' in reward
          PY
          node scripts/build-fingerprint.mjs
      - name: Syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src scripts functions -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
          node scripts/polish-contract-check.mjs
          node scripts/endgame-balance-contract.mjs
          node scripts/realm-specials-contract.mjs
          node scripts/build-fingerprint.mjs --check
          git diff --check
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node scripts/run-live-smoke.mjs --url=http://127.0.0.1:8000/ --result=test-results/eclipse-threshold-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-threshold-verification
          path: test-results
          if-no-files-found: warn
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stackfall-tuning-bot'
          git config user.email 'stackfall-tuning-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make Eclipse Reactor peak at thirty percent health'
          git push origin HEAD:agent/eclipse-health-performance-tuning
      - name: Publish success
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'success',context:'stackfall/eclipse-threshold',description:'30 percent threshold verified',target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
