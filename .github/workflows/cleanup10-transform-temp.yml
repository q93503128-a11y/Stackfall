name: Cleanup 10 dead-event cleanup temp

on:
  push:
    branches:
      - cleanup10-dead-event-validation

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup10-dead-event-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove retired Endless event presentation residue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('src/map-event-expansion.js')
          text=path.read_text(encoding='utf-8')

          retired_locale=re.compile(r",distressName:'[^']*',distressDesc:'[^']*',meteorName:'[^']*',meteorDesc:'[^']*',predatorName:'[^']*',predatorDesc:'[^']*',relayName:'[^']*',relayDesc:'[^']*',stormName:'[^']*',stormDesc:'[^']*',fieldComplete:'[^']*',fieldFailed:'[^']*'")
          text,count=retired_locale.subn('',text)
          if count!=2:
              raise SystemExit(f'expected 2 retired localization tails, found {count}')

          lines=text.splitlines()
          meta_replaced=marker_replaced=0
          for i,line in enumerate(lines):
              if line.strip().startswith('function meta(type){'):
                  lines[i]="  function meta(type){if(type==='void')return{name:tx('voidName'),desc:tx('voidDesc'),color:'#b36bff',icon:'◉',short:lang()==='ko'?'공허':'VOID'};if(type==='crash')return{name:tx('crashName'),desc:tx('crashDesc'),color:'#ff9a62',icon:'⌁',short:lang()==='ko'?'우주선':'SHIP'};return{name:tx('vaultName'),desc:tx('vaultDesc'),color:'#75eaff',icon:'◇',short:lang()==='ko'?'보관소':'VAULT'};}"
                  meta_replaced+=1
              elif line.strip().startswith('function drawMarker(marker,p,t){'):
                  lines[i]="  function drawMarker(marker,p,t){const m=meta(marker.type),fade=clamp((marker.life||LIMITS.marker)/6,0,1);ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=fade;ctx.shadowBlur=26;ctx.shadowColor=m.color;ctx.strokeStyle=m.color;ctx.fillStyle=m.color;ctx.lineWidth=2;if(marker.type==='void'){ctx.scale(1.3,.72);for(let ring=0;ring<3;ring++){ctx.rotate((ring%2?1:-1)*t*.03);ctx.beginPath();ctx.ellipse(0,0,25+ring*10,25+ring*10,0,0,TAU);ctx.stroke();}ctx.fillStyle='#05000b';ctx.beginPath();ctx.arc(0,0,20,0,TAU);ctx.fill();}else if(marker.type==='crash'){ctx.rotate(-.12);ctx.beginPath();ctx.moveTo(-42,8);ctx.lineTo(-18,-12);ctx.lineTo(15,-15);ctx.lineTo(43,-2);ctx.lineTo(18,9);ctx.lineTo(0,24);ctx.lineTo(-22,18);ctx.closePath();ctx.fill();}else{ctx.rotate(t*.3);for(let i=0;i<2;i++){ctx.beginPath();for(let j=0;j<6;j++){const a=j/6*TAU,r=42-i*12,x=Math.cos(a)*r,y=Math.sin(a)*r;j?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.stroke();}}ctx.restore();}"
                  marker_replaced+=1
          if meta_replaced!=1 or marker_replaced!=1:
              raise SystemExit(f'meta={meta_replaced}, drawMarker={marker_replaced}')
          text='\n'.join(lines)+'\n'

          start=text.find('  function drawActiveFieldEvent(){')
          end=text.find('  function drawMapEvents(){',start)
          if start<0 or end<0:
              raise SystemExit('drawActiveFieldEvent block not found')
          text=text[:start]+text[end:]
          old='function drawMapEvents(){if(state.mapEventActive){drawActiveFieldEvent();return;}'
          new='function drawMapEvents(){if(state.mapEventActive)return;'
          if text.count(old)!=1:
              raise SystemExit(f'drawMapEvents active-field hook count={text.count(old)}')
          text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')

          contract=Path('scripts/legacy-chat-requirements-contract.mjs')
          source=contract.read_text(encoding='utf-8')
          anchor="expect('discarded Endless event mechanics stay out of the active runtime',!['startDistress','updateMeteor','startPredator','updateRelay','startStorm'].some(name=>mapEvents.includes('function '+name))&&mapEvents.includes(\"EVENT_CLOCK_KEYS=Object.freeze(['vault','crash','void'])\"));"
          addition=anchor+"\nexpect('retired Endless event presentation residue stays removed',!['distressName','meteorName','predatorName','relayName','stormName','fieldComplete','fieldFailed','drawActiveFieldEvent',\"type==='distress'\",\"type==='meteor'\",\"type==='predator'\",\"type==='relay'\",\"type==='storm'\"].some(token=>mapEvents.includes(token)));"
          if source.count(anchor)!=1:
              raise SystemExit(f'legacy contract anchor count={source.count(anchor)}')
          contract.write_text(source.replace(anchor,addition,1),encoding='utf-8')
          PY
      - name: Validate cleanup tree
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src -type f -name '*.js' -print0 | sort -z)
          node scripts/legacy-chat-requirements-contract.mjs
          node scripts/runtime-ownership-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
          ! grep -Eq "distressName|meteorName|predatorName|relayName|stormName|fieldComplete|fieldFailed|drawActiveFieldEvent|type==='(distress|meteor|predator|relay|storm)'" src/map-event-expansion.js
          grep -Fq "retiredWorldEvents=Object.freeze(['distress','meteor','predator','relay','storm'])" src/runtime-controls.js
          grep -Fq "6:Object.freeze([{at:.14,type:'meteor'}" src/stage-runtime.js
          grep -Fq "14:Object.freeze([{at:.10,type:'storm'}" src/stage-runtime.js
      - name: Commit validated cleanup tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cleanup10-audit-temp.yml .github/workflows/cleanup10-transform-temp.yml
          git add src scripts
          git diff --cached --check
          git config user.name coworkaccount
          git config user.email cyp1jhh2@gmail.com
          git commit -m 'Validate Cleanup 10 retired event residue removal'
          git push origin HEAD:cleanup10-dead-event-validation
