name: Temporary achievement lock fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-achievement-lock.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix upright achievement status icon and stale endless lock copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('feature-pack.css')
          text=css.read_text()
          old='''body #achievementScreen .achievement-reward-icon{\n  width:32px !important;\n  height:32px !important;\n  border:1px solid rgba(165,183,230,.18) !important;\n  border-radius:7px !important;\n  transform:rotate(45deg);\n  background:rgba(255,255,255,.028) !important;\n  color:#7987a6;\n  font-size:12px !important;\n}\nbody #achievementScreen .achievement-reward-icon::first-letter{transform:rotate(-45deg)}'''
          new='''body #achievementScreen .achievement-reward-icon{\n  width:32px !important;\n  height:32px !important;\n  border:1px solid rgba(165,183,230,.18) !important;\n  border-radius:9px !important;\n  transform:none;\n  background:rgba(255,255,255,.028) !important;\n  color:#7987a6;\n  font-size:12px !important;\n}'''
          if old not in text:
              raise SystemExit('achievement icon block not found')
          css.write_text(text.replace(old,new))

          meta=Path('src/meta-progression.js')
          text=meta.read_text()
          old="endless.title=unlocked?'':'Stage 6 클리어 후 엔드리스 해금';"
          new="endless.title='';"
          if old not in text:
              raise SystemExit('stale endless title not found')
          meta.write_text(text.replace(old,new))
          PY
          git config user.name "stackfall-ci"
          git config user.email "stackfall-ci@users.noreply.github.com"
          git add feature-pack.css src/meta-progression.js
          git commit -m "fix: keep achievement locks upright and remove stale stage gate copy"
          git push origin HEAD:main
