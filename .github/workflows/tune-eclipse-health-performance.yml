name: Tune eclipse health and lag guard

on:
  push:
    branches: [agent/eclipse-health-performance-tuning]

permissions:
  contents: write

jobs:
  tune-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eclipse-health-performance-tuning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply balance and performance tuning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, minimum=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} occurrences of {old!r}, found {count}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          replace('src/reward-refinement.js',
              "상시 피해 +12%. 체력 50% 미만에서 최대 +28% 추가 증가(총 최대 +40%).",
              "상시 피해 +20%. 체력 30% 이하에서 최대 +30% 추가 증가(총 최대 +50%).")
          replace('src/reward-refinement.js',
              "Permanent damage +12%. Below 50% health, gains up to +28% more (maximum total +40%).",
              "Permanent damage +20%. At or below 30% health, gains up to +30% more (maximum total +50%).")
          replace('src/reward-refinement.js',
              "const ECLIPSE_BASE_DAMAGE=.12,ECLIPSE_LOW_HEALTH_DAMAGE=.28,ECLIPSE_THRESHOLD=.50;",
              "const ECLIPSE_BASE_DAMAGE=.20,ECLIPSE_LOW_HEALTH_DAMAGE=.30,ECLIPSE_THRESHOLD=.30;")
          replace('src/ability-ledger-audit.js',
              "상시 피해 +12%. 체력 50% 미만에서 최대 +28% 추가 증가(총 최대 +40%).",
              "상시 피해 +20%. 체력 30% 이하에서 최대 +30% 추가 증가(총 최대 +50%).")

          replace('src/core.js',
              "vitality:{name:'재생 장갑',icon:'+',color:'#74f2a7',desc:'최대 체력 +20, 즉시 체력 30 회복',max:10}",
              "vitality:{name:'재생 장갑',icon:'+',color:'#74f2a7',desc:'최대 체력 +24, 즉시 체력 36 회복',max:10}")
          replace('src/progression-expansion.js',
              "if(c.key==='vitality'){player.maxHp+=20;player.hp=Math.min(player.maxHp,player.hp+30);}",
              "if(c.key==='vitality'){player.maxHp+=24;player.hp=Math.min(player.maxHp,player.hp+36);}")
          replace('src/reward-refinement.js',
              "if(key==='vitality'){player.maxHp+=20;player.hp=Math.min(player.maxHp,player.hp+30);}",
              "if(key==='vitality'){player.maxHp+=24;player.hp=Math.min(player.maxHp,player.hp+36);}")
          replace('src/progression-expansion.js',
              "if(c.key==='stellarLife'){const ratio=player.hp/Math.max(1,player.maxHp);player.maxHp=Math.max(player.maxHp+1,Math.round(player.maxHp*1.08));player.hp=Math.max(1,Math.min(player.maxHp,Math.round(player.maxHp*ratio)));}",
              "if(c.key==='stellarLife'){const ratio=player.hp/Math.max(1,player.maxHp);player.maxHp=Math.max(player.maxHp+1,Math.round(player.maxHp*1.10));player.hp=Math.max(1,Math.min(player.maxHp,Math.round(player.maxHp*ratio)));}")
          replace('src/reward-refinement.js',
              "if(key==='stellarLife'){const ratio=player.hp/Math.max(1,player.maxHp);player.maxHp=Math.max(player.maxHp+1,Math.round(player.maxHp*1.08));player.hp=Math.max(1,Math.round(player.maxHp*ratio));}",
              "if(key==='stellarLife'){const ratio=player.hp/Math.max(1,player.maxHp);player.maxHp=Math.max(player.maxHp+1,Math.round(player.maxHp*1.10));player.hp=Math.max(1,Math.round(player.maxHp*ratio));}")

          for p in Path('src').glob('*.js'):
              text=p.read_text(encoding='utf-8')
              if 'stellarLife' not in text:
                  continue
              changed=re.sub(r"(stellarLife\s*:\s*\{.{0,900}?)(최대 체력 \+)8%",r"\g<1>\g<2>10%",text,count=1,flags=re.S)
              changed=re.sub(r"(stellarLife\s*:\s*\{.{0,1200}?)(Maximum health \+)8%",r"\g<1>\g<2>10%",changed,count=1,flags=re.S|re.I)
              if changed!=text:p.write_text(changed,encoding='utf-8')

          perf=Path('src/performance-guard.js')
          text=perf.read_text(encoding='utf-8')
          old="""  function pressureTier(){
    const value=pressureScore(),compact=compactDevice();
    return value>(compact?190:285)?2:value>(compact?135:210)?1:0;
  }
  function tier(){return Math.max(performanceTier,pressureTier());}
"""
          new="""  function pressureTier(){
    const value=pressureScore(),compact=compactDevice();
    return value>(compact?190:285)?2:value>(compact?135:210)?1:0;
  }
  function tier(){return performanceTier;}
"""
          if old not in text:raise SystemExit('performance tier ownership block not found')
          text=text.replace(old,new)
          old="""  function syncResolution(dt){
    const shouldDrop=performanceTier===2&&frameMs>29;
    if(shouldDrop){
      resolutionDropTime+=dt;resolutionRecoverTime=0;
      if(resolutionDropTime>1.8)applyEmergencyResolution(true);
    }else if(emergencyResolution){
      resolutionDropTime=0;
      if(frameMs<18&&slowDebt<4)resolutionRecoverTime+=dt;else resolutionRecoverTime=0;
      if(resolutionRecoverTime>7){applyEmergencyResolution(false);resolutionRecoverTime=0;}
    }else{
      resolutionDropTime=0;resolutionRecoverTime=0;
    }
  }
  function observeFrame(dt){
    const ms=clamp((Number(dt)||.0167)*1000,4,50);
    frameMs=frameMs*.92+ms*.08;
    if(frameMs>27)slowDebt=Math.min(140,slowDebt+2.2);
    else if(frameMs>21)slowDebt=Math.min(140,slowDebt+.65);
    else slowDebt=Math.max(0,slowDebt-1.4);
    performanceTier=frameMs>33||slowDebt>82?2:frameMs>23.5||slowDebt>28?1:0;
    syncResolution(dt);
  }
"""
          new="""  function syncResolution(dt){
    const shouldDrop=performanceTier===2&&frameMs>38&&slowDebt>=5.5;
    if(shouldDrop){
      resolutionDropTime+=dt;resolutionRecoverTime=0;
      if(resolutionDropTime>2.5)applyEmergencyResolution(true);
    }else if(emergencyResolution){
      resolutionDropTime=0;
      if(frameMs<23&&slowDebt<.7)resolutionRecoverTime+=dt;else resolutionRecoverTime=0;
      if(resolutionRecoverTime>5){applyEmergencyResolution(false);resolutionRecoverTime=0;}
    }else{
      resolutionDropTime=0;resolutionRecoverTime=0;
    }
  }
  function observeFrame(dt){
    const seconds=clamp(Number(dt)||.0167,.004,.25),ms=seconds*1000;
    frameMs=frameMs*.94+ms*.06;
    if(frameMs>42)slowDebt=Math.min(12,slowDebt+seconds*2.4);
    else if(frameMs>31)slowDebt=Math.min(12,slowDebt+seconds);
    else if(frameMs<24)slowDebt=Math.max(0,slowDebt-seconds*1.8);
    else slowDebt=Math.max(0,slowDebt-seconds*.45);
    performanceTier=slowDebt>=5.5?2:slowDebt>=2?1:0;
    syncResolution(seconds);
  }
"""
          if old not in text:raise SystemExit('performance observation block not found')
          text=text.replace(old,new)
          text=text.replace("window.stackfallPerformanceTier=()=>tier();","window.stackfallPerformanceTier=()=>tier();\n  window.stackfallPerformanceDiagnostics=()=>({tier:tier(),measuredTier:performanceTier,pressureTier:pressureTier(),frameMs,slowDebt,emergencyResolution});")
          perf.write_text(text,encoding='utf-8')

          contract=Path('scripts/realm-specials-contract.mjs')
          text=contract.read_text(encoding='utf-8')
          text=text.replace("expect('eclipse exact description',reward.includes('상시 피해 +12%. 체력 50% 미만에서 최대 +28% 추가 증가(총 최대 +40%).')&&ledger.includes('총 최대 +40%'));","expect('eclipse exact description',reward.includes('상시 피해 +20%. 체력 30% 이하에서 최대 +30% 추가 증가(총 최대 +50%).')&&ledger.includes('총 최대 +50%'));")
          text=text.replace("expect('eclipse real damage function',reward.includes('ECLIPSE_BASE_DAMAGE=.12')&&reward.includes('ECLIPSE_LOW_HEALTH_DAMAGE=.28')&&reward.includes('amount*=1+eclipseDamageBonus()'));","expect('eclipse real damage function',reward.includes('ECLIPSE_BASE_DAMAGE=.20')&&reward.includes('ECLIPSE_LOW_HEALTH_DAMAGE=.30')&&reward.includes('ECLIPSE_THRESHOLD=.30')&&reward.includes('amount*=1+eclipseDamageBonus()'));")
          anchor="expect('canonical background only',!perf.includes('drawBackground=function optimizedBackground')&&!perf.includes('function themeVisual(theme)'));"
          extra=anchor+"\nexpect('quality reduction requires measured lag',perf.includes('function tier(){return performanceTier;}')&&perf.includes('slowDebt>=5.5?2:slowDebt>=2?1:0')&&perf.includes('frameMs>38&&slowDebt>=5.5'));"
          if anchor not in text:raise SystemExit('contract anchor not found')
          text=text.replace(anchor,extra)
          contract.write_text(text,encoding='utf-8')

          replacements={
            'README.md':[
              ('상시 피해 +12%이며, 체력 50% 미만에서 최대 +28%가 추가되어 총 최대 +40%까지 증가한다.','상시 피해 +20%이며, 체력 30% 이하에서 최대 +30%가 추가되어 총 최대 +50%까지 증가한다.'),
            ],
            'docs/WIKI.md':[
              ('상시 피해 +12%를 제공하며 체력이 50% 아래로 내려가면 추가 피해가 점차 증가해 총 최대 +40%가 됩니다.','상시 피해 +20%를 제공하며 체력이 30% 이하로 내려가면 추가 피해가 점차 증가해 총 최대 +50%가 됩니다.'),
            ],
            'docs/GAME_DESIGN.md':[]
          }
          for path,pairs in replacements.items():
              p=Path(path);text=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  if old not in text:raise SystemExit(f'{path}: documentation text not found')
                  text=text.replace(old,new)
              note='\n- 재생 장갑은 중첩당 최대 체력 +24와 즉시 회복 36, 비율형 최대 체력 패시브는 중첩당 +10%로 상향한다.\n- 성능 보호 단계는 개체 수만으로 화질을 낮추지 않는다. 측정 프레임 지연이 누적된 경우에만 효과 밀도·개체 상한을 줄이며, 해상도 축소는 심각한 지연이 추가로 2.5초 이상 지속될 때만 허용한다.\n'
              marker='성능 보호 단계는 개체 수만으로 화질을 낮추지 않는다.'
              if marker not in text:text=text.rstrip()+note
              p.write_text(text,encoding='utf-8')
          PY
          node scripts/build-fingerprint.mjs
      - name: Syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src scripts functions -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
          node scripts/polish-contract-check.mjs
          node scripts/endgame-balance-contract.mjs
          node scripts/realm-specials-contract.mjs
          node scripts/build-fingerprint.mjs --check
          git diff --check
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node scripts/run-live-smoke.mjs --url=http://127.0.0.1:8000/ --result=test-results/eclipse-health-performance-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-health-performance-verification
          path: test-results
          if-no-files-found: warn
      - name: Commit verified tuning
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stackfall-tuning-bot'
          git config user.email 'stackfall-tuning-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Tune Eclipse Reactor health passives and lag guard'
          git push origin HEAD:agent/eclipse-health-performance-tuning
