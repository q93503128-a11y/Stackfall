name: tmp-passive-source-audit
on:
  push:
    branches: [feature/void-apex-answer-v1]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
      - name: Locate multi projection core paths
        shell: bash
        run: |
          set -euo pipefail
          echo '=== multiplicity protocol ==='
          grep -RIn --exclude-dir=.git -E 'multiplicity-protocol|다중 투영 프로토콜|일반 레벨업 풀|ordinary level-up pool|normal-pool' src scripts docs README.md || true
          echo '=== eventOnly admission ==='
          grep -RIn --exclude-dir=.git -E 'eventOnly.*multiplicity|multiplicity.*eventOnly|!p.eventOnly|PASSIVES\[choice.key\].*eventOnly' src scripts || true
