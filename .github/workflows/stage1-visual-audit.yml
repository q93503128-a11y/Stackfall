name: Stage 1 visual audit

# Screenshot-driven Stage 1 vertical-slice validation.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/stage01-production-art.js'
      - 'src/stage01-rework-v2.js'
      - 'src/stage01-rework-v3.js'
      - 'src/stage01-rework-v4.js'
      - 'src/stage01-rework-v5.js'
      - 'src/realm-backgrounds.js'
      - 'src/elite-renderers.js'
      - 'src/stage-runtime.js'
      - 'src/stage-catalog.js'
      - 'src/run-modes.js'
      - 'scripts/stage1-v2-browser.mjs'
      - 'scripts/stage1-v3-browser.mjs'
      - 'scripts/stage1-motion-v5-contract.mjs'
      - 'scripts/build-fingerprint.mjs'
      - '.github/workflows/stage1-visual-audit.yml'

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Stackfall server
        run: |
          python3 -m http.server 8000 > /tmp/stackfall-http.log 2>&1 &
          echo $! > /tmp/stackfall-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/stackfall-http.log
          exit 1

      - name: Capture Stage 1 visual suite
        env:
          STACKFALL_PLAYWRIGHT: playwright
        run: |
          mkdir -p test-results/stage1-v3
          export STACKFALL_CHROME="$(node -e "const {chromium}=require('playwright');process.stdout.write(chromium.executablePath())")"
          set -o pipefail
          node scripts/stage1-v3-browser.mjs 2>&1 | tee test-results/stage1-v3/runner.log

      - name: Record expected public build fingerprint
        if: always()
        run: |
          mkdir -p test-results/stage1-v3
          node --input-type=module -e "import {writeFileSync} from 'node:fs';import {computeBuildFingerprint} from './scripts/build-fingerprint.mjs';writeFileSync('test-results/stage1-v3/expected-build.json',JSON.stringify(computeBuildFingerprint(process.cwd()),null,2));"

      - name: Upload Stage 1 captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-visual-audit
          path: |
            test-results/stage1-v3/**
            /tmp/stackfall-http.log
          if-no-files-found: warn
          retention-days: 7
