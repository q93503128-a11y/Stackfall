name: Temporary Dreadnought three-column validation
on:
  push:
    branches: [fix-dreadnought-three-columns]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact three-column patch
        run: python3 scripts/temp-fix-dreadnought-three-columns.py
      - name: Validate
        run: |
          node --check src/map-event-expansion.js
          node scripts/combat-integrity-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
          grep -F '.world-event-cards.collect-all{grid-template-columns:repeat(3,minmax(0,1fr))}' src/map-event-expansion.js
          grep -F "root.classList.toggle('collect-all',preview)" src/map-event-expansion.js
          grep -F '.world-event-cards,.world-event-cards.collect-all{grid-template-columns:1fr;' src/map-event-expansion.js
      - name: Commit validated source state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/map-event-expansion.js src/build-info.js
          git commit -m 'Use three-column Dreadnought salvage layout'
          git push origin HEAD:fix-dreadnought-three-columns
