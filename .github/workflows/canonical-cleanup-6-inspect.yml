name: Canonical cleanup 6 inspect
on:
  push:
    branches:
      - validation/canonical-cleanup-6
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect remaining global wrappers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== dealDamage assignments ==='
          grep -REn --include='*.js' '\bdealDamage\s*=\s*function\b' src || true
          echo '=== updateEnemies assignments ==='
          grep -REn --include='*.js' '\bupdateEnemies\s*=\s*function\b' src || true
          echo '=== canonical definitions ==='
          grep -REn --include='*.js' '^function dealDamage\b|^function updateEnemies\b' src || true
          echo '=== base dealDamage callers / route hooks ==='
          grep -REn --include='*.js' 'dealDamage\(|bossPartOwner|lcNodeProxy|updateStructure\(' src/bosses.js src/systems-base.js src/boss-body-parts.js src/last-constellation-production-v1.js src/last-constellation-reset-v1.js || true
          echo '=== runtime ownership contract ==='
          node scripts/runtime-ownership-contract.mjs
