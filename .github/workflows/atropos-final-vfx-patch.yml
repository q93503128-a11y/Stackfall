name: Atropos final VFX patch

on:
  push:
    branches:
      - feature/atropos-world-devourer-prototype
    paths:
      - .github/workflows/atropos-final-vfx-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Refine temporal echo and world bite readability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from base64 import b64decode
          def dec(s): return b64decode(s).decode()
          def one(path, old64, new64):
              p=Path(path); text=p.read_text(encoding='utf-8'); old=dec(old64); new=dec(new64); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected 1 match, got {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')
          one('src/atropos-world-devourer-attack-past.js','','')
          one('src/atropos-world-devourer-attack-world.js','Y29uc3QgZW50ZXI9cTwuNjI/ZWFzZShxLy42Mik6MS1zbW9vdGgoKHEtLjYyKS8uMzgpLHg9bGVycChhLmhlYWRPdXRzaWRlLngsYS5iaXRlQ2VudGVyLngsZW50ZXIpLHk9bGVycChhLmhlYWRPdXRzaWRlLnksYS5iaXRlQ2VudGVyLnksZW50ZXIp','Y29uc3QgZW50ZXI9cTwuNDg/ZWFzZShxLy40OCk6cTwuODA/MToxLXNtb290aCgocS0uODApLy4yMCkseD1sZXJwKGEuaGVhZE91dHNpZGUueCxhLmJpdGVDZW50ZXIueCxlbnRlcikseT1sZXJwKGEuaGVhZE91dHNpZGUueSxhLmJpdGVDZW50ZXIueSxlbnRlcik=')
          one('src/atropos-world-devourer-attack-world.js','c25hcD1NYXRoLm1heCgwLDEtTWF0aC5hYnMocS0uNjIpLy4xMyksc3k9MS0uMzEqc25hcA==','c25hcD1NYXRoLm1heCgwLDEtTWF0aC5hYnMocS0uNjIpLy4xNiksc3k9MS0uMzQqc25hcA==')
          one('src/atropos-world-devourer-attack-world.js','ZWxzZSBpZihzdD09PSdzY2FyJyl7Y29uc3QgcT1jbGFtcCgoYS5hZ2UtV09STEQuYml0ZUVuZCkvV09STEQuc2NhciwwLDEpO2ZpbGxXb3JsZFBvbHlnb24ocG9seSwnIzAwMDAwMCcsLjY0KigxLS4zMCpxKSwnIzc5YjdjZScsLjM2KigxLXEpLDMpO2RyYXdTY2FyQ3JhY2tzKGEsLjQ2KigxLXEqLjcyKSk7fQ==','')
