name: Atropos one-shot echo restore

on:
  push:
    branches:
      - feature/atropos-world-devourer-prototype
    paths:
      - .github/workflows/atropos-final-vfx-patch.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Restore reviewed Atropos-art temporal echo
        shell: bash
        run: |
          set -euo pipefail
          git show d3b19c04e0fd35b0b97cf26adcaaa2503a526a59:src/atropos-world-devourer-attack-past.js > src/atropos-world-devourer-attack-past.js
          node --check src/atropos-world-devourer-attack-past.js
          git diff --check
      - name: Commit reviewed temporal echo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-attack-past.js
          if git diff --cached --quiet; then
            echo "Temporal echo already matches reviewed version."
            exit 0
          fi
          git commit -m "Restore reviewed Atropos-art temporal echo"
          git push origin HEAD:feature/atropos-world-devourer-prototype
