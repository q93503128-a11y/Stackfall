name: Temporary Stackfall performance pass 5

# retry after contract compatibility fix
on:
  push:
    paths:
      - '.github/workflows/performance-pass5-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate patch script
        run: python3 -m py_compile scripts/performance-pass5-temp.py
      - name: Apply performance pass 5
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/performance-pass5-temp.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/performance-audit-contract.mjs')
          text=p.read_text(encoding='utf-8')
          repairs=[
              ("&&!realm.includes('ctx.globalAlpha=(.05+(i%4)*.022)*intensity;ctx.strokeStyle=`rgba(${color},${.34+.28*intensity})`')),", "&&!realm.includes('ctx.globalAlpha=(.05+(i%4)*.022)*intensity;ctx.strokeStyle=`rgba(${color},${.34+.28*intensity})`')],"),
              ("&&!entities.includes('ctx.font=`800 ${t.size}px IBM Plex Sans KR`')),", "&&!entities.includes('ctx.font=`800 ${t.size}px IBM Plex Sans KR`')],"),
              ("realm.includes('const vx=player.moveVX||0,vy=player.moveVY||0,d=move||1,nx=vx/d,ny=vy/d;')", "realm.includes('const vx=player.moveVX||0,vy=player.moveVY||0,d=move||1,nx=vx/d,ny=vy/d,special=stageOne||stageTwo')"),
          ]
          for old,new in repairs:
              if text.count(old)!=1:
                  raise RuntimeError(f'contract repair target not unique: {old}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate optimized runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check src/realm-backgrounds.js
          node --check src/render-entities.js
          node --check scripts/performance-audit-contract.mjs
          node scripts/performance-audit-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' scripts/performance-audit-contract.mjs src/build-info.js src/realm-backgrounds.js src/render-entities.js | sort)"
          test "$changed" = "$expected"
      - name: Commit optimized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/realm-backgrounds.js src/render-entities.js scripts/performance-audit-contract.mjs src/build-info.js
          git commit -m 'perf: trim repeated render-frame allocations'
          git push origin HEAD:main
