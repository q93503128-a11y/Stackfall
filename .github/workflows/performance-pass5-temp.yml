name: Temporary Stackfall performance pass 5

on:
  push:
    paths:
      - '.github/workflows/performance-pass5-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate patch script
        run: python3 -m py_compile scripts/performance-pass5-temp.py
      - name: Apply performance pass 5
        run: python3 scripts/performance-pass5-temp.py
      - name: Validate optimized runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check src/realm-backgrounds.js
          node --check src/render-entities.js
          node scripts/performance-audit-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' scripts/performance-audit-contract.mjs src/build-info.js src/realm-backgrounds.js src/render-entities.js | sort)"
          test "$changed" = "$expected"
      - name: Commit optimized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/realm-backgrounds.js src/render-entities.js scripts/performance-audit-contract.mjs src/build-info.js
          git commit -m 'perf: trim repeated render-frame allocations'
          git push origin HEAD:main
