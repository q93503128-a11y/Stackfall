name: Temporary Stackfall performance pass 12

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-pass12-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate patch script
        run: python -m py_compile scripts/performance-pass12-temp.py
      - name: Apply performance pass 12
        run: python scripts/performance-pass12-temp.py
      - name: Validate optimized runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check src/systems-base.js
          node --check src/bosses.js
          node --check src/map-event-expansion.js
          node --check src/runtime-controls.js
          node --check src/stage-runtime.js
          node --check src/stage01-remodel.js
          node --check src/dev-tools-endless.js
          node --check src/render.js
          node --check scripts/performance-audit-contract.mjs
          node scripts/performance-audit-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Commit optimized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/systems-base.js src/bosses.js src/map-event-expansion.js src/runtime-controls.js src/stage-runtime.js src/stage01-remodel.js src/dev-tools-endless.js src/render.js src/build-info.js scripts/performance-audit-contract.mjs
          git diff --cached --check
          git commit -m 'perf: pool hostile projectile objects safely'
          git push origin HEAD:main
