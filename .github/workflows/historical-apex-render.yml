name: Historical apex render

on:
  push:
    branches: [feature/atropos-world-devourer-prototype]
    paths:
      - scripts/historical-apex-render.mjs
      - .github/workflows/historical-apex-render.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pre-9af-79afd49b
            ref: 79afd49b3d37dda6a43e0063527c32b8267245df
          - label: post-9af-9af0cdec
            ref: 9af0cdec6fdcf6a3181effe4e1cea2eb4022edef
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve renderer script
        shell: bash
        run: |
          cp scripts/historical-apex-render.mjs /tmp/historical-apex-render.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/historical-apex-render.mjs')
          s=p.read_text()
          old="const c=document.querySelector('#game');const W=innerWidth,H=innerHeight;"
          new="for(const el of document.querySelectorAll('#menu,#hud,#choiceScreen,#resonanceBanner,#bossNotice,#pauseScreen,#gameOverScreen,#settingsScreen,#touchControls'))el.style.display='none';document.body.style.overflow='hidden';const c=document.querySelector('#game');c.style.position='fixed';c.style.inset='0';const W=innerWidth,H=innerHeight;"
          if old not in s: raise SystemExit('patch anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Checkout historical commit
        run: |
          git fetch --depth=1 origin ${{ matrix.ref }}
          git checkout --detach ${{ matrix.ref }}
      - name: Render historical apex silhouettes
        env:
          HIST_LABEL: ${{ matrix.label }}
        run: node /tmp/historical-apex-render.mjs
      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: historical-apex-${{ matrix.label }}
          path: test-results/historical-apex
          if-no-files-found: error
