name: Answer V11 asset integration

on:
  push:
    branches:
      - feature/void-apex-answer-v1
    paths:
      - scripts/patch-answer-v11.mjs
      - .github/workflows/answer-v11-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply V11 asset integration
        run: node scripts/patch-answer-v11.mjs
      - name: Validate and refresh build fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/void-apex-answer-v1.js scripts/void-apex-answer-contract.mjs scripts/build-fingerprint.mjs src/build-info.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use aligned assets for Answer body and phase fissures"
          git push origin HEAD:feature/void-apex-answer-v1
