name: Canonical cleanup 6 transform runner
on:
  push:
    branches:
      - validation/canonical-cleanup-6
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract guarded transform
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /node <<.NODE./ {capture=1; next}
            capture && /^[[:space:]]*NODE[[:space:]]*$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/canonical-cleanup-6-run.yml >/tmp/cleanup6-transform.js
          test -s /tmp/cleanup6-transform.js
          node /tmp/cleanup6-transform.js
      - name: Check transformed ownership surface
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn --include='*.js' '\bdealDamage\s*=\s*function\b' src; then exit 1; fi
          if grep -REn --include='*.js' '\bupdateEnemies\s*=\s*function\b' src; then exit 1; fi
          for file in src/systems-base.js src/bosses.js src/boss-body-parts.js src/last-constellation-production-v1.js src/last-constellation-hit-routing-v1.js src/reward-refinement.js src/weapon-awakening-effects-a1-a7.js src/weapon-awakening-effects-a8-a13.js src/community-feedback-refinement.js src/endgame-balance-expansion.js src/feature-pack.js src/last-constellation-reset-v1.js src/last-constellation-presentation-v3.js src/combat-guidance-refinement.js src/last-constellation-combat-v2.js scripts/runtime-ownership-contract.mjs; do node --check "$file"; done
          node scripts/runtime-ownership-contract.mjs
      - name: Validate full source and write build fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/stackfall-server.log 2>&1 &
          sleep 2
      - name: Chromium full smoke
        env:
          STACKFALL_ALLOW_GPU_SKIP: '1'
          STACKFALL_ALLOW_CONTEXT_SKIP: '1'
        run: node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/ --result=test-results/canonical-cleanup-6-smoke.json
      - name: Persist validated source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/canonical-cleanup-6-inspect.yml .github/workflows/canonical-cleanup-6-run.yml .github/workflows/canonical-cleanup-6-runner.yml
          git config user.name 'Stackfall validation bot'
          git config user.email 'stackfall-validation@users.noreply.github.com'
          git add src scripts .github/workflows
          git commit -m 'Persist validated canonical cleanup 6 [skip ci]'
          git push origin HEAD:validation/canonical-cleanup-6
