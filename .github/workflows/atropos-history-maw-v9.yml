name: Atropos history and Maw v9

on:
  push:
    branches: [feature/atropos-world-devourer-prototype]
    paths: [scripts/atropos-history-maw-v9-trigger.txt]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Apply history and Maw v9
        run: |
          python scripts/atropos-history-maw-v9.py
          node --check src/atropos-world-devourer-prototype.js
          node --check src/atropos-world-devourer-entry.js
          node --check src/atropos-world-devourer-attack-maw.js
          node scripts/atropos-code-audit.mjs
      - name: Commit history and Maw v9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-prototype.js src/atropos-world-devourer-entry.js src/atropos-world-devourer-attack-maw.js
          git commit -m "Reset Atropos idle history and prevent Maw overshoot"
          git push origin HEAD:feature/atropos-world-devourer-prototype
