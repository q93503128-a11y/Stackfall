name: Temporary fix achievement hub layout

on:
  push:
    paths:
      - '.github/workflows/fix-achievement-hub-layout-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Balance core growth and achievement cards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/endless-progression.js')
          s=p.read_text(encoding='utf-8')
          old='    .hub-mode-card.achievement-card:before{background:'
          new='    @media(min-width:761px){.hub-mode-card.upgrade-card{grid-column:auto;min-height:170px}.hub-mode-card.upgrade-card strong{font-size:clamp(28px,3.1vw,42px)}}\n    .hub-mode-card.achievement-card:before{background:'
          if old not in s:
              raise SystemExit('achievement hub style anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node scripts/build-fingerprint.mjs
          git rm .github/workflows/fix-achievement-hub-layout-temp.yml
      - name: Commit fix and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/endless-progression.js src/build-info.js
          git commit -m 'fix: balance achievement hub layout'
          git push origin HEAD:main
