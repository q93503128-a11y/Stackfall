name: Answer V13 final validation

on:
  push:
    branches:
      - feature/void-apex-answer-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify approved Answer WebP container and dimensions
        shell: python
        run: |
          from pathlib import Path
          p=Path('assets/answer/answer_body_base.webp')
          b=p.read_bytes()
          assert len(b)>=30, len(b)
          assert b[:4]==b'RIFF' and b[8:12]==b'WEBP', b[:12]
          assert int.from_bytes(b[4:8],'little')+8==len(b), (int.from_bytes(b[4:8],'little')+8,len(b))
          assert b[12:16]==b'VP8X', b[12:16]
          w=1+int.from_bytes(b[24:27],'little')
          h=1+int.from_bytes(b[27:30],'little')
          assert (w,h)==(960,540),(w,h)
          print('Answer body WebP OK',len(b),'bytes',w,'x',h)
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0 | sort -z)
      - name: Check all Stackfall contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/polish-contract-check.mjs
          node scripts/meta-upgrade-contract.mjs
          node scripts/level-choice-contract.mjs
          node scripts/stage-catalog-contract.mjs
          node scripts/stage-geometry-contract.mjs
          node scripts/stage-craft-contract.mjs
          node scripts/dev-tools-contract.mjs
          node scripts/performance-audit-contract.mjs
          node scripts/sortie-prep-contract.mjs
          node scripts/boss-identity-contract.mjs
          node scripts/stage-map-contract.mjs
          node scripts/run-mode-contract.mjs
          node scripts/enemy-director-contract.mjs
          node scripts/field-pickup-contract.mjs
          node scripts/runtime-ownership-contract.mjs
          node scripts/void-boss-contract.mjs
          node scripts/void-apex-answer-contract.mjs
          node scripts/apex-encounter-contract.mjs
          node scripts/endgame-balance-contract.mjs
          node scripts/realm-specials-contract.mjs
          OWNERSHIP_GROUP=health node scripts/source-ownership-contract.mjs
          OWNERSHIP_GROUP=regen-runtime node scripts/source-ownership-contract.mjs
          OWNERSHIP_GROUP=regen-docs node scripts/source-ownership-contract.mjs
          OWNERSHIP_GROUP=hard node scripts/source-ownership-contract.mjs
          OWNERSHIP_GROUP=prism node scripts/source-ownership-contract.mjs
          OWNERSHIP_GROUP=targeting node scripts/source-ownership-contract.mjs
          OWNERSHIP_GROUP=docs node scripts/source-ownership-contract.mjs
          OWNERSHIP_GROUP=ci node scripts/source-ownership-contract.mjs
          node scripts/community-feedback-contract.mjs
          node scripts/damage-results-contract.mjs
          node scripts/legacy-chat-requirements-contract.mjs
          node scripts/awakening-first-set-contract.mjs
          node scripts/awakening-second-set-contract.mjs
          node scripts/awakening-final-set-contract.mjs
      - name: Check build fingerprint
        run: node scripts/build-fingerprint.mjs
