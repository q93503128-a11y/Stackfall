name: Canonical cleanup 6 runner
on:
  push:
    branches:
      - validation/canonical-cleanup-6
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded canonical damage and enemy update transform
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const write=(p,t)=>fs.writeFileSync(p,t);
          function countOf(text,needle){return text.split(needle).length-1;}
          function replaceOne(path,from,to,label){const text=read(path),count=countOf(text,from);if(count!==1)throw new Error(`${label}: expected one exact match in ${path}, got ${count}`);write(path,text.replace(from,to));}
          function replaceRegexOne(path,re,to,label){const text=read(path),flags=re.flags.includes('g')?re.flags:re.flags+'g',matches=[...text.matchAll(new RegExp(re.source,flags))];if(matches.length!==1)throw new Error(`${label}: expected one regex match in ${path}, got ${matches.length}`);write(path,text.replace(re,to));}
          function editSection(path,start,end,label,edit){const text=read(path),a=text.indexOf(start);if(a<0)throw new Error(`${label}: start marker missing in ${path}`);const b=text.indexOf(end,a+start.length);if(b<0)throw new Error(`${label}: end marker missing in ${path}`);const section=text.slice(a,b),next=edit(section);if(next===section)throw new Error(`${label}: transform made no change in ${path}`);write(path,text.slice(0,a)+next+text.slice(b));}
          function replaceIn(text,from,to,label){const count=countOf(text,from);if(count!==1)throw new Error(`${label}: expected one section match, got ${count}`);return text.replace(from,to);}
          function replaceAllIn(text,from,to,label,min=1){const count=countOf(text,from);if(count<min)throw new Error(`${label}: expected >=${min} occurrences, got ${count}`);return text.split(from).join(to);}
          function closeInterceptor(text,label){const trimmed=text.replace(/\s+$/,'');if(!trimmed.endsWith('};'))throw new Error(`${label}: section does not end in };`);return trimmed.slice(0,-2)+'});'+text.slice(trimmed.length);}

          // 1) Canonical damage owner. Registered interceptors reproduce the historical wrapper stack
          // exactly: newest registration is outermost, while next() only reaches earlier registrations.
          replaceRegexOne('src/systems-base.js',/^function dealDamage\(enemy,amount,opts=\{\}\)\{[^\n]*\}$/m,
`const STACKFALL_DAMAGE_INTERCEPTORS=[];
function registerDamageInterceptor(id,handler){if(typeof handler!=='function')return false;const key=String(id||handler.name||'damage-interceptor'),index=STACKFALL_DAMAGE_INTERCEPTORS.findIndex(entry=>entry.id===key),entry={id:key,handler};if(index>=0)STACKFALL_DAMAGE_INTERCEPTORS[index]=entry;else STACKFALL_DAMAGE_INTERCEPTORS.push(entry);return true;}
function applyDamageCore(enemy,amount,opts={}){if(!enemy||enemy.dead)return;const critChance=clamp(.05+stat('crit')*.06,.05,1),crit=opts.canCrit!==false&&Math.random()<critChance,elite=enemy.type==='mini'||enemy.type==='boss';amount*=damageMult()*(elite?1+stat('eliteHunter')*.15:1)*(crit?1.8:1);const hpBefore=enemy.hp;enemy.hp-=amount;const inflicted=Math.max(0,Math.min(hpBefore,amount));if(typeof registerRunDamage==='function')registerRunDamage(inflicted,opts.source);if(elite&&typeof registerStackfallBossChainDamage==='function')registerStackfallBossChainDamage(enemy,inflicted,opts);enemy.hit=.09;const color=crit?COLORS.amber:(opts.color||COLORS.white),stressed=typeof stackfallPerformanceStressed==='function'&&stackfallPerformanceStressed(),showNumbers=GAME_SETTINGS.damageNumbers!==false&&(!stressed||crit||elite);if(showNumbers)addText(enemy.x,enemy.y-enemy.r,Math.round(amount),color,crit?18:12);if(crit||elite||(!stressed&&Math.random()<.20))spawnParticle(enemy.x,enemy.y,color,crit?6:elite?2:1,crit?150:85,crit?4:2.2);audio.hit(crit||elite,opts.source||'');const lethal=enemy.hp<=0;if(lethal){if(opts.deferKill===true)enemy.dead=true;else killEnemy(enemy,opts);}return{inflicted,remainingHp:enemy.hp,lethal};}
function runDamageInterceptor(index,enemy,amount,opts){if(index<0)return applyDamageCore(enemy,amount,opts);const entry=STACKFALL_DAMAGE_INTERCEPTORS[index],next=(nextEnemy=enemy,nextAmount=amount,nextOpts=opts)=>runDamageInterceptor(index-1,nextEnemy,nextAmount,nextOpts);return entry.handler(next,enemy,amount,opts);}
function dealDamage(enemy,amount,opts={}){return runDamageInterceptor(STACKFALL_DAMAGE_INTERCEPTORS.length-1,enemy,amount,opts);}`,
          'install canonical damage interceptor pipeline');

          // 2) Canonical enemy update owner with the same captured-base semantics.
          replaceOne('src/bosses.js','function updateEnemies(dt){',
`const STACKFALL_ENEMY_UPDATE_INTERCEPTORS=[];
function registerEnemyUpdateInterceptor(id,handler){if(typeof handler!=='function')return false;const key=String(id||handler.name||'enemy-update-interceptor'),index=STACKFALL_ENEMY_UPDATE_INTERCEPTORS.findIndex(entry=>entry.id===key),entry={id:key,handler};if(index>=0)STACKFALL_ENEMY_UPDATE_INTERCEPTORS[index]=entry;else STACKFALL_ENEMY_UPDATE_INTERCEPTORS.push(entry);return true;}
function runEnemyUpdateInterceptor(index,dt){if(index<0)return updateEnemiesCore(dt);const entry=STACKFALL_ENEMY_UPDATE_INTERCEPTORS[index],next=(nextDt=dt)=>runEnemyUpdateInterceptor(index-1,nextDt);return entry.handler(next,dt);}
function updateEnemiesCore(dt){`, 'install canonical enemy update interceptor registry');
          replaceOne('src/bosses.js','\n}\nfunction hurtPlayer(amount,source){',
`\n}
function updateEnemies(dt){return runEnemyUpdateInterceptor(STACKFALL_ENEMY_UPDATE_INTERCEPTORS.length-1,dt);}
function hurtPlayer(amount,source){`, 'restore canonical updateEnemies entrypoint');

          // 3) Multipart boss damage routing becomes a registered interceptor.
          replaceOne('src/boss-body-parts.js',
`const baseDealDamageWithParts=dealDamage;
dealDamage=function routeBossPartDamageToSharedPool(target,amount,options={}){const owner=bossPartOwner(target);if(target?.bodyPart)apexCombatService(owner)?.onBodyPartHit?.(target,owner,amount,options);return baseDealDamageWithParts(owner,amount,options);};`,
`registerDamageInterceptor('boss-body-parts',function routeBossPartDamageToSharedPool(next,target,amount,options={}){const owner=bossPartOwner(target);if(target?.bodyPart)apexCombatService(owner)?.onBodyPartHit?.(target,owner,amount,options);return next(owner,amount,options);});`, 'convert multipart boss damage wrapper');

          // 4) Last Constellation authoritative node health and per-frame structure update.
          editSection('src/last-constellation-production-v1.js',
`  // Route the real, fully modified damage through the existing damage stack, but temporarily use`,
`\n\n  function updateStructure`, 'convert Last Constellation node damage wrapper', section=>{
            section=replaceIn(section,
`  const baseDealDamage=typeof dealDamage==='function'?dealDamage:null;
  if(baseDealDamage)dealDamage=function lastConstellationNodeDamage(target,amount,options={}){`,
`  registerDamageInterceptor('last-constellation-production',function lastConstellationNodeDamage(next,target,amount,options={}){`, 'Last Constellation damage head');
            section=replaceAllIn(section,'baseDealDamage(','next(','Last Constellation captured damage',2);
            return closeInterceptor(section,'Last Constellation damage');
          });
          replaceOne('src/last-constellation-production-v1.js',
`  const baseUpdateEnemies=typeof updateEnemies==='function'?updateEnemies:null;
  if(baseUpdateEnemies)updateEnemies=function updateEnemiesWithLastConstellationStructure(dt){for(const e of state.entities.enemies||[])if(isLC(e))updateStructure(e);return baseUpdateEnemies(dt);};`,
`  registerEnemyUpdateInterceptor('last-constellation-production',function updateEnemiesWithLastConstellationStructure(next,dt){for(const e of state.entities.enemies||[])if(isLC(e))updateStructure(e);return next(dt);});`, 'convert Last Constellation structure update wrapper');

          // 5) Last Constellation melee hit routing preserves the struck proxy before node damage.
          editSection('src/last-constellation-hit-routing-v1.js',
`  if(typeof dealDamage==='function'){`,
`\n\n  function installWaveRouter()`, 'convert Last Constellation melee damage wrapper', section=>{
            section=replaceIn(section,
`  if(typeof dealDamage==='function'){
    const base=dealDamage;
    dealDamage=function lastConstellationMeleeDamageRouting(target,amount,options={}){`,
`  registerDamageInterceptor('last-constellation-hit-routing',function lastConstellationMeleeDamageRouting(next,target,amount,options={}){`, 'Last Constellation hit-routing head');
            section=replaceAllIn(section,'base(','next(','Last Constellation hit-routing next',2);
            section=replaceIn(section,`    };\n  }`,`  });`,'Last Constellation hit-routing tail');
            return section;
          });

          // 6) Existing weapon/balance damage layers become interceptors without changing their captured-base behavior.
          editSection('src/reward-refinement.js',
`  const rrDeal=dealDamage;let chainGuard=false,bladeGuard=false,augmentBurstGuard=false;`,
`\n\n  const rrHurt=hurtPlayer;`, 'convert reward damage wrapper', section=>{
            section=replaceIn(section,
`  const rrDeal=dealDamage;let chainGuard=false,bladeGuard=false,augmentBurstGuard=false;
  dealDamage=function(enemy,amount,opts={}){`,
`  let chainGuard=false,bladeGuard=false,augmentBurstGuard=false;
  registerDamageInterceptor('reward-refinement',function rewardRefinementDamage(next,enemy,amount,opts={}){`, 'reward damage head');
            section=replaceAllIn(section,'rrDeal(','next(','reward captured damage',2);
            return closeInterceptor(section,'reward damage');
          });

          editSection('src/weapon-awakening-effects-a8-a13.js',
`  const baseDealDamage=dealDamage;
  dealDamage=function awakeningSecondSetDamage`,
`\n\n  function castSuperconductiveNetwork`, 'convert second awakening damage wrapper', section=>{
            section=replaceIn(section,
`  const baseDealDamage=dealDamage;
  dealDamage=function awakeningSecondSetDamage(enemy,amount,opts={}){`,
`  registerDamageInterceptor('awakening-second-set',function awakeningSecondSetDamage(next,enemy,amount,opts={}){`, 'second awakening head');
            section=replaceAllIn(section,'baseDealDamage(','next(','second awakening captured damage',1);
            return closeInterceptor(section,'second awakening damage');
          });

          editSection('src/community-feedback-refinement.js',
`  const previousDealDamage=dealDamage;`,
`\n\n  const PRISM_ACQUISITION_SECONDS`, 'convert community damage wrapper', section=>{
            section=replaceIn(section,
`  const previousDealDamage=dealDamage;
  let feedbackDamageGuard=false;
  dealDamage=function communityBalancedDamage(enemy,amount,opts={}){`,
`  let feedbackDamageGuard=false;
  registerDamageInterceptor('community-feedback',function communityBalancedDamage(next,enemy,amount,opts={}){`, 'community damage head');
            section=replaceAllIn(section,'previousDealDamage(','next(','community captured damage',3);
            return closeInterceptor(section,'community damage');
          });

          editSection('src/endgame-balance-expansion.js',
`  const baseDealDamage=dealDamage;let secondaryDamageGuard=false;`,
`\n\n  const prismBodyCount`, 'convert endgame damage wrapper', section=>{
            section=replaceIn(section,
`  const baseDealDamage=dealDamage;let secondaryDamageGuard=false;
  dealDamage=function endgameWeaponDamage(enemy,amount,opts={}){`,
`  let secondaryDamageGuard=false;
  registerDamageInterceptor('endgame-balance',function endgameWeaponDamage(next,enemy,amount,opts={}){`, 'endgame damage head');
            section=replaceAllIn(section,'baseDealDamage(','next(','endgame captured damage',3);
            return closeInterceptor(section,'endgame damage');
          });

          editSection('src/feature-pack.js',
`const sf2BaseDealDamage=dealDamage;`,
`\n\nspawnCoreShot=`, 'convert feature-pack damage wrapper', section=>{
            section=replaceIn(section,
`const sf2BaseDealDamage=dealDamage;
let sf2EchoBladeGuard=false;
dealDamage=function dealDamageWithDistinctBursts(enemy,amount,opts={}){`,
`let sf2EchoBladeGuard=false;
registerDamageInterceptor('feature-pack',function dealDamageWithDistinctBursts(next,enemy,amount,opts={}){`, 'feature-pack damage head');
            section=replaceAllIn(section,'sf2BaseDealDamage(','next(','feature-pack captured damage',4);
            return closeInterceptor(section,'feature-pack damage');
          });

          editSection('src/weapon-awakening-effects-a1-a7.js',
`  const baseDealDamage=dealDamage;
  dealDamage=function awakeningFirstSetDamage`,
`\n\n  // A4`, 'convert first awakening damage wrapper', section=>{
            section=replaceIn(section,
`  const baseDealDamage=dealDamage;
  dealDamage=function awakeningFirstSetDamage(enemy,amount,opts={}){`,
`  registerDamageInterceptor('awakening-first-set',function awakeningFirstSetDamage(next,enemy,amount,opts={}){`, 'first awakening head');
            section=replaceAllIn(section,'baseDealDamage(','next(','first awakening captured damage',1);
            return closeInterceptor(section,'first awakening damage');
          });

          // 7) Remaining updateEnemies wrappers become exact-order interceptors.
          replaceOne('src/last-constellation-reset-v1.js',
`  const baseUpdateEnemies=typeof updateEnemies==='function'?updateEnemies:null;
  if(baseUpdateEnemies)updateEnemies=function updateEnemiesWithConstellationReset(dt){cleanupLegacyObjects();return baseUpdateEnemies(dt);};`,
`  registerEnemyUpdateInterceptor('last-constellation-reset',function updateEnemiesWithConstellationReset(next,dt){cleanupLegacyObjects();return next(dt);});`, 'convert constellation reset update wrapper');

          editSection('src/last-constellation-presentation-v3.js',
`  const baseUpdateEnemies=typeof updateEnemies==='function'?updateEnemies:null;`,
`\n\n  function stateOf`, 'convert constellation presentation update wrapper', section=>{
            section=replaceIn(section,
`  const baseUpdateEnemies=typeof updateEnemies==='function'?updateEnemies:null;
  if(baseUpdateEnemies)updateEnemies=function updateEnemiesWithMonumentalConstellation(dt){`,
`  registerEnemyUpdateInterceptor('last-constellation-presentation',function updateEnemiesWithMonumentalConstellation(next,dt){`, 'constellation presentation head');
            section=replaceAllIn(section,'baseUpdateEnemies(','next(','constellation presentation next',1);
            return closeInterceptor(section,'constellation presentation update');
          });

          replaceOne('src/combat-guidance-refinement.js',
`  const baseUpdateEnemies=updateEnemies;updateEnemies=function(dt){leashEnemies();baseUpdateEnemies(dt);};`,
`  registerEnemyUpdateInterceptor('combat-guidance',function combatGuidanceEnemyUpdate(next,dt){leashEnemies();next(dt);});`, 'convert combat guidance update wrapper');

          editSection('src/last-constellation-combat-v2.js',
`  const baseUpdateEnemies=typeof updateEnemies==='function'?updateEnemies:null;`,
`\n\n  // ---- Rendering`, 'convert constellation combat update wrapper', section=>{
            section=replaceIn(section,
`  const baseUpdateEnemies=typeof updateEnemies==='function'?updateEnemies:null;
  if(baseUpdateEnemies)updateEnemies=function updateEnemiesWithLastConstellationCombatV2(dt){const result=baseUpdateEnemies(dt);for(const e of state.entities.enemies||[])if(isLC(e))updateCombat(e,dt);return result;};`,
`  registerEnemyUpdateInterceptor('last-constellation-combat-v2',function updateEnemiesWithLastConstellationCombatV2(next,dt){const result=next(dt);for(const e of state.entities.enemies||[])if(isLC(e))updateCombat(e,dt);return result;});`, 'constellation combat update');
            return section;
          });

          // 8) Harden ownership contracts against reintroducing either replacement chain.
          let contract=read('scripts/runtime-ownership-contract.mjs');
          const readAnchor="const atroposPolish=read('src/atropos-production-polish-v2.js');\nconst constellationReset=read('src/last-constellation-reset-v1.js');";
          if(!contract.includes(readAnchor))throw new Error('runtime ownership read anchor drifted');
          contract=contract.replace(readAnchor,readAnchor+"\nconst constellationHitRouting=read('src/last-constellation-hit-routing-v1.js');\nconst constellationPresentation=read('src/last-constellation-presentation-v3.js');\nconst constellationCombat=read('src/last-constellation-combat-v2.js');\nconst combatGuidance=read('src/combat-guidance-refinement.js');\nconst awakeningFirst=read('src/weapon-awakening-effects-a1-a7.js');\nconst awakeningSecond=read('src/weapon-awakening-effects-a8-a13.js');\nconst communityFeedback=read('src/community-feedback-refinement.js');\nconst endgameBalance=read('src/endgame-balance-expansion.js');\nconst featurePack=read('src/feature-pack.js');");
          const contractAnchor="expect('Chronophage entry and multipart hit reactions use explicit hooks',bosses.includes('encounterService?.beforeEnemies?.(dt)===false')&&runClock.includes('ATROPOS_COMBAT_SERVICE.beforeEnemies=')&&bossParts.includes('onBodyPartHit?.(target,owner,amount,options)')&&!replaces(runClock,'updateEnemies')&&!replaces(runClock,'dealDamage'));";
          if(!contract.includes(contractAnchor))throw new Error('runtime ownership expectation anchor drifted');
          const extra=`\nconst damageInterceptorFiles=[bossParts,constellation,constellationHitRouting,rewards,awakeningFirst,awakeningSecond,communityFeedback,endgameBalance,featurePack];\nexpect('damage dispatch has one canonical owner with captured-base interceptor semantics',base.includes('function registerDamageInterceptor(id,handler)')&&base.includes('function applyDamageCore(enemy,amount,opts={})')&&base.includes('runDamageInterceptor(index-1')&&base.includes('entry.handler(next,enemy,amount,opts)')&&base.includes('function dealDamage(enemy,amount,opts={})'));\nexpect('damage feature layers register interceptors instead of replacing dealDamage',!damageInterceptorFiles.some(text=>replaces(text,'dealDamage'))&&bossParts.includes("registerDamageInterceptor('boss-body-parts'")&&constellation.includes("registerDamageInterceptor('last-constellation-production'")&&constellationHitRouting.includes("registerDamageInterceptor('last-constellation-hit-routing'")&&rewards.includes("registerDamageInterceptor('reward-refinement'")&&awakeningFirst.includes("registerDamageInterceptor('awakening-first-set'")&&awakeningSecond.includes("registerDamageInterceptor('awakening-second-set'")&&communityFeedback.includes("registerDamageInterceptor('community-feedback'")&&endgameBalance.includes("registerDamageInterceptor('endgame-balance'")&&featurePack.includes("registerDamageInterceptor('feature-pack'"));\nconst enemyUpdateInterceptorFiles=[constellation,constellationReset,constellationPresentation,constellationCombat,combatGuidance];\nexpect('enemy update dispatch has one canonical owner with captured-base interceptor semantics',bosses.includes('function registerEnemyUpdateInterceptor(id,handler)')&&bosses.includes('function updateEnemiesCore(dt)')&&bosses.includes('runEnemyUpdateInterceptor(index-1')&&bosses.includes('entry.handler(next,dt)')&&bosses.includes('function updateEnemies(dt)'));\nexpect('enemy update feature layers register interceptors instead of replacing updateEnemies',!enemyUpdateInterceptorFiles.some(text=>replaces(text,'updateEnemies'))&&constellation.includes("registerEnemyUpdateInterceptor('last-constellation-production'")&&constellationReset.includes("registerEnemyUpdateInterceptor('last-constellation-reset'")&&constellationPresentation.includes("registerEnemyUpdateInterceptor('last-constellation-presentation'")&&constellationCombat.includes("registerEnemyUpdateInterceptor('last-constellation-combat-v2'")&&combatGuidance.includes("registerEnemyUpdateInterceptor('combat-guidance'"));`;
          contract=contract.replace(contractAnchor,contractAnchor+extra);
          write('scripts/runtime-ownership-contract.mjs',contract);
          NODE
      - name: Check transformed ownership surface
        shell: bash
        run: |
          set -euo pipefail
          echo '=== remaining dealDamage assignments ==='
          if grep -REn --include='*.js' '\bdealDamage\s*=\s*function\b' src; then exit 1; fi
          echo '=== remaining updateEnemies assignments ==='
          if grep -REn --include='*.js' '\bupdateEnemies\s*=\s*function\b' src; then exit 1; fi
          for file in src/systems-base.js src/bosses.js src/boss-body-parts.js src/last-constellation-production-v1.js src/last-constellation-hit-routing-v1.js src/reward-refinement.js src/weapon-awakening-effects-a1-a7.js src/weapon-awakening-effects-a8-a13.js src/community-feedback-refinement.js src/endgame-balance-expansion.js src/feature-pack.js src/last-constellation-reset-v1.js src/last-constellation-presentation-v3.js src/combat-guidance-refinement.js src/last-constellation-combat-v2.js scripts/runtime-ownership-contract.mjs; do node --check "$file"; done
          node scripts/runtime-ownership-contract.mjs
      - name: Validate full source and write build fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/stackfall-server.log 2>&1 &
          sleep 2
      - name: Chromium full smoke
        env:
          STACKFALL_ALLOW_GPU_SKIP: '1'
          STACKFALL_ALLOW_CONTEXT_SKIP: '1'
        run: node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/ --result=test-results/canonical-cleanup-6-smoke.json
      - name: Persist validated source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/canonical-cleanup-6-inspect.yml .github/workflows/canonical-cleanup-6-run.yml
          git config user.name 'Stackfall validation bot'
          git config user.email 'stackfall-validation@users.noreply.github.com'
          git add src scripts .github/workflows
          git commit -m 'Persist validated canonical cleanup 6 [skip ci]'
          git push origin HEAD:validation/canonical-cleanup-6
