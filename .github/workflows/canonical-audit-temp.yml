name: Canonical audit temp

on:
  push:
    branches:
      - feature/enemy-director-v1

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/enemy-director-v1
      - name: Generate canonical audit evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-out
          {
            echo '=== HEAD ==='
            git rev-parse HEAD
            echo
            echo '=== SRC JS FILES ==='
            find src -maxdepth 1 -type f -name '*.js' -printf '%f\n' | sort
            echo
            echo '=== STATIC SCRIPT LOAD ORDER ==='
            grep -oE 'src="src/[^"]+\.js"' index.html || true
            echo
            echo '=== DYNAMIC SCRIPT LOAD REFERENCES ==='
            grep -RInE "(src/[A-Za-z0-9._/-]+\.js|createElement\(['\"]script['\"]\)|\.src *=)" src --include='*.js' || true
            echo
            echo '=== GLOBAL FUNCTION REPLACEMENT CANDIDATES ==='
            grep -RInE '(^|[^A-Za-z0-9_])(const|let|var) +base[A-Za-z0-9_]* *= *[A-Za-z_$][A-Za-z0-9_$]* *;|^[[:space:]]*[A-Za-z_$][A-Za-z0-9_$]* *= *function|window\.[A-Za-z_$][A-Za-z0-9_$]* *= *function' src --include='*.js' || true
            echo
            echo '=== OLD/WRAPPER/FIX STYLE FILENAMES ==='
            find src -maxdepth 1 -type f \( -name '*fix*' -o -name '*legacy*' -o -name '*refinement*' -o -name '*rollback*' -o -name '*production-v[0-9]*' -o -name '*v[0-9].js' \) -printf '%f\n' | sort
            echo
            echo '=== DEPRECATED ENDLESS EVENT RESIDUE ==='
            grep -RInE 'distress|meteorName|predatorName|relayName|stormName|startDistress|startMeteor|startPredator|startRelay|startStorm' src scripts docs README.md || true
            echo
            echo '=== DOCS ==='
            find docs -maxdepth 1 -type f -printf '%f\n' | sort
            echo
            echo '=== TODO/FIXME/DEPRECATED/HISTORICAL ==='
            grep -RInE 'TODO|FIXME|DEPRECATED|HISTORICAL|legacy|deprecated|obsolete|stale' docs src README.md --include='*.md' --include='*.js' || true
          } > audit-out/canonical-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-audit
          path: audit-out/canonical-audit.txt
          retention-days: 1
