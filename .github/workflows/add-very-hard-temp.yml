name: Temporary very hard difficulty patch

on:
  push:
    paths:
      - '.github/workflows/add-very-hard-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize temporary helper anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/add-very-hard-temp.py')
          out=[]
          for line in p.read_text(encoding='utf-8').splitlines():
              if 'endless-achievement-unlocks i' in line and 'achievement-screen{' in line:
                  if 'achievement-toast-stack' in line:
                      payload=line[line.index('.achievement-toast-stack'):]
                      payload=payload.replace(".achievement-screen{',", ".achievement-screen{z-index:52;',", 1)
                      line="    '    "+payload
                  else:
                      line="    '    .achievement-screen{z-index:52;',"
              out.append(line)
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Apply patch
        run: python scripts/add-very-hard-temp.py
      - name: Update balance contract expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/meta-upgrade-contract.mjs')
          text=p.read_text(encoding='utf-8')
          old="difficulty.includes('rewardMultiplier:.85')&&difficulty.includes('rewardMultiplier:1.30')&&difficulty.includes('stackfallDifficultyRewardMultiplier')"
          new="difficulty.includes('rewardMultiplier:.85')&&difficulty.includes('rewardMultiplier:1.40')&&difficulty.includes('rewardMultiplier:1.70')&&difficulty.includes(\"'very-hard':Object.freeze\")&&difficulty.includes('stackfallDifficultyRewardMultiplier')"
          if text.count(old)!=1:
              raise SystemExit(f'expected one meta difficulty contract match, got {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('scripts/endgame-balance-contract.mjs')
          text=p.read_text(encoding='utf-8')
          old="expect('hard difficulty increased',difficulty.includes('enemyHp:1.32')&&difficulty.includes('enemyDamage:1.30')&&difficulty.includes('enemySpeed:1.12')&&difficulty.includes('rangedChance:1.28'));"
          new="expect('hard difficulty increased and very hard added',difficulty.includes('enemyHp:1.42')&&difficulty.includes('enemyDamage:1.36')&&difficulty.includes('enemySpeed:1.14')&&difficulty.includes('rangedChance:1.35')&&difficulty.includes('enemyHp:1.80')&&difficulty.includes('enemyDamage:1.60')&&difficulty.includes('enemySpeed:1.20')&&difficulty.includes('rangedChance:1.55'));"
          if text.count(old)!=1:
              raise SystemExit(f'expected one endgame difficulty contract match, got {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate and refresh build fingerprint
        run: |
          node --check src/meta-progression.js
          node --check src/difficulty-augment-expansion.js
          node --check src/endless-progression.js
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Commit production changes
        run: |
          set -euo pipefail
          git config user.name coworkaccount
          git config user.email cyp1jhh2@gmail.com
          git add src/meta-progression.js src/difficulty-augment-expansion.js src/endless-progression.js src/build-info.js scripts/meta-upgrade-contract.mjs scripts/endgame-balance-contract.mjs
          git commit -m "feat: add very hard difficulty and live achievement toasts"
          git push origin HEAD:main
