# rerun with real in-game achievement trigger coverage
name: Temporary very hard live QA

on:
  push:
    paths:
      - '.github/workflows/add-very-hard-temp.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for deployed fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected=$(node --input-type=module -e "import {computeBuildFingerprint} from './scripts/build-fingerprint.mjs'; console.log(computeBuildFingerprint(process.cwd()).sha)")
          for attempt in $(seq 1 28); do
            body=$(curl -fsS "https://stackfall.pages.dev/src/build-info.js?very-hard-qa=${GITHUB_SHA}-${attempt}" || true)
            if printf '%s' "$body" | grep -Fq "$expected"; then
              echo "deployed fingerprint matched: $expected"
              exit 0
            fi
            echo "attempt $attempt: waiting for deployment"
            sleep 15
          done
          exit 1
      - name: Run very hard live QA
        run: node scripts/very-hard-live-qa-temp.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackfall-very-hard-live-qa
          path: test-results/very-hard-live-qa
          if-no-files-found: error
