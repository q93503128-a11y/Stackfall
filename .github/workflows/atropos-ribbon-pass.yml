name: Atropos ribbon continuity pass

on:
  push:
    branches: [feature/atropos-world-devourer-prototype]
    paths: [scripts/atropos-ribbon-trigger.txt]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Apply Canvas ribbon continuity pass
        run: |
          python scripts/atropos-ribbon-pass.py
          node --check src/atropos-world-devourer-prototype.js
          node scripts/atropos-code-audit.mjs
      - name: Commit ribbon continuity pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-prototype.js
          git commit -m "Rebuild Atropos body as continuous canvas ribbon"
          git push origin HEAD:feature/atropos-world-devourer-prototype
