name: Apply opening balance refinement

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-validate-publish:
    if: github.head_ref == 'agent/first-boss-ranged-multiplicity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/first-boss-ranged-multiplicity
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source and test patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-opening-balance.py
          python3 scripts/patch-multiplicity-targeting.py
          python3 scripts/patch-opening-docs-tests.py
          node scripts/build-fingerprint.mjs
      - name: Verify intended changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'function rangedSpawnChance' src/systems-base.js
          grep -q 'enemy.hp\*=.78' src/boss-catalog.js
          grep -q 'const multiplicityTargets=' src/endgame-balance-expansion.js
          grep -q 'multiplicityTargetId' src/endgame-balance-expansion.js
          grep -q '이온 사슬 같은 연쇄 공격은 제외' src/endgame-balance-expansion.js
          ! grep -q 'multiplicityIon' src/endgame-balance-expansion.js
          grep -q 'first boss relief did not apply' scripts/browser-smoke.mjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
      - name: Run gameplay contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/community-feedback-contract.mjs
          node scripts/polish-contract-check.mjs
          node scripts/endgame-balance-contract.mjs
          node scripts/realm-specials-contract.mjs
          for group in health regen-runtime regen-docs hard prism docs ci; do OWNERSHIP_GROUP="$group" node scripts/source-ownership-contract.mjs; done
      - name: Run browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && break
            sleep .2
          done
          STACKFALL_ALLOW_CONTEXT_SKIP=1 node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/ --result=test-results/opening-balance.json
      - name: Remove migration artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-opening-balance-refinement.yml \
            .github/opening-balance-trigger.txt \
            scripts/patch-opening-balance.py \
            scripts/patch-multiplicity-targeting.py \
            scripts/patch-opening-docs-tests.py
          git diff --check
          test ! -e .github/workflows/apply-opening-balance-refinement.yml
          test ! -e scripts/patch-opening-balance.py
          test ! -e scripts/patch-multiplicity-targeting.py
          test ! -e scripts/patch-opening-docs-tests.py
      - name: Publish validated refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Ease first boss and separate multiplicity targets'
          git push origin HEAD:agent/first-boss-ranged-multiplicity
