name: Remove special effects migration artifacts

on:
  push:
    branches: [agent/rebuild-special-effects]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-special-effects
          fetch-depth: 1
      - name: Remove temporary migration files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            scripts/apply-special-effects-followup.py
            scripts/rebuild-special-effects-followup.patch
            scripts/rebuild-special-effects.patch.b64.*
          )
          existing=()
          for file in "${files[@]}"; do
            [ -e "$file" ] && existing+=("$file")
          done
          if [ ${#existing[@]} -eq 0 ]; then
            echo 'Migration artifacts already removed.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -- "${existing[@]}"
          git commit -m 'Remove special effects migration artifacts'
          git push origin HEAD:agent/rebuild-special-effects
