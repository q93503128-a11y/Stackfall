name: Canonical cleanup gate temp

on:
  push:
    branches:
      - feature/enemy-director-v1

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/enemy-director-v1
          fetch-depth: 0
      - name: Preserve cleanup patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/canonical-cleanup.part* > "$RUNNER_TEMP/canonical-cleanup.b64"
      - name: Rebuild from protected savepoint
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 5baf1ca3fdda7c8f4caba04dc17cc00e33db6fa0
          base64 -d "$RUNNER_TEMP/canonical-cleanup.b64" | xz -d > "$RUNNER_TEMP/canonical-cleanup.patch"
          git apply --check "$RUNNER_TEMP/canonical-cleanup.patch"
          git apply "$RUNNER_TEMP/canonical-cleanup.patch"
          python3 - <<'PY'
          from pathlib import Path

          path=Path('scripts/awakening-runtime-checks.mjs')
          source=path.read_text()
          old="""  const stages=[],activeStages=[...(window.STACKFALL_ACTIVE_STAGE_RUNTIMES||['stage-01'])];
            check(activeStages.length>0,'active Stage runtime list is empty');
            for(const theme of activeStages){
          """
          new="""  const stages=[],activeStages=[...(window.STACKFALL_ACTIVE_STAGE_RUNTIMES||[])];
            if(activeStages.length===0){
              check(window.STACKFALL_STAGE_MODE_ENABLED===false&&window.stackfallHasStageRuntime?.()===false,'sealed Stage runtime state is inconsistent');
            }
            for(const theme of activeStages){
          """
          if old not in source: raise SystemExit('awakening Stage assertion block not found')
          path.write_text(source.replace(old,new,1))

          path=Path('scripts/apex-foundation-browser.mjs')
          source=path.read_text()
          old="""      const partFixture=await probe(`(()=>{const result=stackfallDeveloperTest.defineMultipartFixture([{key:'left',label:'PART A',dx:-155,dy:0,r:38},{key:'shoulder',label:'PART B',dx:0,dy:0,r:54},{key:'right',label:'PART C',dx:155,dy:0,r:38}]);const e=state.entities.enemies.find(x=>x.id===state.apexActiveId);return{result,parts:stackfallBossPartDiagnostics(),sameOwner:e.bodyParts.every(p=>p.owner===e),separateCoordinates:new Set(e.bodyParts.map(p=>String(p.x)+','+String(p.y))).size};})()`);
          """
          new="""      await probe("state.mode='paused'");
                const partFixture=await probe(`(()=>{const result=stackfallDeveloperTest.defineMultipartFixture([{key:'left',label:'PART A',dx:-155,dy:0,r:38},{key:'shoulder',label:'PART B',dx:0,dy:0,r:54},{key:'right',label:'PART C',dx:155,dy:0,r:38}]);const e=state.entities.enemies.find(x=>x.id===state.apexActiveId);return{result,parts:stackfallBossPartDiagnostics(),sameOwner:e.bodyParts.every(p=>p.owner===e),separateCoordinates:new Set(e.bodyParts.map(p=>String(p.x)+','+String(p.y))).size};})()`);
          """
          if old not in source: raise SystemExit('Apex multipart fixture start not found')
          source=source.replace(old,new,1)
          old="""      scenario.observations.attackPaths=attackPaths;check(attackPaths.pierce===1&&attackPaths.rail===1&&attackPaths.mine===1&&attackPaths.blade===1,'piercing, beam, mine or melee path did not route one hit to the shared boss',name);
                await capture(page,join(screenshotDir,'apex-foundation-debug-parts.png')).then(path=>scenario.screenshots.push(path));
          """
          new="""      scenario.observations.attackPaths=attackPaths;check(attackPaths.pierce===1&&attackPaths.rail===1&&attackPaths.mine===1&&attackPaths.blade===1,'piercing, beam, mine or melee path did not route one hit to the shared boss',name);
                await probe("state.mode='playing'");
          """
          if old not in source: raise SystemExit('Apex multipart fixture end not found')
          path.write_text(source.replace(old,new,1))
          PY
          test ! -e src/event-guide-refinement-v1.js
          grep -Fq "EVENT_CLOCK_KEYS=Object.freeze(['vault','crash','void'])" src/map-event-expansion.js
          ! grep -Eq 'drawMapEvents[[:space:]]*=[[:space:]]*function' src/dark-cosmic-polish.js src/build-audit-ui.js src/runtime-controls.js
          node --check scripts/awakening-runtime-checks.mjs
          node --check scripts/apex-foundation-browser.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-fingerprint.mjs
          git diff --check
          grep -Fq 'window.STACKFALL_BUILD_SHA="sha256-1c92a0c42045e0ee28cf6bc52bcdb0d82f816a2e81d48d8f11caecc497ac39f6";' src/build-info.js
      - name: Prepare Chrome wrapper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/stackfall-chrome" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          profile=''
          args=()
          for arg in "$@"; do
            case "$arg" in
              --user-data-dir=*) profile="${arg#--user-data-dir=}"; args+=("$arg") ;;
              --remote-debugging-port=0) args+=("--remote-debugging-port=9223" "--remote-debugging-address=127.0.0.1") ;;
              *) args+=("$arg") ;;
            esac
          done
          args+=("--no-sandbox" "--disable-dev-shm-usage")
          if [[ -n "$profile" ]]; then
            mkdir -p "$profile"
            (for _ in $(seq 1 100); do printf '9223\n' > "$profile/DevToolsActivePort" 2>/dev/null || true; sleep 0.1; done) &
          fi
          exec /usr/bin/google-chrome "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/stackfall-chrome"
      - name: Start local game server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/stackfall-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/stackfall-http.pid"
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep .2
          done
          cat "$RUNNER_TEMP/stackfall-http.log" || true
          exit 1
      - name: Chromium full smoke
        env:
          STACKFALL_CHROME: ${{ runner.temp }}/stackfall-chrome
          STACKFALL_ALLOW_GPU_SKIP: '1'
          STACKFALL_ALLOW_CONTEXT_SKIP: '1'
        run: node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/ --result=test-results/canonical-cleanup-smoke.json
      - name: Publish one clean cleanup commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Canonicalize Endless runtime ownership and documentation"
          git push origin HEAD:refs/heads/feature/enemy-director-v1 --force-with-lease=refs/heads/feature/enemy-director-v1:${{ github.sha }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-cleanup-smoke
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
