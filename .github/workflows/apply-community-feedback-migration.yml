name: Cleanup community feedback migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/community-feedback-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/community-feedback-polish
          fetch-depth: 1
      - name: Remove temporary migration scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-community-feedback.sh scripts/community-patch-*.b64
      - name: Publish cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A scripts
          git diff --cached --quiet && exit 0
          git commit -m 'Remove temporary community migration scripts'
          git push origin HEAD:agent/community-feedback-polish
