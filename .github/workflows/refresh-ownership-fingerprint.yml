name: Refresh ownership asset fingerprint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/include-ownership-fingerprint
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh fingerprint and verify source
        run: |
          set -euo pipefail
          node scripts/build-fingerprint.mjs
          node --check scripts/build-fingerprint.mjs
          node --check src/build-info.js
          node scripts/endgame-balance-contract.mjs
          grep -Fq 'googlea1b39620fd8849c7.html' src/build-info.js
      - name: Commit refreshed build info
        run: |
          set -euo pipefail
          git config user.name 'stackfall-maintenance-bot'
          git config user.email 'stackfall-maintenance-bot@users.noreply.github.com'
          git add scripts/build-fingerprint.mjs src/build-info.js
          git diff --cached --check
          git commit -m 'Include ownership file in build fingerprint'
          git push origin HEAD:agent/include-ownership-fingerprint
