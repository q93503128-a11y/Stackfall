name: Export community polish source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive repository source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' -czf stackfall-community-polish-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: stackfall-community-polish-source
          path: stackfall-community-polish-source.tar.gz
          retention-days: 1
