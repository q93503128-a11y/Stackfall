name: Run eclipse health and performance tuning

on:
  push:
    branches: [agent/eclipse-health-performance-tuning]

permissions:
  contents: write
  statuses: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eclipse-health-performance-tuning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply tuning
        run: |
          set -euo pipefail
          python3 .github/tune_eclipse_health_performance.py
          node scripts/build-fingerprint.mjs
      - name: Syntax and contracts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src scripts functions -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
          node scripts/polish-contract-check.mjs
          node scripts/endgame-balance-contract.mjs
          node scripts/realm-specials-contract.mjs
          node scripts/build-fingerprint.mjs --check
          git diff --check
      - name: Browser smoke
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node scripts/run-live-smoke.mjs --url=http://127.0.0.1:8000/ --result=test-results/eclipse-health-performance-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-health-performance-verification
          path: test-results
          if-no-files-found: warn
      - name: Commit verified tuning
        run: |
          set -euo pipefail
          git config user.name 'stackfall-tuning-bot'
          git config user.email 'stackfall-tuning-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Tune Eclipse Reactor health passives and lag guard'
          git push origin HEAD:agent/eclipse-health-performance-tuning
      - name: Publish success status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'success',context:'stackfall/eclipse-health-performance',description:'tuning verified',target_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
