name: Temporary Stackfall Apex Comprehensive Live QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apex-visual-qa-temp.mjs'
      - '.github/workflows/apex-visual-qa-temp.yml'

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize clean Endless runs and capture Apex cinematics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apex-visual-qa-temp.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = [
            ("async function spawnApex(page,form){\n  const started=", "async function spawnApex(page,form){\n  await evaluate(page,`(()=>{document.querySelector('#devEndlessClean')?.click();return true;})()`);await waitFor(page,`window.stackfallCurrentRunConfig?.()?.mode==='endless'&&state.mode==='playing'`,6000);await prepIdleTest(page);await configureQuietRun(page);\n  const started="),
            ("if(!started)return false;\n  const active=", "if(!started)return false;await sleep(420);await capture(page,`${form}-intro-early`);await sleep(700);await capture(page,`${form}-intro-mid`);\n  const active="),
            ("if(!active)return false;\n  await configureQuietRun(page);", "if(!active){const diagnostic=await evaluate(page,`(()=>({mode:state.mode,time:state.time,pendingApexForm:state.pendingApexForm,apexActiveId:state.apexActiveId,realmTransition:state.realmTransition?{from:state.realmTransition.from,to:state.realmTransition.to,elapsed:state.realmTransition.elapsed,duration:state.realmTransition.duration,midpointDone:state.realmTransition.midpointDone}:null,arena:state.apexArena,enemies:state.entities.enemies.filter(x=>!x.dead).map(x=>({id:x.id,kind:x.kind,eliteForm:x.eliteForm,apexForm:x.apexForm,x:x.x,y:x.y,hp:x.hp,maxHp:x.maxHp}))}))()`);console.log('APEX_SPAWN_DIAGNOSTIC '+JSON.stringify(diagnostic));return false;}\n  await configureQuietRun(page);"),
            ("    if(form==='starforge')check((observations[form].spawn?.r||0)>=100,'starforge: Omega visual body radius is not substantially larger than ordinary bosses');", "    const killed=await evaluate(page,`(()=>{const e=state.entities.enemies.find(x=>!x.dead&&x.id===state.apexActiveId);if(!e)return false;e.hp=1;dealDamage(e,Math.max(1000000000,e.maxHp*10),{source:'dev',canCrit:false});return true;})()`);check(killed,`${form}: defeat trigger failed`);await sleep(100);await capture(page,`${form}-defeat-early`);await sleep(620);await capture(page,`${form}-defeat-late`);observations[form].defeat={triggered:killed,mode:await evaluate(page,`state.mode`),apexActiveId:await evaluate(page,`state.apexActiveId`)};\n    if(form==='starforge')check((observations[form].spawn?.r||0)>=100,'starforge: Omega visual body radius is not substantially larger than ordinary bosses');")
          ]
          for old,new in replacements:
              if old not in text:
                  raise SystemExit('QA patch anchor missing: '+old[:100])
              text = text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Check QA harness syntax
        run: node --check scripts/apex-visual-qa-temp.mjs
      - name: Wait for deployed Apex runtime fingerprint
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^window.STACKFALL_BUILD_SHA="\([^"]*\)";.*/\1/p' src/build-info.js)"
          test -n "$expected"
          for attempt in $(seq 1 72); do
            live="$(curl -fsSL "https://stackfall.pages.dev/src/build-info.js?apexqa=${GITHUB_SHA}-${attempt}" || true)"
            if printf '%s' "$live" | grep -Fq "$expected"; then
              echo "deployed fingerprint matched: $expected"
              exit 0
            fi
            sleep 5
          done
          echo "live deployment did not reach expected fingerprint: $expected" >&2
          exit 1
      - name: Run live Apex visual, idle-pressure, entrance and defeat QA
        env:
          STACKFALL_URL: https://stackfall.pages.dev/
          APEX_QA_DIR: test-results/apex-visual-qa
        run: node scripts/apex-visual-qa-temp.mjs
      - name: Upload Apex QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-live-visual-qa
          path: test-results/apex-visual-qa
          if-no-files-found: error
          retention-days: 5
