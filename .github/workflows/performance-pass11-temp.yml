name: Temporary Stackfall performance pass 11

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-pass11-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate patch script
        run: python -m py_compile scripts/performance-pass11-temp.py
      - name: Apply performance pass 11
        run: python scripts/performance-pass11-temp.py
      - name: Validate optimized runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check src/systems-base.js
          node --check src/systems.js
          node --check src/performance-guard.js
          node --check src/core.js
          node --check src/map-event-expansion.js
          node --check scripts/performance-audit-contract.mjs
          node scripts/performance-audit-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Commit optimized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/systems-base.js src/systems.js src/performance-guard.js src/core.js src/map-event-expansion.js src/build-info.js scripts/performance-audit-contract.mjs
          git diff --cached --check
          git commit -m 'perf: recycle transient effects across pressure and reset paths'
          git push origin HEAD:main
