name: Stage 1 install fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage1-install-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch late visual installation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target=Path('src/stage01-production-art.js')
          text=target.read_text()
          old='setTimeout(installStageOneRebootVisuals,0);'
          new="""setTimeout(installStageOneRebootVisuals,0);
          if(typeof window.addEventListener==='function')window.addEventListener('load',installStageOneRebootVisuals,{once:true});"""
          if old not in text:
              raise SystemExit('expected Stage 1 installer marker missing')
          target.write_text(text.replace(old,new,1))
          Path('.github/workflows/stage1-install-fix-once.yml').unlink()
          PY
          git config user.name 'stackfall-stage1-bot'
          git config user.email 'stackfall-stage1-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Stage 1 reboot visual install timing'
          git push origin HEAD:main
