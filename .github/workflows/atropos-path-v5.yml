name: Atropos path v5

on:
  push:
    branches: [feature/atropos-world-devourer-prototype]
    paths: [scripts/atropos-path-v5-trigger.txt]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Apply path v5
        run: |
          python scripts/atropos-path-v5.py
          node --check src/atropos-world-devourer-prototype.js
          node --check src/atropos-world-devourer-attack-crossing.js
          node --check src/atropos-world-devourer-attack-maw.js
          node --check src/atropos-world-devourer-attack-ring.js
          node --check src/atropos-world-devourer-attack-past.js
          node --check src/atropos-world-devourer-attack-world.js
          node scripts/atropos-code-audit.mjs
      - name: Commit path v5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-prototype.js
          git commit -m "Fix Atropos idle path and visual corner smoothing"
          git push origin HEAD:feature/atropos-world-devourer-prototype
