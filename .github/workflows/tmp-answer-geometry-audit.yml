name: tmp-answer-geometry-audit
on:
  push:
    branches: [feature/void-apex-answer-v1]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.head_commit.message == 'Audit Answer clean body history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
          fetch-depth: 0
      - name: Locate prior clean Answer assets
        shell: bash
        run: |
          set -euo pipefail
          echo '=== files in history matching answer body ==='
          git log --all --name-only --pretty=format: | grep -E 'answer.*(body|v15|v16)|void-apex-answer' | sort -u | head -200 || true
          echo '=== commits mentioning Answer body revisions ==='
          git log --all --oneline --decorate --grep='Answer\|응답\|V15\|V16' -i | head -120 || true
          echo '=== candidate historical asset hashes/sizes ==='
          for rev in $(git rev-list --all -- assets/answer/answer_body_v16.b64 | head -30); do
            bytes=$(git show "$rev:assets/answer/answer_body_v16.b64" 2>/dev/null | tr -d '\r\n' | base64 -d 2>/dev/null | wc -c || true)
            hash=$(git show "$rev:assets/answer/answer_body_v16.b64" 2>/dev/null | tr -d '\r\n' | base64 -d 2>/dev/null | sha256sum | cut -d' ' -f1 || true)
            echo "$rev bytes=$bytes sha=$hash"
          done
