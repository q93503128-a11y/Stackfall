name: Apply final gameplay polish v2

on:
  push:
    branches:
      - agent/stackfall-final-gameplay-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stackfall-final-gameplay-polish
          fetch-depth: 0
      - name: Rebuild verified patch
        run: |
          cat .github/patch-parts/00 .github/patch-parts/01 .github/patch-parts/02 .github/patch-parts/03 .github/patch-parts/04exact .github/patch-parts/05 | base64 -d | gzip -d > /tmp/apply.py
          test "$(sha256sum /tmp/apply.py | cut -d' ' -f1)" = "15bef22e58dcc7c5cbabb115645c99bb62ce24dfe0f18050566da194cecb40cf"
          test "$(sha256sum .github/patch-repair.py | cut -d' ' -f1)" = "69bb20b04a83900b7e2adbc0a8346e4ee58f900cfb375e4e7cd023479cb217ff"
          python .github/patch-repair.py /tmp/apply.py
          python -m py_compile /tmp/apply.py
          test "$(sha256sum /tmp/apply.py | cut -d' ' -f1)" = "fe59b508a38a59eb99012f8549c107127294b709a7f909be5cffd35ca937b402"
      - name: Apply source changes
        run: python /tmp/apply.py
      - name: Refresh deployed asset fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Syntax checks
        run: |
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          git diff --check
      - name: Browser smoke
        run: |
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          STACKFALL_URL=http://127.0.0.1:8000 STACKFALL_ALLOW_CONTEXT_SKIP=1 node scripts/browser-smoke.mjs
      - name: Remove temporary patch files
        run: rm -rf .github/patch-parts .github/patch-repair.py .github/gameplay-patch-trigger .github/workflows/apply-final-gameplay-polish.yml .github/workflows/apply-final-gameplay-polish-v2.yml
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Overhaul apex encounters and event visuals"
          git push origin HEAD:agent/stackfall-final-gameplay-polish
