name: Apply final gameplay polish

on:
  push:
    branches:
      - agent/stackfall-final-gameplay-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-gameplay-polish
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stackfall-final-gameplay-polish
          fetch-depth: 0
      - name: Rebuild verified patch
        run: |
          cat .github/patch-parts/00 .github/patch-parts/01 .github/patch-parts/02 .github/patch-parts/03 .github/patch-parts/04 .github/patch-parts/05 | base64 -d | gzip -d > /tmp/apply.py
          python -m py_compile /tmp/apply.py
          test "$(sha256sum /tmp/apply.py | cut -d' ' -f1)" = "15bef22e58dcc7c5cbabb115645c99bb62ce24dfe0f18050566da194cecb40cf"
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/apply.py')
          text=p.read_text()
          replacements=[]
          old_render='''replace_js_function('src/render-space.js','startRealmTransition',"""function startRealmTransition(target,options={}){clearPendingCombatActions();state.realmTransition={from:state.realmTheme||'space',to:target,elapsed:0,duration:options.duration||2.2,title:options.title||'',subtitle:options.subtitle||'',introStyle:options.introStyle||null,seed:Math.random()*TAU,onMidpoint:options.onMidpoint||null,onComplete:options.onComplete||null,midpointDone:false};state.mode='cinematic';ui.touch.classList.add('hidden');state.hitStop=0;state.camera.shake=0;}""")'''
          new_render='''replace_once('src/render-space.js',"function startRealmTransition(target,options={}){clearPendingCombatActions();state.realmTransition={from:state.realmTheme||'space',to:target,elapsed:0,duration:options.duration||2.2,title:options.title||'',subtitle:options.subtitle||'',onMidpoint:options.onMidpoint||null,onComplete:options.onComplete||null,midpointDone:false};state.mode='cinematic';ui.touch.classList.add('hidden');state.hitStop=0;state.camera.shake=0;}","function startRealmTransition(target,options={}){clearPendingCombatActions();state.realmTransition={from:state.realmTheme||'space',to:target,elapsed:0,duration:options.duration||2.2,title:options.title||'',subtitle:options.subtitle||'',introStyle:options.introStyle||null,seed:Math.random()*TAU,onMidpoint:options.onMidpoint||null,onComplete:options.onComplete||null,midpointDone:false};state.mode='cinematic';ui.touch.classList.add('hidden');state.hitStop=0;state.camera.shake=0;}")'''
          replacements.append((old_render,new_render))
          replacements.append(("text=text.rstrip()+append_design+'\\n'","text=text.rstrip()+'\\n'+append_design.strip()+'\\n'"))
          replacements.append(("clearFieldForApex(form);const radius=compactDevice()?318:486;state.apexArena={x:player.x,y:player.y,r:radius,form,createdAt:state.apexClock||0};const title=bossName(form),duration=form==='starforge'?3.75:form==='chronophage'?3.35:3.55;","clearFieldForApex(form);const radius=compactDevice()?318:486,apexArena={x:player.x,y:player.y,r:radius,form,createdAt:state.apexClock||0};const title=bossName(form),duration=form==='starforge'?3.75:form==='chronophage'?3.35:3.55;"))
          old_call="startRealmTransition(apexTheme(form),{duration,title,subtitle:form==='chronophage'?'CHRONOLOGY OVERRIDDEN':form==='starforge'?'TERMINAL FURNACE IGNITION':'THE SKY FORGETS ITS NAME',introStyle:form,onMidpoint:()=>{const e=spawnEnemy('apex');if(!e)return;const arena=state.apexArena;e.eliteForm=form;e.apexForm=form;e.name=title;e.color=BOSS_STATS[form].color;e.timeLock=0;if(form==='starforge'){e.speed=0;e.x=arena.x;e.y=arena.y-arena.r*.24;}else if(form==='chronophage'){e.speed*=.82;e.x=arena.x+arena.r*.24;e.y=arena.y-arena.r*.10;}else{e.speed=Math.max(72,e.speed*1.65);e.x=arena.x-arena.r*.42;e.y=arena.y;}state.apexActiveId=e.id;state.apexCount++;state.nextApexAt=(state.apexCount+1)*APEX_INTERVAL_SECONDS;},onComplete:()=>{state.pendingApexForm=null;}});return true;"
          new_call="startRealmTransition(apexTheme(form),{duration,title,subtitle:form==='chronophage'?'CHRONOLOGY OVERRIDDEN':form==='starforge'?'TERMINAL FURNACE IGNITION':'THE SKY FORGETS ITS NAME',introStyle:form,onMidpoint:()=>{const e=spawnEnemy('apex');if(!e)return;const arena=state.apexArena;e.eliteForm=form;e.apexForm=form;e.name=title;e.color=BOSS_STATS[form].color;e.timeLock=0;if(form==='starforge'){e.speed=0;e.x=arena.x;e.y=arena.y-arena.r*.24;}else if(form==='chronophage'){e.speed*=.82;e.x=arena.x+arena.r*.24;e.y=arena.y-arena.r*.10;}else{e.speed=Math.max(72,e.speed*1.65);e.x=arena.x-arena.r*.42;e.y=arena.y;}state.apexActiveId=e.id;state.apexCount++;state.nextApexAt=(state.apexCount+1)*APEX_INTERVAL_SECONDS;},onComplete:()=>{state.pendingApexForm=null;}});state.apexArena=apexArena;return true;"
          replacements.append((old_call,new_call))
          old_update="if(state.apexActiveId||state.pendingApexForm||String(state.realmTransition?.to||'').startsWith('apex-'))return true;const due=(state.apexClock||0)>=(state.nextApexAt||APEX_INTERVAL_SECONDS);if(!due)return false;if(!forceApexPriority())return false;return beginApexEncounter();"
          new_update="if(state.apexActiveId||state.pendingApexForm||String(state.realmTransition?.to||'').startsWith('apex-'))return true;const due=(state.apexClock||0)>=(state.nextApexAt||APEX_INTERVAL_SECONDS);if(!due)return false;if(!forceApexPriority())return false;const started=beginApexEncounter();if(started&&!state.apexArena){const form=state.pendingApexForm||'chronophage';state.apexArena={x:player.x,y:player.y,r:compactDevice()?318:486,form,createdAt:state.apexClock||0};}return started;"
          replacements.append((old_update,new_update))
          for old,new in replacements:
              if text.count(old)!=1:
                  raise SystemExit('expected repair target count was not exactly one')
              text=text.replace(old,new,1)
          p.write_text(text)
          PY
          python -m py_compile /tmp/apply.py
          test "$(sha256sum /tmp/apply.py | cut -d' ' -f1)" = "fe59b508a38a59eb99012f8549c107127294b709a7f909be5cffd35ca937b402"
      - name: Apply source changes
        run: python /tmp/apply.py
      - name: Refresh deployed asset fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Syntax checks
        run: |
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          git diff --check
      - name: Browser smoke
        run: |
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          STACKFALL_URL=http://127.0.0.1:8000 STACKFALL_ALLOW_CONTEXT_SKIP=1 node scripts/browser-smoke.mjs
      - name: Remove temporary patch files
        run: rm -rf .github/patch-parts .github/patch-error.log .github/syntax-error.log .github/smoke-error.log .github/workflows/apply-final-gameplay-polish.yml
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Overhaul apex encounters and event visuals"
          git push origin HEAD:agent/stackfall-final-gameplay-polish
