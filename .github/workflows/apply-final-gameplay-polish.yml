name: Apply final gameplay polish

on:
  push:
    branches:
      - agent/stackfall-final-gameplay-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-gameplay-polish
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stackfall-final-gameplay-polish
          fetch-depth: 0
      - name: Rebuild patch
        run: |
          cat .github/patch-parts/* | base64 -d | gzip -d > /tmp/apply.py
          python -m py_compile /tmp/apply.py
          test "$(sha256sum /tmp/apply.py | cut -d' ' -f1)" = "baf1a394f3ea2dcbc47308a1515eb281c029ebf7c601500c7e98ef3dbdb0e631"
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/apply.py')
          text=p.read_text()
          old_guard="if 'projectileTexture' in read('src/gpu-renderer.js'):\n    raise RuntimeError('legacy projectileTexture reference remains')"
          new_guard="if re.search(r'(?<![A-Za-z0-9_$])projectileTexture(?![A-Za-z0-9_$])',read('src/gpu-renderer.js')):\n    raise RuntimeError('legacy projectileTexture reference remains')"
          old_render='''replace_js_function('src/render-space.js','startRealmTransition',"""function startRealmTransition(target,options={}){clearPendingCombatActions();state.realmTransition={from:state.realmTheme||'space',to:target,elapsed:0,duration:options.duration||2.2,title:options.title||'',subtitle:options.subtitle||'',introStyle:options.introStyle||null,seed:Math.random()*TAU,onMidpoint:options.onMidpoint||null,onComplete:options.onComplete||null,midpointDone:false};state.mode='cinematic';ui.touch.classList.add('hidden');state.hitStop=0;state.camera.shake=0;}""")'''
          new_render='''replace_once('src/render-space.js',"function startRealmTransition(target,options={}){clearPendingCombatActions();state.realmTransition={from:state.realmTheme||'space',to:target,elapsed:0,duration:options.duration||2.2,title:options.title||'',subtitle:options.subtitle||'',onMidpoint:options.onMidpoint||null,onComplete:options.onComplete||null,midpointDone:false};state.mode='cinematic';ui.touch.classList.add('hidden');state.hitStop=0;state.camera.shake=0;}","function startRealmTransition(target,options={}){clearPendingCombatActions();state.realmTransition={from:state.realmTheme||'space',to:target,elapsed:0,duration:options.duration||2.2,title:options.title||'',subtitle:options.subtitle||'',introStyle:options.introStyle||null,seed:Math.random()*TAU,onMidpoint:options.onMidpoint||null,onComplete:options.onComplete||null,midpointDone:false};state.mode='cinematic';ui.touch.classList.add('hidden');state.hitStop=0;state.camera.shake=0;}")'''
          old_docs="text=text.rstrip()+append_design+'\\n'"
          new_docs="text=text.rstrip()+'\\n'+append_design.strip()+'\\n'"
          for old,new,label in ((old_guard,new_guard,'renderer guard'),(old_render,new_render,'realm transition replacement'),(old_docs,new_docs,'design EOF')):
              if old not in text:
                  raise SystemExit(f'expected {label} not found')
              text=text.replace(old,new,1)
          p.write_text(text)
          PY
          python -m py_compile /tmp/apply.py
          test "$(sha256sum /tmp/apply.py | cut -d' ' -f1)" = "eddba3e457bf112e78ab25253aee690f2348d13d96f52098bf04d5c897bee91b"
      - name: Apply source changes
        run: |
          set +e
          python /tmp/apply.py >/tmp/apply.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/apply.log .github/patch-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/patch-error.log
            git commit -m "Report gameplay patch failure" -- .github/patch-error.log
            git push origin HEAD:agent/stackfall-final-gameplay-polish
            cat /tmp/apply.log
            exit "$status"
          fi
      - name: Remove temporary patch files
        run: rm -rf .github/patch-parts .github/patch-error.log .github/syntax-error.log .github/smoke-error.log .github/workflows/apply-final-gameplay-polish.yml
      - name: Refresh deployed asset fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Syntax checks
        run: |
          set +e
          { find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check; git diff --check; } >/tmp/syntax.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p .github
            cp /tmp/syntax.log .github/syntax-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f .github/syntax-error.log
            git commit -m "Report gameplay syntax failure" -- .github/syntax-error.log
            git push origin HEAD:agent/stackfall-final-gameplay-polish
            cat /tmp/syntax.log
            exit "$status"
          fi
      - name: Browser smoke
        run: |
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          set +e
          STACKFALL_URL=http://127.0.0.1:8000 STACKFALL_ALLOW_CONTEXT_SKIP=1 node scripts/browser-smoke.mjs >/tmp/smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p .github
            cp /tmp/smoke.log .github/smoke-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f .github/smoke-error.log
            git commit -m "Report gameplay smoke failure" -- .github/smoke-error.log
            git push origin HEAD:agent/stackfall-final-gameplay-polish
            cat /tmp/smoke.log
            exit "$status"
          fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Overhaul apex encounters and event visuals"
          git push origin HEAD:agent/stackfall-final-gameplay-polish
