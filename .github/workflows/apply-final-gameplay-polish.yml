name: Apply final gameplay polish

on:
  push:
    branches:
      - agent/stackfall-final-gameplay-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-gameplay-polish
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stackfall-final-gameplay-polish
          fetch-depth: 0
      - name: Rebuild patch
        run: |
          cat .github/patch-parts/* | base64 -d | gzip -d > /tmp/apply.py
          python -m py_compile /tmp/apply.py
          test "$(sha256sum /tmp/apply.py | cut -d' ' -f1)" = "baf1a394f3ea2dcbc47308a1515eb281c029ebf7c601500c7e98ef3dbdb0e631"
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/apply.py')
          text=p.read_text()
          replacements=[]
          replacements.append(("if 'projectileTexture' in read('src/gpu-renderer.js'):\n    raise RuntimeError('legacy projectileTexture reference remains')","if re.search(r'(?<![A-Za-z0-9_$])projectileTexture(?![A-Za-z0-9_$])',read('src/gpu-renderer.js')):\n    raise RuntimeError('legacy projectileTexture reference remains')",'renderer guard'))
          replacements.append(('''replace_js_function('src/render-space.js','startRealmTransition',"""function startRealmTransition(target,options={}){clearPendingCombatActions();state.realmTransition={from:state.realmTheme||'space',to:target,elapsed:0,duration:options.duration||2.2,title:options.title||'',subtitle:options.subtitle||'',introStyle:options.introStyle||null,seed:Math.random()*TAU,onMidpoint:options.onMidpoint||null,onComplete:options.onComplete||null,midpointDone:false};state.mode='cinematic';ui.touch.classList.add('hidden');state.hitStop=0;state.camera.shake=0;}""")''','''replace_once('src/render-space.js',"function startRealmTransition(target,options={}){clearPendingCombatActions();state.realmTransition={from:state.realmTheme||'space',to:target,elapsed:0,duration:options.duration||2.2,title:options.title||'',subtitle:options.subtitle||'',onMidpoint:options.onMidpoint||null,onComplete:options.onComplete||null,midpointDone:false};state.mode='cinematic';ui.touch.classList.add('hidden');state.hitStop=0;state.camera.shake=0;}","function startRealmTransition(target,options={}){clearPendingCombatActions();state.realmTransition={from:state.realmTheme||'space',to:target,elapsed:0,duration:options.duration||2.2,title:options.title||'',subtitle:options.subtitle||'',introStyle:options.introStyle||null,seed:Math.random()*TAU,onMidpoint:options.onMidpoint||null,onComplete:options.onComplete||null,midpointDone:false};state.mode='cinematic';ui.touch.classList.add('hidden');state.hitStop=0;state.camera.shake=0;}")''','realm transition replacement'))
          replacements.append(("text=text.rstrip()+append_design+'\\n'","text=text.rstrip()+'\\n'+append_design.strip()+'\\n'",'design EOF'))
          replacements.append(("clearFieldForApex(form);const radius=compactDevice()?318:486;state.apexArena={x:player.x,y:player.y,r:radius,form,createdAt:state.apexClock||0};const title=bossName(form),duration=form==='starforge'?3.75:form==='chronophage'?3.35:3.55;","clearFieldForApex(form);const radius=compactDevice()?318:486,apexArena={x:player.x,y:player.y,r:radius,form,createdAt:state.apexClock||0};const title=bossName(form),duration=form==='starforge'?3.75:form==='chronophage'?3.35:3.55;",'apex arena setup'))
          old_call="startRealmTransition(apexTheme(form),{duration,title,subtitle:form==='chronophage'?'CHRONOLOGY OVERRIDDEN':form==='starforge'?'TERMINAL FURNACE IGNITION':'THE SKY FORGETS ITS NAME',introStyle:form,onMidpoint:()=>{const e=spawnEnemy('apex');if(!e)return;const arena=state.apexArena;e.eliteForm=form;e.apexForm=form;e.name=title;e.color=BOSS_STATS[form].color;e.timeLock=0;if(form==='starforge'){e.speed=0;e.x=arena.x;e.y=arena.y-arena.r*.24;}else if(form==='chronophage'){e.speed*=.82;e.x=arena.x+arena.r*.24;e.y=arena.y-arena.r*.10;}else{e.speed=Math.max(72,e.speed*1.65);e.x=arena.x-arena.r*.42;e.y=arena.y;}state.apexActiveId=e.id;state.apexCount++;state.nextApexAt=(state.apexCount+1)*APEX_INTERVAL_SECONDS;},onComplete:()=>{state.pendingApexForm=null;}});return true;"
          new_call="startRealmTransition(apexTheme(form),{duration,title,subtitle:form==='chronophage'?'CHRONOLOGY OVERRIDDEN':form==='starforge'?'TERMINAL FURNACE IGNITION':'THE SKY FORGETS ITS NAME',introStyle:form,onMidpoint:()=>{const e=spawnEnemy('apex');if(!e)return;const arena=state.apexArena;e.eliteForm=form;e.apexForm=form;e.name=title;e.color=BOSS_STATS[form].color;e.timeLock=0;if(form==='starforge'){e.speed=0;e.x=arena.x;e.y=arena.y-arena.r*.24;}else if(form==='chronophage'){e.speed*=.82;e.x=arena.x+arena.r*.24;e.y=arena.y-arena.r*.10;}else{e.speed=Math.max(72,e.speed*1.65);e.x=arena.x-arena.r*.42;e.y=arena.y;}state.apexActiveId=e.id;state.apexCount++;state.nextApexAt=(state.apexCount+1)*APEX_INTERVAL_SECONDS;},onComplete:()=>{state.pendingApexForm=null;}});state.apexArena=apexArena;return true;"
          replacements.append((old_call,new_call,'apex arena persistence'))
          for old,new,label in replacements:
              if old not in text:
                  raise SystemExit(f'expected {label} not found')
              text=text.replace(old,new,1)
          p.write_text(text)
          PY
          python -m py_compile /tmp/apply.py
          test "$(sha256sum /tmp/apply.py | cut -d' ' -f1)" = "29aecda210e14b1365ebe1894311c8507b547f278d786c87f94e8e14627cd665"
      - name: Apply source changes
        run: |
          set +e
          python /tmp/apply.py >/tmp/apply.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/apply.log .github/patch-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/patch-error.log
            git commit -m "Report gameplay patch failure" -- .github/patch-error.log
            git push origin HEAD:agent/stackfall-final-gameplay-polish
            cat /tmp/apply.log
            exit "$status"
          fi
      - name: Remove temporary patch files
        run: rm -rf .github/patch-parts .github/patch-error.log .github/syntax-error.log .github/smoke-error.log .github/workflows/apply-final-gameplay-polish.yml
      - name: Refresh deployed asset fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Syntax checks
        run: |
          set +e
          { find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check; git diff --check; } >/tmp/syntax.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p .github
            cp /tmp/syntax.log .github/syntax-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f .github/syntax-error.log
            git commit -m "Report gameplay syntax failure" -- .github/syntax-error.log
            git push origin HEAD:agent/stackfall-final-gameplay-polish
            cat /tmp/syntax.log
            exit "$status"
          fi
      - name: Browser smoke
        run: |
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          set +e
          STACKFALL_URL=http://127.0.0.1:8000 STACKFALL_ALLOW_CONTEXT_SKIP=1 node scripts/browser-smoke.mjs >/tmp/smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p .github
            cp /tmp/smoke.log .github/smoke-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f .github/smoke-error.log
            git commit -m "Report gameplay smoke failure" -- .github/smoke-error.log
            git push origin HEAD:agent/stackfall-final-gameplay-polish
            cat /tmp/smoke.log
            exit "$status"
          fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Overhaul apex encounters and event visuals"
          git push origin HEAD:agent/stackfall-final-gameplay-polish
