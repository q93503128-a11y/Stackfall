name: Apply final gameplay polish

on:
  push:
    branches:
      - agent/stackfall-final-gameplay-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-gameplay-polish
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stackfall-final-gameplay-polish
          fetch-depth: 0
      - name: Rebuild patch
        run: |
          cat .github/patch-parts/* | base64 -d | gzip -d > /tmp/apply.py
          python -m py_compile /tmp/apply.py
          test "$(sha256sum /tmp/apply.py | cut -d' ' -f1)" = "baf1a394f3ea2dcbc47308a1515eb281c029ebf7c601500c7e98ef3dbdb0e631"
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/apply.py')
          text=p.read_text()
          old="if 'projectileTexture' in read('src/gpu-renderer.js'):\n    raise RuntimeError('legacy projectileTexture reference remains')"
          new="if re.search(r'(?<![A-Za-z0-9_$])projectileTexture(?![A-Za-z0-9_$])',read('src/gpu-renderer.js')):\n    raise RuntimeError('legacy projectileTexture reference remains')"
          if old not in text:
              raise SystemExit('expected renderer guard not found')
          p.write_text(text.replace(old,new,1))
          PY
          python -m py_compile /tmp/apply.py
          test "$(sha256sum /tmp/apply.py | cut -d' ' -f1)" = "15bef22e58dcc7c5cbabb115645c99bb62ce24dfe0f18050566da194cecb40cf"
      - name: Apply source changes
        run: |
          set +e
          python /tmp/apply.py >/tmp/apply.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/apply.log .github/patch-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/patch-error.log
            git commit -m "Report gameplay patch failure"
            git push origin HEAD:agent/stackfall-final-gameplay-polish
            cat /tmp/apply.log
            exit "$status"
          fi
      - name: Remove temporary patch files
        run: rm -rf .github/patch-parts .github/patch-error.log .github/workflows/apply-final-gameplay-polish.yml
      - name: Refresh deployed asset fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Syntax checks
        run: |
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          git diff --check
      - name: Browser smoke
        run: |
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          STACKFALL_URL=http://127.0.0.1:8000 STACKFALL_ALLOW_CONTEXT_SKIP=1 node scripts/browser-smoke.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Overhaul apex encounters and event visuals"
          git push origin HEAD:agent/stackfall-final-gameplay-polish
