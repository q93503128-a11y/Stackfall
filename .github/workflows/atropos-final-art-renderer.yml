name: Atropos final art renderer patch

on:
  push:
    branches:
      - feature/atropos-world-devourer-prototype
    paths:
      - .github/workflows/atropos-final-art-renderer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Wire final art variants into the serpent renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected 1 match, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          p='src/atropos-world-devourer-prototype.js'
          one(p,
              "// Atropos world-devourer prototype v3 — world-anchored serpent, continuous body and stable depth layers.\n// Branch-only visual/movement prototype. Attack rework and final swallow entrance are intentionally deferred.\n(()=>{\n  const VERSION='atropos-world-devourer-prototype-v3';",
              "// Atropos World Devourer — world-anchored serpent with continuous body, stable depth layers and final-art vector plates.\n// The combat branch remains a prototype until visual review and player approval; these assets are the first final-art pass.\n(()=>{\n  const VERSION='atropos-world-devourer-final-art-pass-v1';"
          )
          one(p,
              "  const art={head:new Image(),body:new Image(),tail:new Image()};\n  art.head.decoding=art.body.decoding=art.tail.decoding='async';\n  art.head.src='assets/atropos-head.svg';\n  art.body.src='assets/atropos-segment.svg';\n  art.tail.src='assets/atropos-tail.svg';",
              "  const art={head:new Image(),body:[new Image(),new Image(),new Image()],tail:new Image()};\n  art.head.decoding=art.tail.decoding='async';for(const img of art.body)img.decoding='async';\n  art.head.src='assets/atropos-head.svg';\n  art.body[0].src='assets/atropos-segment.svg';art.body[1].src='assets/atropos-segment-b.svg';art.body[2].src='assets/atropos-segment-c.svg';\n  art.tail.src='assets/atropos-tail.svg';"
          )
          one(p,
              "    const depthScale=lerp(.90,1.10,(p.depth+1)*.5);",
              "    const depthScale=lerp(.88,1.12,(p.depth+1)*.5);"
          )
          one(p,
              "      if(i>=4&&i%2===0)continue;\n      drawSprite(art.body,p,245*p.taper*p.scaleUnit,90*p.taper*p.scaleUnit,.80*alpha,.035,i%4===3);",
              "      if(i>=5&&i%3===0)continue;\n      const bodyArt=art.body[(i*5+Math.floor(i/2))%art.body.length],bodyGlow=layer==='front'?.045:.025;\n      drawSprite(bodyArt,p,245*p.taper*p.scaleUnit,90*p.taper*p.scaleUnit,.84*alpha,bodyGlow,i%5===3);"
          )
          one(p,
              "assets:{head:art.head.complete&&art.head.naturalWidth>1,body:art.body.complete&&art.body.naturalWidth>1,tail:art.tail.complete&&art.tail.naturalWidth>1}",
              "assets:{head:art.head.complete&&art.head.naturalWidth>1,body:art.body.every(img=>img.complete&&img.naturalWidth>1),bodyVariants:art.body.map(img=>img.complete&&img.naturalWidth>1),tail:art.tail.complete&&art.tail.naturalWidth>1}"
          )

          q='scripts/atropos-visual-audit.mjs'
          one(q,
              "  await waitFor(`window.stackfallAtroposPrototypeAttackState==='directed-six-pattern-cycle-v1'`,15000);",
              "  await waitFor(`window.stackfallAtroposPrototypeAttackState==='directed-six-pattern-cycle-v1'`,15000);\n  await waitFor(`(()=>{const a=window.stackfallAtroposArtDiagnostics?.().assets;return !!(a?.head&&a?.body&&a?.tail);})()`,15000);"
          )
          PY
          node --check src/atropos-world-devourer-prototype.js
          node --check scripts/atropos-visual-audit.mjs
          git diff --check
      - name: Commit renderer final-art pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-prototype.js scripts/atropos-visual-audit.mjs
          git commit -m "Wire final-art variants into Atropos renderer"
          git push origin HEAD:feature/atropos-world-devourer-prototype
