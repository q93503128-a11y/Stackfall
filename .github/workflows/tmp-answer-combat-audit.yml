name: tmp-answer-combat-audit
on:
  push:
    branches: [feature/void-apex-answer-v1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
      - name: Audit Answer integration points
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Answer loader ==='
          grep -RIn --exclude-dir=.git -E 'void-apex-answer|STACKFALL_VOID_APEX_ANSWER|stackfallVoidApexAnswer' . | head -n 220 || true
          echo '=== apex stat literals/contracts ==='
          grep -RIn --exclude-dir=.git -E '7\.60|2\.15|6\.46|1\.83' src scripts docs README.md | head -n 220 || true
          echo '=== damage / shield ==='
          grep -RIn --exclude-dir=.git -E 'hurtPlayerCore|registerPlayerDamageInterceptor|function hurtPlayer\(' src | head -n 120 || true
