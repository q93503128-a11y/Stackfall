name: Cleanup 10 dead-event audit temp

on:
  push:
    branches:
      - cleanup10-dead-event-validation

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup10-dead-event-validation
          fetch-depth: 0
      - name: Audit deprecated event residue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          {
            echo '# Cleanup 10 deprecated-event residue audit'
            echo
            echo "HEAD: $(git rev-parse HEAD)"
            echo
            echo '## Canonical active IDs'
            grep -RInE --exclude-dir=.git --exclude='cleanup10-audit-temp.yml' "(vault|crash|void)" src scripts index.html README.md docs 2>/dev/null | head -n 120 || true
            echo
            echo '## All deprecated-token matches'
            grep -RInEi --exclude-dir=.git --exclude='cleanup10-audit-temp.yml' "distress|meteor|predator|relay|storm" src scripts index.html README.md docs 2>/dev/null || true
            echo
            echo '## Quoted exact deprecated IDs'
            grep -RInE --exclude-dir=.git --exclude='cleanup10-audit-temp.yml' "['\"](distress|meteor|predator|relay|storm)['\"]" src scripts index.html README.md docs 2>/dev/null || true
            echo
            echo '## mapEvent / event type context'
            grep -RInEi --exclude-dir=.git --exclude='cleanup10-audit-temp.yml' "(mapEvent|event|worldEvent|WORLD_EVENT|type).{0,80}(distress|meteor|predator|relay|storm)|(distress|meteor|predator|relay|storm).{0,80}(mapEvent|event|worldEvent|WORLD_EVENT|type)" src scripts index.html README.md docs 2>/dev/null || true
            echo
            echo '## Localization-like keys/context'
            grep -RInEi --exclude-dir=.git --exclude='cleanup10-audit-temp.yml' "(distress|meteor|predator|relay|storm).{0,80}(name|title|desc|description|label|warning|event)|(?:name|title|desc|description|label|warning|event).{0,80}(distress|meteor|predator|relay|storm)" src index.html README.md docs 2>/dev/null || true
          } | tee audit/cleanup10-residue.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cleanup10-dead-event-audit
          path: audit/cleanup10-residue.txt
