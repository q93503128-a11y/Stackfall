name: Verify current gameplay polish

on:
  push:
    branches:
      - agent/stackfall-final-gameplay-polish
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stackfall-final-gameplay-polish
          fetch-depth: 0
      - name: Refresh deployed asset fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: JavaScript and diff checks
        run: |
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          git diff --check
      - name: Browser gameplay smoke
        run: |
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          STACKFALL_URL=http://127.0.0.1:8000 STACKFALL_ALLOW_CONTEXT_SKIP=1 node scripts/browser-smoke.mjs
      - name: Remove temporary implementation files
        run: |
          rm -rf .github/patch-parts
          rm -f .github/patch-repair.py .github/apply-error.log .github/gameplay-patch-trigger
          rm -f .github/workflows/apply-final-gameplay-polish.yml
          rm -f .github/workflows/apply-final-gameplay-polish-v2.yml
          rm -f .github/workflows/verify-current-gameplay-polish.yml
      - name: Commit verified gameplay polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize apex encounters and event visuals"
          git push origin HEAD:agent/stackfall-final-gameplay-polish
