name: Answer Asset Audit

on:
  push:
    branches:
      - feature/void-apex-answer-v1
    paths:
      - .github/workflows/answer-asset-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/void-apex-answer-v1
      - name: Inspect answer body container
        shell: bash
        run: |
          set +e
          echo '--- ls/file ---'
          ls -l assets/answer/answer_body_base.webp
          file assets/answer/answer_body_base.webp
          echo '--- header ---'
          xxd -l 96 assets/answer/answer_body_base.webp
          echo '--- ffprobe ---'
          command -v ffprobe && ffprobe -v error -show_streams -show_format assets/answer/answer_body_base.webp
          echo '--- imagemagick ---'
          command -v identify && identify -verbose assets/answer/answer_body_base.webp | head -80
          echo '--- pillow feature/decode ---'
          python3 -m pip install pillow --quiet
          python3 - <<'PY'
          from PIL import Image, features
          p='assets/answer/answer_body_base.webp'
          print('PIL_WEBP', features.check('webp'))
          try:
              im=Image.open(p)
              print('PIL_OPEN',im.format,im.size,im.mode,getattr(im,'n_frames',1))
              im=im.convert('RGBA')
              print('PIL_CONVERT_OK')
          except Exception as e:
              print('PIL_FAIL',type(e).__name__,repr(e))
          PY
