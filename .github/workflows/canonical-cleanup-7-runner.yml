name: Canonical cleanup 7 runner
on:
  push:
    branches: [validation/canonical-cleanup-7]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded ownership transform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('.validation/canonical-cleanup-7-transform.mjs')
          s=p.read_text()
          s=s.replace(r"\`player-damage-${STACKFALL_PLAYER_DAMAGE_INTERCEPTORS.length}\`", "'player-damage-'+STACKFALL_PLAYER_DAMAGE_INTERCEPTORS.length")
          s=s.replace(r"\`weapon-update-${STACKFALL_WEAPON_UPDATE_INTERCEPTORS.length}\`", "'weapon-update-'+STACKFALL_WEAPON_UPDATE_INTERCEPTORS.length")
          pattern=r"const anchor=.*?;\nexpect\(contract\.includes\(anchor\),'runtime ownership contract anchor missing'\);"
          replacement="const anchor=\"enemy update feature layers register interceptors instead of replacing updateEnemies\";\nconst anchorPos=contract.indexOf(anchor);expect(anchorPos>=0,'runtime ownership contract anchor missing');const anchorStart=contract.lastIndexOf('\\n',anchorPos)+1,anchorEnd=contract.indexOf('\\n',anchorPos),anchorLine=contract.slice(anchorStart,anchorEnd);"
          s,n=re.subn(pattern,lambda _: replacement,s,count=1)
          assert n==1, 'failed to rewrite ownership contract anchor guard'
          s=s.replace('contract=contract.replace(anchor,anchor+extra);','contract=contract.replace(anchorLine,anchorLine+extra);')
          s=s.replace("for(const path of changed){const text=read(path);", "for(const path of changed.filter(path=>path.endsWith('.js'))){const text=read(path);")
          p.write_text(s)
          PY
          node .validation/canonical-cleanup-7-transform.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/runtime-ownership-contract.mjs')
          s=p.read_text()
          anchor="const buildInfo=read('src/build-info.js');"
          assert anchor in s
          aggregate="const allRuntimeSource=fs.readdirSync('src').filter(name=>name.endsWith('.js')).map(name=>read('src/'+name)).join('\\n');"
          if aggregate not in s:
              s=s.replace(anchor,anchor+'\n'+aggregate,1)
          p.write_text(s)
          PY
      - name: Check transformed ownership surface
        shell: bash
        run: |
          set -euo pipefail
          ! grep -REn --include='*.js' '\bhurtPlayer\s*=\s*function\b' src
          ! grep -REn --include='*.js' '\bupdateWeapons\s*=\s*function\b' src
          node --check src/bosses.js
          node --check src/weapons.js
          node --check src/dev-tools.js
          node --check src/endless-progression-v2.js
          node --check src/reward-refinement.js
          node --check src/endgame-balance-expansion.js
          node --check src/weapon-awakening-effects-a1-a7.js
          node --check src/weapon-awakening-effects-a8-a13.js
          node --check src/weapon-awakening-effects-a14-a19.js
          node --check src/player-hit-invulnerability-v2.js
          node --check src/combat-balance-refinement.js
          node scripts/runtime-ownership-contract.mjs
      - name: Validate full source and write build fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/stackfall-http.log 2>&1 &
          echo $! > /tmp/stackfall-http.pid
          for i in {1..40}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/stackfall-http.log
          exit 1
      - name: Chromium full smoke
        env:
          STACKFALL_ALLOW_GPU_SKIP: '0'
          STACKFALL_ALLOW_CONTEXT_SKIP: '0'
        run: node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/?dev=1
      - name: Persist validated source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .validation
          rm -f .github/workflows/canonical-cleanup-7-inspect.yml .github/workflows/canonical-cleanup-7-runner.yml
          git config user.name 'Stackfall validation bot'
          git config user.email 'stackfall-validation@users.noreply.github.com'
          git add src scripts .github/workflows
          git status --short
          git commit -m 'Persist validated canonical cleanup 7 [skip ci]'
          git push origin HEAD:validation/canonical-cleanup-7
