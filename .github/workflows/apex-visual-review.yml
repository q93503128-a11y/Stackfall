name: Apex visual review
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apex-visual-review.mjs'
      - '.github/workflows/apex-visual-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare Chrome wrapper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/stackfall-chrome" <<'EOF'
          #!/usr/bin/env bash
          profile=''
          args=()
          for arg in "$@"; do
            case "$arg" in
              --user-data-dir=*) profile="${arg#--user-data-dir=}"; args+=("$arg") ;;
              --remote-debugging-port=0) args+=("--remote-debugging-port=9224" "--remote-debugging-address=127.0.0.1") ;;
              *) args+=("$arg") ;;
            esac
          done
          if [[ -n "$profile" ]]; then mkdir -p "$profile"; (for _ in $(seq 1 100); do printf '9224\n' > "$profile/DevToolsActivePort" 2>/dev/null || true; sleep .1; done) & fi
          exec /usr/bin/google-chrome "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/stackfall-chrome"
      - name: Capture Apex motion frames
        env:
          STACKFALL_CHROME: ${{ runner.temp }}/stackfall-chrome
        run: node scripts/apex-visual-review.mjs
      - name: Upload review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-visual-review
          path: test-results/apex-visual-review
          if-no-files-found: error
