name: Atropos past ribbon patch

on:
  push:
    branches:
      - feature/atropos-world-devourer-prototype
    paths:
      - .github/workflows/atropos-past-ribbon-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Replace segmented echo body with continuous tapered ribbon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from base64 import b64decode
          old=b64decode('').decode()
          new=b64decode('').decode()
          p=Path('src/atropos-world-devourer-attack-past.js')
          text=p.read_text(encoding='utf-8')
          if text.count(old)!=1: raise SystemExit(f'expected one drawGhost block, got {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check src/atropos-world-devourer-attack-past.js
          git diff --check
      - name: Commit temporal ribbon refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-attack-past.js
          git commit -m "Render Past Trajectory echo as a continuous ribbon"
          git push origin HEAD:feature/atropos-world-devourer-prototype
