name: Apply Stackfall gameplay polish

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stackfall-apex-pacing-ui-polish
    paths:
      - '.tmp-polish/**'
      - '.github/workflows/apply-gameplay-polish.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/stackfall-apex-pacing-ui-polish
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and apply exact patch
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            if grep -q "resumeAfterLedger=!wasPaused" src/ability-ledger-audit.js; then
              echo 'Gameplay polish is already applied.'
              node scripts/build-fingerprint.mjs
              exit 0
            fi
            cat .tmp-polish/part* | base64 -d > .tmp-polish/apply-gameplay-polish.mjs
            python3 - <<'PY'
          from pathlib import Path
          path=Path('.tmp-polish/apply-gameplay-polish.mjs')
          text=path.read_text()
          helper="""function replaceFunctionBlock(path,startName,nextName,replacement){
            const text=read(path),startCandidates=[`  function ${startName}(`,`function ${startName}(`],nextCandidates=[`  function ${nextName}`,`function ${nextName}`];
            const start=startCandidates.map(marker=>text.indexOf(marker)).find(index=>index>=0);
            if(start===undefined)throw new Error(`${path}: missing function ${startName}`);
            let next=-1,nextMarker='';for(const marker of nextCandidates){const index=text.indexOf(marker,start+1);if(index>=0&&(next<0||index<next)){next=index;nextMarker=marker;}}
            if(next<0)throw new Error(`${path}: missing following function ${nextName}`);
            write(path,text.slice(0,start)+replacement+text.slice(next+nextMarker.length));
          }
          """
          anchor='function appendOnce(path,marker,block){\n'
          if text.count(anchor)!=1:
              raise SystemExit('appendOnce anchor missing')
          text=text.replace(anchor,helper+anchor,1)
          old="replaceRegex('src/build-audit-ui.js',/  function drawVaultGate\\(p,t\\)\\{[\\s\\S]*?\\n  \\}\\n  function drawCrashBeacon/,\n"
          new="replaceFunctionBlock('src/dark-cosmic-polish.js','drawVaultGate','drawCrashBeacon',\n"
          if text.count(old)!=1:
              raise SystemExit('vault replacement call missing')
          text=text.replace(old,new,1)
          apex_old="replaceOne('src/build-audit-ui.js','e.apexForm=form;state.apexActiveId=e.id;'"
          apex_new="replaceOne('src/dark-cosmic-polish.js','e.apexForm=form;state.apexActiveId=e.id;'"
          if text.count(apex_old)!=1:
              raise SystemExit('apex entrance replacement call missing')
          text=text.replace(apex_old,apex_new,1)
          passive="replaceOne('src/map-event-expansion.js',\"grantRandomPassives(2);finishChoice('crash');\",\"const entries=grantRandomPassives(2);showUpgradeNotice('우주선 회수',entries);finishChoice('crash');\");"
          weapon="replaceOne('src/map-event-expansion.js',\"grantRandomWeapon(2)||grantRandomPassives(2);finishChoice('crash');\",\"const weapon=grantRandomWeapon(2),entries=weapon?[weapon]:grantRandomPassives(2);showUpgradeNotice('무기 공명',entries);finishChoice('crash');\");"
          if text.count(passive+'\n'+weapon)!=1:
              raise SystemExit('crash reward replacement order missing')
          path.write_text(text.replace(passive+'\n'+weapon,weapon+'\n'+passive,1))
          PY
            node --check .tmp-polish/apply-gameplay-polish.mjs
            node .tmp-polish/apply-gameplay-polish.mjs
            python3 - <<'PY'
          from pathlib import Path
          path=Path('src/weapons.js')
          text=path.read_text()
          typo='shake:ke:false'
          if text.count(typo)!=1:
              raise SystemExit(f'expected one nova option typo, found {text.count(typo)}')
          path.write_text(text.replace(typo,'shake:false',1))
          PY
            node scripts/build-fingerprint.mjs
          } 2>&1 | tee /tmp/apply-polish.log
      - name: Upload application failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apply-polish-failure
          path: /tmp/apply-polish.log
          if-no-files-found: error
      - name: Check source and gameplay contracts
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            while IFS= read -r -d '' file; do echo "checking $file"; node --check "$file"; done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
            node scripts/polish-contract-check.mjs
            test -s summ.png
          } 2>&1 | tee /tmp/polish-contract.log
      - name: Upload contract failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: polish-contract-failure
          path: /tmp/polish-contract.log
          if-no-files-found: error
      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/stackfall-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node scripts/browser-smoke.mjs --url=http://127.0.0.1:8000/ --result=test-results/polish-smoke.json
      - name: Commit verified implementation
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            rm -rf .tmp-polish
            git config user.name 'stackfall-maintenance-bot'
            git config user.email 'stackfall-maintenance-bot@users.noreply.github.com'
            git add -A
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'No implementation changes to commit.'
              exit 0
            fi
            git commit -m 'Polish combat pacing and reward UX'
            git push origin HEAD:agent/stackfall-apex-pacing-ui-polish
          } 2>&1 | tee /tmp/polish-finalize.log
      - name: Upload finalize failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: polish-finalize-failure
          path: /tmp/polish-finalize.log
          if-no-files-found: error
