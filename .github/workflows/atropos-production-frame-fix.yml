name: Atropos production frame fix

on:
  push:
    branches: [feature/atropos-world-devourer-prototype]
    paths: [scripts/atropos-production-frame-fix.py]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - run: python scripts/atropos-production-frame-fix.py
      - run: |
          node --check src/atropos-production-art-data.js
          node --check src/atropos-world-devourer-prototype.js
          node --check src/atropos-world-devourer-attack-past.js
          node --check src/atropos-world-devourer-attack-world.js
          node scripts/atropos-code-audit.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-prototype.js
          git commit -m "Align Atropos production atlas frames"
          git push origin HEAD:feature/atropos-world-devourer-prototype
