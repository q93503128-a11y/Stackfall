name: Temporary Answer V4 Validation

on:
  push:
    branches: [feature/void-apex-answer-v1]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Answer V4 patch
        run: python3 scripts/temp-answer-v4.py
      - name: Check Answer JavaScript syntax
        run: node --check src/void-apex-answer-v1.js
      - name: Validate contracts and regenerate fingerprint
        run: node scripts/build-fingerprint.mjs
      - name: Commit validated Answer V4 revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stackfall-ci'
          git config user.email 'stackfall-ci@users.noreply.github.com'
          git add src/void-apex-answer-v1.js scripts/void-apex-answer-contract.mjs src/build-info.js
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'Rebuild Answer lighting and add pre-fight XP preparation'
          git push origin HEAD:feature/void-apex-answer-v1
