name: One-shot three-event canon QA
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: npm install --no-save playwright-core@1.56.1
      - name: Start local Stackfall
        run: |
          python3 -m http.server 8000 >/tmp/stackfall-three-event-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify three-event canon and UI
        run: node scripts/tmp-three-event-qa.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stackfall-three-event-qa
          path: test-results/three-event-qa
          if-no-files-found: warn
          retention-days: 2
