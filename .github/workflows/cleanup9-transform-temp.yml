name: Cleanup 9 transform temp

on:
  push:
    branches:
      - cleanup9-runtime-ownership-validation

permissions:
  contents: write

jobs:
  transform:
    if: github.event.head_commit.message == 'Temp: install Cleanup 9 transformer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup9-runtime-ownership-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonicalize Cleanup 9 ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8')
          def replace_once(path,old,new):
              text=read(path)
              count=text.count(old)
              if count!=1: raise SystemExit(f'{path}: expected one exact match, found {count}: {old[:100]!r}')
              write(path,text.replace(old,new,1))
          def sub_once(path,pattern,repl,flags=0):
              text=read(path)
              new,count=re.subn(pattern,repl,text,count=1,flags=flags)
              if count!=1: raise SystemExit(f'{path}: expected one regex match, found {count}: {pattern[:120]!r}')
              write(path,new)

          # updatePlayer: systems.js owns the dispatcher/core.
          replace_once('src/systems.js','function updatePlayer(dt){',"const STACKFALL_PLAYER_UPDATE_INTERCEPTORS=[];\nfunction registerPlayerUpdateInterceptor(name,handler){if(typeof name!=='string'||!name||typeof handler!=='function')throw new TypeError('Invalid updatePlayer interceptor');STACKFALL_PLAYER_UPDATE_INTERCEPTORS.push({name,handler});}\nfunction runPlayerUpdateInterceptor(index,dt){if(index<0)return updatePlayerCore(dt);const entry=STACKFALL_PLAYER_UPDATE_INTERCEPTORS[index];return entry.handler((nextDt=dt)=>runPlayerUpdateInterceptor(index-1,nextDt),dt);}\nfunction updatePlayerCore(dt){")
          replace_once('src/systems.js',"  if(typeof updateMapEventPlayer==='function')updateMapEventPlayer(dt);\n}\nfunction updateHomingProjectile", "  if(typeof updateMapEventPlayer==='function')updateMapEventPlayer(dt);\n}\nfunction updatePlayer(dt){return runPlayerUpdateInterceptor(STACKFALL_PLAYER_UPDATE_INTERCEPTORS.length-1,dt);}\nfunction updateHomingProjectile")

          replace_once('src/progression-expansion.js',"  const baseUpdatePlayer=updatePlayer;\n  updatePlayer=function progressionPlayer(dt){baseUpdatePlayer(dt);const n=stat('regen');if(n&&dt>0)player.hp=Math.min(player.maxHp,player.hp+n*dt);};", "  registerPlayerUpdateInterceptor('progression-expansion.js:progressionPlayer',function progressionPlayer(next,dt){next(dt);const n=stat('regen');if(n&&dt>0)player.hp=Math.min(player.maxHp,player.hp+n*dt);});")
          replace_once('src/endgame-balance-expansion.js',"  const baseUpdatePlayer=updatePlayer;\n  updatePlayer=function endgameBarrierPlayer(dt){baseUpdatePlayer(dt);if(state.weaponAugments?.bulwark){const n=Math.max(1,weaponCount('bulwark')),profile=bulwarkAugmentShieldProfile(n);player.augmentBarrierTimer=(player.augmentBarrierTimer??7.5)-dt;if(player.augmentBarrierTimer<=0){player.augmentBarrierTimer=profile.interval;if(rechargeShield(profile.periodicGain,profile.cap)>0)shockwave(player.x,player.y,'#9dffe2',72+n*3,.24,1.7);}}};", "  registerPlayerUpdateInterceptor('endgame-balance-expansion.js:endgameBarrierPlayer',function endgameBarrierPlayer(next,dt){next(dt);if(state.weaponAugments?.bulwark){const n=Math.max(1,weaponCount('bulwark')),profile=bulwarkAugmentShieldProfile(n);player.augmentBarrierTimer=(player.augmentBarrierTimer??7.5)-dt;if(player.augmentBarrierTimer<=0){player.augmentBarrierTimer=profile.interval;if(rechargeShield(profile.periodicGain,profile.cap)>0)shockwave(player.x,player.y,'#9dffe2',72+n*3,.24,1.7);}}});")
          replace_once('src/apex-reward-balance-v1.js',"  if(typeof updatePlayer==='function'){\n    const baseUpdatePlayerApexCore=updatePlayer;\n    updatePlayer=function apexCoreMovementSpeed(dt){\n      const baseSpeed=player.speed,mult=coreMultiplier();\n      player.speed=baseSpeed*mult;\n      try{return baseUpdatePlayerApexCore(dt);}finally{player.speed=baseSpeed;}\n    };\n  }", "  if(typeof registerPlayerUpdateInterceptor==='function'){\n    registerPlayerUpdateInterceptor('apex-reward-balance-v1.js:apexCoreMovementSpeed',function apexCoreMovementSpeed(next,dt){\n      const baseSpeed=player.speed,mult=coreMultiplier();\n      player.speed=baseSpeed*mult;\n      try{return next(dt);}finally{player.speed=baseSpeed;}\n    });\n  }")
          replace_once('src/endless-progression.js',"  let liveAchievementPoll=0;\n  const baseAchievementUpdatePlayer=updatePlayer;\n  updatePlayer=function endlessAchievementUpdatePlayer(dt){\n    baseAchievementUpdatePlayer(dt);if(state.mode!=='playing'||!isEndless())return;liveAchievementPoll-=dt;if(liveAchievementPoll>0)return;liveAchievementPoll=.4;\n    const completed=evaluateAchievements(snapshotRun());if(!completed.length)return;showAchievementToasts(completed);renderAchievementUi();renderEndlessProfile();window.renderStackfallMetaUi?.();\n  };", "  let liveAchievementPoll=0;\n  registerPlayerUpdateInterceptor('endless-progression.js:endlessAchievementUpdatePlayer',function endlessAchievementUpdatePlayer(next,dt){\n    next(dt);if(state.mode!=='playing'||!isEndless())return;liveAchievementPoll-=dt;if(liveAchievementPoll>0)return;liveAchievementPoll=.4;\n    const completed=evaluateAchievements(snapshotRun());if(!completed.length)return;showAchievementToasts(completed);renderAchievementUi();renderEndlessProfile();window.renderStackfallMetaUi?.();\n  });")
          replace_once('src/endless-progression-v2.js',"  const baseUpdatePlayer=updatePlayer;\n  updatePlayer=function achievementUpdatePlayer(dt){const result=baseUpdatePlayer(dt);if(state.mode!=='playing'||!isEndless())return result;poll-=dt;if(poll>0)return result;poll=.35;ensureBossAttempt();const rows=evaluateAchievements(snapshotRun());if(rows.length){renderEndlessProfile();window.renderStackfallMetaUi?.();}return result;};", "  registerPlayerUpdateInterceptor('endless-progression-v2.js:achievementUpdatePlayer',function achievementUpdatePlayer(next,dt){const result=next(dt);if(state.mode!=='playing'||!isEndless())return result;poll-=dt;if(poll>0)return result;poll=.35;ensureBossAttempt();const rows=evaluateAchievements(snapshotRun());if(rows.length){renderEndlessProfile();window.renderStackfallMetaUi?.();}return result;});")

          # rollChoices: interface.js owns base/dispatcher; feature-pack is a terminal replacement and endgame is the later wrapper.
          replace_once('src/interface.js','function rollChoices(n){',"const STACKFALL_ROLL_CHOICES_INTERCEPTORS=[];\nfunction registerRollChoicesInterceptor(name,handler){if(typeof name!=='string'||!name||typeof handler!=='function')throw new TypeError('Invalid rollChoices interceptor');STACKFALL_ROLL_CHOICES_INTERCEPTORS.push({name,handler});}\nfunction runRollChoicesInterceptor(index,n){if(index<0)return rollChoicesCore(n);const entry=STACKFALL_ROLL_CHOICES_INTERCEPTORS[index];return entry.handler((nextN=n)=>runRollChoicesInterceptor(index-1,nextN),n);}\nfunction rollChoicesCore(n){")
          replace_once('src/interface.js','return out;}\nfunction selectChoice(c){','return out;}\nfunction rollChoices(n){return runRollChoicesInterceptor(STACKFALL_ROLL_CHOICES_INTERCEPTORS.length-1,n);}\nfunction selectChoice(c){')
          sub_once('src/feature-pack.js',r"rollChoices=function rollChoicesWithBasicCore\(n\)\{(.*?)\n\};\n\nfunction sf2SlotMarkup",lambda m:"registerRollChoicesInterceptor('feature-pack.js:rollChoicesWithBasicCore',function rollChoicesWithBasicCore(_next,n){"+m.group(1)+"\n});\n\nfunction sf2SlotMarkup",re.S)
          replace_once('src/endgame-balance-expansion.js',"  const baseRollChoices=rollChoices;\n  rollChoices=function balancedRollChoices(n){const rolled=baseRollChoices(Math.max(n,12)).filter(choice=>!(choice.kind==='passive'&&PASSIVES[choice.key]?.eventOnly&&window.stackfallIsFeatureUnlocked?.('multiplicity-protocol')!==true)).filter(choice=>choice.kind!=='passive'||!window.stackfallIsPassiveChoiceUnlocked||window.stackfallIsPassiveChoiceUnlocked(choice.key));return rolled.slice(0,n);};", "  registerRollChoicesInterceptor('endgame-balance-expansion.js:balancedRollChoices',function balancedRollChoices(next,n){const rolled=next(Math.max(n,12)).filter(choice=>!(choice.kind==='passive'&&PASSIVES[choice.key]?.eventOnly&&window.stackfallIsFeatureUnlocked?.('multiplicity-protocol')!==true)).filter(choice=>choice.kind!=='passive'||!window.stackfallIsPassiveChoiceUnlocked||window.stackfallIsPassiveChoiceUnlocked(choice.key));return rolled.slice(0,n);});")

          # spawnCoreShot: weapons.js owns base/dispatcher. Full replacements register as terminal interceptors.
          replace_once('src/weapons.js','function spawnCoreShot(target,echoed=false){',"const STACKFALL_CORE_SHOT_INTERCEPTORS=[];\nfunction registerCoreShotInterceptor(name,handler){if(typeof name!=='string'||!name||typeof handler!=='function')throw new TypeError('Invalid spawnCoreShot interceptor');STACKFALL_CORE_SHOT_INTERCEPTORS.push({name,handler});}\nfunction runCoreShotInterceptor(index,target,echoed=false){if(index<0)return spawnCoreShotCore(target,echoed);const entry=STACKFALL_CORE_SHOT_INTERCEPTORS[index];return entry.handler((nextTarget=target,nextEchoed=echoed)=>runCoreShotInterceptor(index-1,nextTarget,nextEchoed),target,echoed);}\nfunction spawnCoreShotCore(target,echoed=false){")
          replace_once('src/weapons.js',"  spawnPlayerProjectile({x:player.x,y:player.y,vx:Math.cos(a)*CORE_PULSE_SPEED,vy:Math.sin(a)*CORE_PULSE_SPEED,r:CORE_PULSE_RADIUS,life:1.3,maxRange:range,damage:corePulseDamage(weaponCount('core'))*(echoed?.72:1),color:echoed?COLORS.pink:'#d7f8ff',pierce:weaponCount('core')>=4?1:0,source:echoed?'core-echo':'core'});\n}\nfunction fireEmber", "  spawnPlayerProjectile({x:player.x,y:player.y,vx:Math.cos(a)*CORE_PULSE_SPEED,vy:Math.sin(a)*CORE_PULSE_SPEED,r:CORE_PULSE_RADIUS,life:1.3,maxRange:range,damage:corePulseDamage(weaponCount('core'))*(echoed?.72:1),color:echoed?COLORS.pink:'#d7f8ff',pierce:weaponCount('core')>=4?1:0,source:echoed?'core-echo':'core'});\n}\nfunction spawnCoreShot(target,echoed=false){return runCoreShotInterceptor(STACKFALL_CORE_SHOT_INTERCEPTORS.length-1,target,echoed);}\nfunction fireEmber")
          sub_once('src/feature-pack.js',r"spawnCoreShot=function spawnStackedCoreShot\(target,echoed=false\)\{(.*?)\n\};\n\nrenderStarterOptions=",lambda m:"registerCoreShotInterceptor('feature-pack.js:spawnStackedCoreShot',function spawnStackedCoreShot(_next,target,echoed=false){"+m.group(1)+"\n});\n\nrenderStarterOptions=",re.S)
          replace_once('src/reward-refinement.js',"  const rrSpawnCore=spawnCoreShot;spawnCoreShot=function(target,echoed=false){\n    rrSpawnCore(target,echoed);\n    if(state.weaponAugments.core&&!echoed&&player.coreVolley%5===0){\n      for(let i=0;i<10;i++){const a=i*TAU/10;spawnPlayerProjectile({x:player.x,y:player.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,r:4.2,life:.9,damage:10+weaponCount('core')*2.2,color:'#eafcff',pierce:1,source:'core-nova'});}\n      shockwave(player.x,player.y,'#eafcff',105,.32,3);\n    }\n  };", "  registerCoreShotInterceptor('reward-refinement.js:rewardCoreShot',function rewardCoreShot(next,target,echoed=false){\n    next(target,echoed);\n    if(state.weaponAugments.core&&!echoed&&player.coreVolley%5===0){\n      for(let i=0;i<10;i++){const a=i*TAU/10;spawnPlayerProjectile({x:player.x,y:player.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,r:4.2,life:.9,damage:10+weaponCount('core')*2.2,color:'#eafcff',pierce:1,source:'core-nova'});}\n      shockwave(player.x,player.y,'#eafcff',105,.32,3);\n    }\n  });")
          sub_once('src/combat-guidance-refinement.js',r"  spawnCoreShot=function rangedCoreVolley\(target,echoed=false\)\{(.*?)\}\n  fireEmber=",lambda m:"  registerCoreShotInterceptor('combat-guidance-refinement.js:rangedCoreVolley',function rangedCoreVolley(_next,target,echoed=false){"+m.group(1)+"}\n  );\n  fireEmber=",re.S)
          sub_once('src/endgame-balance-expansion.js',r"  const baseSpawnCoreShot=spawnCoreShot;spawnCoreShot=function multiplicityCore\(target,echoed=false\)\{(.*?)\};\n  const baseFireEmber",lambda m:"  registerCoreShotInterceptor('endgame-balance-expansion.js:multiplicityCore',function multiplicityCore(next,target,echoed=false){"+m.group(1).replace('baseSpawnCoreShot(target,echoed);','next(target,echoed);')+"});\n  const baseFireEmber",re.S)
          def awakening_repl(m):
              body=m.group(1).replace('baseSpawnCoreShot(target,echoed)','next(target,echoed)')
              return "  // A1 — Stellar Core: every Core Pulse is replaced by one central stellar lance plus three satellite lances.\n  registerCoreShotInterceptor('weapon-awakening-effects-a1-a7.js:stellarCoreShot',function stellarCoreShot(next,target,echoed=false){"+body+"\n  });\n\n  // A2"
          sub_once('src/weapon-awakening-effects-a1-a7.js',r"  // A1 — Stellar Core: every Core Pulse is replaced by one central stellar lance plus three satellite lances\.\n  const baseSpawnCoreShot=spawnCoreShot;\n  spawnCoreShot=function stellarCoreShot\(target,echoed=false\)\{(.*?)\n  \};\n\n  // A2",awakening_repl,re.S)

          # addText: systems-base.js owns base/dispatcher; feature-pack keeps the current setting gate as a captured-base interceptor.
          replace_once('src/systems-base.js',"function addText(x,y,text,color='#fff',size=13){if(state.entities.texts.length>=entityCap('texts'))recycleTextEffect(state.entities.texts.shift());state.entities.texts.push(acquireTextEffect(x,y,text,color,size));}", "const STACKFALL_ADD_TEXT_INTERCEPTORS=[];\nfunction registerAddTextInterceptor(name,handler){if(typeof name!=='string'||!name||typeof handler!=='function')throw new TypeError('Invalid addText interceptor');STACKFALL_ADD_TEXT_INTERCEPTORS.push({name,handler});}\nfunction runAddTextInterceptor(index,args){if(index<0)return addTextCore(...args);const entry=STACKFALL_ADD_TEXT_INTERCEPTORS[index];return entry.handler((...nextArgs)=>runAddTextInterceptor(index-1,nextArgs),...args);}\nfunction addTextCore(x,y,text,color='#fff',size=13){if(state.entities.texts.length>=entityCap('texts'))recycleTextEffect(state.entities.texts.shift());state.entities.texts.push(acquireTextEffect(x,y,text,color,size));}\nfunction addText(...args){return runAddTextInterceptor(STACKFALL_ADD_TEXT_INTERCEPTORS.length-1,args);}")
          replace_once('src/feature-pack.js',"const sf2BaseAddText=addText;\naddText=function addTextWithSetting(...args){\n  if(GAME_SETTINGS.damageNumbers!==false)sf2BaseAddText(...args);\n};", "registerAddTextInterceptor('feature-pack.js:addTextWithSetting',function addTextWithSetting(next,...args){\n  if(GAME_SETTINGS.damageNumbers!==false)next(...args);\n});")

          # Ownership contract: canonical owners plus zero late replacements anywhere in source.
          contract='scripts/runtime-ownership-contract.mjs'
          marker="\nlet failures=0;"
          additions="""
expect('player update dispatch has one canonical owner with captured-base interceptor semantics',systems.includes('const STACKFALL_PLAYER_UPDATE_INTERCEPTORS=[]')&&systems.includes('function registerPlayerUpdateInterceptor(name,handler)')&&systems.includes('function updatePlayerCore(dt)')&&systems.includes('function updatePlayer(dt){return runPlayerUpdateInterceptor'));
expect('player update feature layers register interceptors instead of replacing updatePlayer',!replaces(allRuntimeSource,'updatePlayer')&&allRuntimeSource.includes("registerPlayerUpdateInterceptor('progression-expansion.js:progressionPlayer'")&&allRuntimeSource.includes("registerPlayerUpdateInterceptor('endgame-balance-expansion.js:endgameBarrierPlayer'")&&allRuntimeSource.includes("registerPlayerUpdateInterceptor('apex-reward-balance-v1.js:apexCoreMovementSpeed'")&&allRuntimeSource.includes("registerPlayerUpdateInterceptor('endless-progression.js:endlessAchievementUpdatePlayer'")&&allRuntimeSource.includes("registerPlayerUpdateInterceptor('endless-progression-v2.js:achievementUpdatePlayer'"));
expect('choice roll dispatch has one canonical owner with captured-base interceptor semantics',interfaceSource.includes('const STACKFALL_ROLL_CHOICES_INTERCEPTORS=[]')&&interfaceSource.includes('function registerRollChoicesInterceptor(name,handler)')&&interfaceSource.includes('function rollChoicesCore(n)')&&interfaceSource.includes('function rollChoices(n){return runRollChoicesInterceptor'));
expect('choice roll layers register interceptors instead of replacing rollChoices',!replaces(allRuntimeSource,'rollChoices')&&allRuntimeSource.includes("registerRollChoicesInterceptor('feature-pack.js:rollChoicesWithBasicCore'")&&allRuntimeSource.includes("registerRollChoicesInterceptor('endgame-balance-expansion.js:balancedRollChoices'"));
expect('core shot dispatch has one canonical owner with captured-base interceptor semantics',weapons.includes('const STACKFALL_CORE_SHOT_INTERCEPTORS=[]')&&weapons.includes('function registerCoreShotInterceptor(name,handler)')&&weapons.includes('function spawnCoreShotCore(target,echoed=false)')&&weapons.includes('function spawnCoreShot(target,echoed=false){return runCoreShotInterceptor'));
expect('core shot layers register interceptors instead of replacing spawnCoreShot',!replaces(allRuntimeSource,'spawnCoreShot')&&allRuntimeSource.includes("registerCoreShotInterceptor('feature-pack.js:spawnStackedCoreShot'")&&allRuntimeSource.includes("registerCoreShotInterceptor('reward-refinement.js:rewardCoreShot'")&&allRuntimeSource.includes("registerCoreShotInterceptor('combat-guidance-refinement.js:rangedCoreVolley'")&&allRuntimeSource.includes("registerCoreShotInterceptor('endgame-balance-expansion.js:multiplicityCore'")&&allRuntimeSource.includes("registerCoreShotInterceptor('weapon-awakening-effects-a1-a7.js:stellarCoreShot'"));
expect('effect text dispatch has one canonical owner with captured-base interceptor semantics',base.includes('const STACKFALL_ADD_TEXT_INTERCEPTORS=[]')&&base.includes('function registerAddTextInterceptor(name,handler)')&&base.includes('function addTextCore(')&&base.includes('function addText(...args){return runAddTextInterceptor'));
expect('effect text setting layer registers instead of replacing addText',!replaces(allRuntimeSource,'addText')&&allRuntimeSource.includes("registerAddTextInterceptor('feature-pack.js:addTextWithSetting'"));
"""
          text=read(contract)
          if marker not in text: raise SystemExit('runtime ownership marker missing')
          write(contract,text.replace(marker,'\n'+additions+marker,1))

          # Strong residual audit: the four entry points may only be canonical declarations, never `name=function` replacements.
          sources='\n'.join(p.read_text(encoding='utf-8') for p in Path('src').glob('*.js'))
          for name in ['updatePlayer','rollChoices','spawnCoreShot','addText']:
              hits=re.findall(rf'\b{name}\s*=\s*function\b',sources)
              if hits: raise SystemExit(f'residual replacement for {name}: {len(hits)}')
          PY
      - name: Validate transformed tree
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src -type f -name '*.js' -print0 | sort -z)
          node scripts/runtime-ownership-contract.mjs
          node scripts/build-fingerprint.mjs
          git diff --check
      - name: Commit validated production tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cleanup9-transform-temp.yml
          git add src scripts
          git diff --cached --check
          git config user.name coworkaccount
          git config user.email cyp1jhh2@gmail.com
          git commit -m 'Validate Cleanup 9 runtime ownership tree'
          git push origin HEAD:cleanup9-runtime-ownership-validation
