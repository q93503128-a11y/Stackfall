name: Answer V12 framing patch
on:
  push:
    branches: [feature/void-apex-answer-v1]
    paths: [scripts/patch-answer-v12.mjs, .github/workflows/answer-v12-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/void-apex-answer-v1, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/patch-answer-v12.mjs
      - run: node scripts/build-fingerprint.mjs
      - run: git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/void-apex-answer-v1.js scripts/void-apex-answer-contract.mjs src/build-info.js
          git commit -m "Anchor Answer body by visible alpha mass"
          git push origin HEAD:feature/void-apex-answer-v1
