name: Endless progression browser QA

on:
  push:
    branches: [main]
    paths:
      - 'src/endless-progression.js'
      - 'src/meta-progression.js'
      - 'src/dev-tools-endless.js'
      - 'scripts/build-fingerprint.mjs'
      - 'scripts/endless-progression-browser-qa.mjs'
      - '.github/workflows/endless-progression-browser-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact deployed progression sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            src/endless-progression.js
            src/meta-progression.js
            src/dev-tools-endless.js
            src/runtime-controls.js
            src/meta-upgrades.js
            src/weapon-awakening.js
          )
          for attempt in $(seq 1 32); do
            ok=1
            for file in "${files[@]}"; do
              expected=$(sha256sum "$file" | awk '{print $1}')
              tmp=$(mktemp)
              if ! curl -fsS "https://stackfall.pages.dev/${file}?endless-qa=${GITHUB_SHA}-${attempt}" -o "$tmp"; then
                ok=0
                rm -f "$tmp"
                break
              fi
              actual=$(sha256sum "$tmp" | awk '{print $1}')
              rm -f "$tmp"
              if [ "$actual" != "$expected" ]; then
                ok=0
                break
              fi
            done
            if [ "$ok" -eq 1 ]; then
              echo "all progression sources matched deployed bytes on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: deployed progression sources not current"
            sleep 15
          done
          echo "deployed progression sources did not match current main bytes" >&2
          exit 1
      - name: Run live progression QA
        env:
          STACKFALL_CHROME: /usr/bin/google-chrome
          STACKFALL_QA_DIR: test-results/endless-progression-qa
        run: node scripts/endless-progression-browser-qa.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endless-progression-browser-qa
          path: test-results/endless-progression-qa
          if-no-files-found: warn
