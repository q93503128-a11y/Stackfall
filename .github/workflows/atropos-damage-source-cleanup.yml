name: Atropos damage source cleanup

on:
  push:
    branches:
      - feature/atropos-world-devourer-prototype
    paths:
      - .github/workflows/atropos-damage-source-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Remove legacy player max HP damage expressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected 1 match, got {count}: {old!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          def all_matches(path, old, new, expected):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != expected: raise SystemExit(f'{path}: expected {expected} matches, got {count}: {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          damage='src/atropos-world-devourer-damage.js'
          one(damage,
              "  const apexBaseDamage=e=>Math.max(7,(Number(e?.damage)||0)*.40);\n  function worldDevourerDamage(e){\n    if(!e||e.apexForm!=='chronophage'||!e.atroposReborn?.worldDevourer)return null;\n    const s=e.atroposReborn.worldDevourer,d=apexBaseDamage(e);\n    if(s.worldDevourPrototype)return d*1.75;\n    if(s.pastPrototype)return d*.92;\n    if(s.ringPrototype)return d*1.10;\n    if(s.mawPrototype)return d*1.35;\n    if(s.tailSeverPrototype)return d*(s.tailSeverPrototype.scarResolved?.72:1.05);\n    if(s.crossingPrototype)return d*.95;\n    return null;\n  }",
              "  const apexBaseDamage=e=>Math.max(7,(Number(e?.damage)||0)*.40);\n  const DAMAGE_MULTIPLIERS=Object.freeze({giantCrossing:.95,tailSever:1.05,tailRupture:.72,voidMaw:1.35,devourerRing:1.10,pastTrajectory:.92,worldDevour:1.75});\n  const patternDamage=(e,key)=>apexBaseDamage(e)*(DAMAGE_MULTIPLIERS[key]??1);\n  window.stackfallAtroposPatternDamage=patternDamage;\n  function worldDevourerDamage(e){\n    if(!e||e.apexForm!=='chronophage'||!e.atroposReborn?.worldDevourer)return null;\n    const s=e.atroposReborn.worldDevourer;\n    if(s.worldDevourPrototype)return patternDamage(e,'worldDevour');\n    if(s.pastPrototype)return patternDamage(e,'pastTrajectory');\n    if(s.ringPrototype)return patternDamage(e,'devourerRing');\n    if(s.mawPrototype)return patternDamage(e,'voidMaw');\n    if(s.tailSeverPrototype)return patternDamage(e,s.tailSeverPrototype.scarResolved?'tailRupture':'tailSever');\n    if(s.crossingPrototype)return patternDamage(e,'giantCrossing');\n    return null;\n  }"
          )
          one(damage,
              "    multipliers:{giantCrossing:.95,tailSever:1.05,tailRupture:.72,voidMaw:1.35,devourerRing:1.10,pastTrajectory:.92,worldDevour:1.75}",
              "    multipliers:{...DAMAGE_MULTIPLIERS}"
          )

          crossing='src/atropos-world-devourer-attack-crossing.js'
          one(crossing,"hurtPlayer(Math.max(8,(Number(player.maxHp)||100)*.14),e)","hurtPlayer(window.stackfallAtroposPatternDamage(e,'giantCrossing'),e)")
          one(crossing,"hurtPlayer(Math.max(8,(Number(player.maxHp)||100)*.15),e)","hurtPlayer(window.stackfallAtroposPatternDamage(e,'tailSever'),e)")
          one(crossing,"hurtPlayer(Math.max(7,(Number(player.maxHp)||100)*.12),e)","hurtPlayer(window.stackfallAtroposPatternDamage(e,'tailRupture'),e)")
          one('src/atropos-world-devourer-attack-maw.js',"hurtPlayer(Math.max(9,(Number(player.maxHp)||100)*.20),e)","hurtPlayer(window.stackfallAtroposPatternDamage(e,'voidMaw'),e)")
          one('src/atropos-world-devourer-attack-ring.js',"hurtPlayer(Math.max(8,(Number(player.maxHp)||100)*.16),e)","hurtPlayer(window.stackfallAtroposPatternDamage(e,'devourerRing'),e)")
          all_matches('src/atropos-world-devourer-attack-past.js',"hurtPlayer(Math.max(8,(+player.maxHp||100)*.13),e)","hurtPlayer(window.stackfallAtroposPatternDamage(e,'pastTrajectory'),e)",2)
          one('src/atropos-world-devourer-attack-world.js',"hurtPlayer(Math.max(12,(+player.maxHp||100)*.28),e)","hurtPlayer(window.stackfallAtroposPatternDamage(e,'worldDevour'),e)")
          PY
          if grep -R "player\.maxHp" src/atropos-world-devourer-attack-*.js; then
            echo 'legacy player.maxHp damage expression remains in Atropos attack source' >&2
            exit 1
          fi
          node --check src/atropos-world-devourer-damage.js
          for f in src/atropos-world-devourer-attack-*.js; do node --check "$f"; done
          git diff --check
      - name: Commit source damage cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-damage.js src/atropos-world-devourer-attack-*.js
          git commit -m "Remove legacy max-HP damage expressions from Atropos"
          git push origin HEAD:feature/atropos-world-devourer-prototype
