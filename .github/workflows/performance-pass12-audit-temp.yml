name: Temporary Stackfall performance pass 12 audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-pass12-audit-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Audit hostile projectile ownership and mutation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots=[Path('src')]
          files=sorted(p for root in roots for p in root.rglob('*.js'))
          needles=(
              'spawnEnemyProjectile','enemyProjectiles','homingTurn','homingUntil',
              'visualSeed','maxLife','prevX','prevY','.heading','.phase','.age'
          )
          print('=== files touching hostile projectile APIs/state ===')
          touched=[]
          for p in files:
              text=p.read_text(encoding='utf-8')
              if 'spawnEnemyProjectile' in text or 'enemyProjectiles' in text:
                  touched.append(p)
                  print(p)
          print('\n=== relevant source lines ===')
          for p in touched:
              lines=p.read_text(encoding='utf-8').splitlines()
              matches=[]
              for i,line in enumerate(lines,1):
                  if any(n in line for n in needles):
                      matches.append((i,line.strip()))
              if matches:
                  print(f'--- {p} ---')
                  for i,line in matches:
                      print(f'{i}: {line}')
          print('\n=== spawn-return mutations ===')
          pat=re.compile(r'(?:(?:const|let|var)\s+)?([A-Za-z_$][\w$]*)\s*=\s*spawnEnemyProjectile\s*\(')
          for p in touched:
              lines=p.read_text(encoding='utf-8').splitlines()
              for i,line in enumerate(lines):
                  for m in pat.finditer(line):
                      name=m.group(1)
                      window='\n'.join(lines[i:min(len(lines),i+8)])
                      props=sorted(set(re.findall(r'\b'+re.escape(name)+r'\.([A-Za-z_$][\w$]*)\s*=',window)))
                      print(f'{p}:{i+1}: {name}: {props}')
          print('\n=== direct hostile projectile object pushes ===')
          for p in touched:
              lines=p.read_text(encoding='utf-8').splitlines()
              for i,line in enumerate(lines,1):
                  if re.search(r'enemyProjectiles\s*\.\s*push\s*\(',line) and 'spawnEnemyProjectile' not in line:
                      print(f'{p}:{i}: {line.strip()}')
          print('\n=== hostile projectile removals / clears ===')
          for p in touched:
              lines=p.read_text(encoding='utf-8').splitlines()
              for i,line in enumerate(lines,1):
                  if 'enemyProjectiles' in line and any(x in line for x in ('.shift(','.splice(','.length=0','compactInPlace(','trimOldest(')):
                      print(f'{p}:{i}: {line.strip()}')
          PY
