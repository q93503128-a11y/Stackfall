name: Atropos colossal visual repair

on:
  push:
    branches:
      - feature/atropos-world-devourer-prototype
    paths:
      - scripts/atropos-colossal-pass.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atropos-world-devourer-prototype
          fetch-depth: 0
      - name: Apply colossal visual pass
        run: python scripts/atropos-colossal-pass.py
      - name: Validate changed runtime
        run: |
          node --check src/atropos-world-devourer-prototype.js
          node --check src/atropos-world-devourer-entry.js
          node --check src/atropos-world-devourer-attack-past.js
          node scripts/atropos-code-audit.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/atropos-world-devourer-prototype.js src/atropos-world-devourer-entry.js src/atropos-world-devourer-attack-past.js
          git commit -m "Rebuild Atropos as a colossal world-devouring leviathan"
          git push origin HEAD:feature/atropos-world-devourer-prototype
