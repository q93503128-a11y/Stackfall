<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050814">
  <meta name="description" content="STACKFALL은 다양한 장비를 장착하고 조합해 몰려오는 적과 보스를 상대하는 우주 테마의 로그라이크 생존 액션 게임입니다.">
  <meta property="og:title" content="STACKFALL">
  <meta property="og:description" content="STACKFALL은 다양한 장비를 장착하고 조합해 몰려오는 적과 보스를 상대하는 우주 테마의 로그라이크 생존 액션 게임입니다.">
  <meta property="og:image" content="https://stackfall.pages.dev/summ.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://stackfall.pages.dev/summ.png">
  <title>STACKFALL</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="shortcut icon" href="favicon.svg?v=3">
  <link rel="manifest" href="site.webmanifest">
  <meta name="application-name" content="STACKFALL">
  <meta name="apple-mobile-web-app-title" content="STACKFALL">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="feature-pack.css">
</head>
<body>
  <main id="app">
    <canvas id="game" role="img" aria-label="Stackfall game screen"></canvas>
    <section id="menu" class="screen active" aria-labelledby="title"><div class="menu-noise"></div><button id="menuSettingsBtn" class="settings-icon-btn" type="button" aria-label="Settings">⚙</button><div class="brand-wrap"><h1 id="title"><span>STACK</span><strong>FALL</strong></h1></div><div class="menu-panel glass"><div class="starter-head"><span data-i18n="menu.startEquipment">시작 장비</span><strong id="starterName">펄스 블레이드</strong><p id="starterDesc"></p></div><div id="starterOptions" class="starter-options" role="radiogroup" aria-label="Starting equipment"></div><button id="startBtn" class="primary-btn" type="button"><span data-i18n="menu.start">RUN START</span></button></div></section>
    <section id="hud" class="hud hidden" aria-live="polite"><div class="top-left glass compact"><div class="hp-line"><span data-i18n="hud.core">CORE</span><div class="bar"><i id="hpBar"></i></div><b id="hpText">100 / 100</b></div><div class="xp-line"><span>LV.<b id="levelText">1</b></span><div class="bar xp"><i id="xpBar"></i></div></div></div><div class="top-center"><b id="timerText">00:00</b><span id="threatText">THREAT 1</span></div><div id="bossBar" class="boss-bar hidden"><span id="bossName">Boss</span><div><i id="bossHpBar"></i></div></div><button id="pauseBtn" class="icon-btn" type="button" aria-label="Pause">Ⅱ</button><div id="comboBox" class="combo-box"><span data-i18n="hud.chain">CHAIN</span><b id="comboText">0</b><i id="comboBar"></i></div><div id="weaponSlots" class="weapon-slots"></div><div id="passiveList" class="passive-list glass compact"></div></section>
    <section id="choiceScreen" class="overlay hidden" aria-labelledby="choiceTitle"><div class="choice-head"><p id="choiceKicker" data-i18n="choice.kicker">시스템 재구성</p><h2 id="choiceTitle" data-i18n="choice.title">레벨 업</h2><span data-i18n="choice.prompt">하나를 선택하세요</span></div><div id="choiceCards" class="choice-cards"></div></section>
    <section id="resonanceBanner" class="resonance-banner hidden"><span id="resonanceKicker">RESONANCE</span><strong id="resonanceTitle">공명 개방</strong><p id="resonanceDesc"></p></section>
    <section id="bossNotice" class="boss-notice hidden"><span id="bossNoticeKicker">WARNING</span><strong id="bossNoticeName">Boss</strong></section>
    <section id="pauseScreen" class="overlay hidden"><div class="modal glass"><h2 data-i18n="pause.title">일시정지</h2><button id="resumeBtn" class="primary-btn" type="button"><span data-i18n="pause.resume">계속하기</span></button><button id="restartBtn" class="secondary-btn" type="button" data-i18n="pause.restart">게임 다시 시작</button><button id="pauseSettingsBtn" class="secondary-btn" type="button" data-i18n="pause.settings">설정</button><button id="pauseMenuBtn" class="secondary-btn" type="button" data-i18n="pause.menu">메인 메뉴</button></div></section>
    <section id="gameOverScreen" class="overlay hidden">
      <div class="modal glass result-modal">
        <h2 data-i18n="gameover.title">게임 오버</h2>
        <div class="result-grid">
          <div><span data-i18n="gameover.time">생존 시간</span><b id="resultTime">00:00</b></div>
          <div><span data-i18n="gameover.kills">처치</span><b id="resultKills">0</b></div>
          <div><span data-i18n="gameover.combo">최대 연쇄</span><b id="resultCombo">0</b></div>
          <div><span data-i18n="gameover.level">도달 레벨</span><b id="resultLevel">1</b></div>
        </div>
        <section class="damage-results" aria-labelledby="damageResultsTitle">
          <h3 id="damageResultsTitle" data-i18n="gameover.damage.title">피해 분석</h3>
          <div class="damage-summary-grid">
            <div><span data-i18n="gameover.damage.total">총 피해량</span><b id="resultDamageTotal">0</b></div>
            <div><span data-i18n="gameover.damage.average">평균 DPS</span><b id="resultDamageDps">0</b></div>
            <div><span data-i18n="gameover.damage.peak">최고 구간 DPS</span><b id="resultPeakDps">0</b></div>
          </div>
          <div class="damage-chart-block">
            <div class="damage-chart-title"><span data-i18n="gameover.damage.breakdown">장비별 피해량</span></div>
            <div id="resultDamageBars" class="damage-bars" aria-live="polite"></div>
          </div>
          <div class="damage-chart-block damage-trend-block">
            <div class="damage-chart-title"><span data-i18n="gameover.damage.trend">딜 추이</span><small>15s</small></div>
            <svg id="damageTrendChart" class="damage-trend-chart" viewBox="0 0 600 160" role="img" aria-label="딜 추이"></svg>
            <div class="damage-trend-axis"><span id="damageTrendStart">00:00</span><span id="damageTrendEnd">00:00</span></div>
          </div>
        </section>
        <div class="result-actions">
          <button id="retryBtn" class="primary-btn" type="button"><span data-i18n="gameover.retry">다시 시작</span></button>
          <button id="menuBtn" class="secondary-btn" type="button" data-i18n="gameover.menu">메인 메뉴</button>
        </div>
      </div>
    </section>
    <section id="settingsScreen" class="overlay settings-overlay hidden" aria-labelledby="settingsTitle"><div class="settings-modal glass"><div class="settings-heading"><h2 id="settingsTitle" data-i18n="settings.title">설정</h2><button id="settingsCloseX" type="button" aria-label="Close">×</button></div><label class="settings-row select-row"><span data-i18n="settings.language">언어</span><select id="languageSelect"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-CN">简体中文</option><option value="es">Español</option><option value="fr">Français</option></select></label><label class="settings-row"><span data-i18n="settings.master">전체 소리</span><input id="soundMaster" type="checkbox"><i></i></label><div class="settings-row volume-row"><label for="volumeMaster" data-i18n="settings.masterVolume">전체 음량</label><input id="volumeMaster" type="range" min="0" max="100" step="1"><output for="volumeMaster"></output></div><label class="settings-row"><span data-i18n="settings.combat">전투 효과음</span><input id="soundCombat" type="checkbox"><i></i></label><div class="settings-row volume-row"><label for="volumeCombat" data-i18n="settings.combatVolume">전투 음량</label><input id="volumeCombat" type="range" min="0" max="100" step="1"><output for="volumeCombat"></output></div><label class="settings-row"><span data-i18n="settings.ui">UI 효과음</span><input id="soundUi" type="checkbox"><i></i></label><div class="settings-row volume-row"><label for="volumeUi" data-i18n="settings.uiVolume">UI 음량</label><input id="volumeUi" type="range" min="0" max="100" step="1"><output for="volumeUi"></output></div><label class="settings-row"><span data-i18n="settings.ambient">우주 배경음</span><input id="soundAmbient" type="checkbox"><i></i></label><div class="settings-row volume-row"><label for="volumeAmbient" data-i18n="settings.ambientVolume">배경음 음량</label><input id="volumeAmbient" type="range" min="0" max="100" step="1"><output for="volumeAmbient"></output></div><label class="settings-row"><span data-i18n="settings.damageNumbers">피해량 표시</span><input id="damageNumbers" type="checkbox"><i></i></label><label class="settings-row"><span data-i18n="settings.hideProjectiles">아군 투사체 숨기기</span><input id="hideProjectiles" type="checkbox"><i></i></label><label class="settings-row"><span data-i18n="settings.sparkles">반짝임 효과</span><input id="sparkles" type="checkbox"><i></i></label><label class="settings-row"><span data-i18n="settings.screenShake">화면 흔들림</span><input id="screenShake" type="checkbox"><i></i></label><button id="settingsCloseBtn" class="primary-btn" type="button"><span data-i18n="settings.close">닫기</span></button></div></section>
    <div id="touchControls" class="touch-controls hidden" aria-hidden="true"><div id="joystick" class="joystick"><div id="stick"></div></div></div>
  </main>
  <script src="src/build-info.js"></script>
  <script src="src/bootstrap.js"></script>
  <script src="src/core.js"></script>
  <script src="src/language-pack.js"></script>
  <script src="src/boss-catalog.js"></script>
  <script src="src/systems-base.js"></script>
  <script src="src/runtime-config.js"></script>
  <script src="src/weapons.js"></script>
  <script src="src/boss-patterns.js"></script>
  <script src="src/bosses.js"></script>
  <script src="src/systems.js"></script>
  <script src="src/interface.js"></script>
  <script src="src/settings.js"></script>
  <script src="src/realm-backgrounds.js"></script>
  <script src="src/render-space.js"></script>
  <script src="src/elite-renderers.js"></script>
  <script src="src/render-entities.js"></script>
  <script src="src/feature-pack.js"></script>
  <script src="src/reward-refinement.js"></script>
  <script src="src/difficulty-augment-expansion.js"></script>
  <script src="src/combat-balance-refinement.js"></script>
  <script src="src/progression-expansion.js"></script>
  <script src="src/map-event-expansion.js"></script>
  <script src="src/targeting-motion-refinement.js"></script>
  <script src="src/combat-guidance-refinement.js"></script>
  <script src="src/ability-ledger-audit.js"></script>
  <script src="src/run-damage-stats.js"></script>
  <script src="src/render.js"></script>
  <script src="src/dark-cosmic-polish.js"></script>
  <script src="src/performance-guard.js"></script>
  <script src="src/build-audit-ui.js"></script>
  <script src="src/gpu-renderer.js"></script>
  <script src="src/endgame-balance-expansion.js"></script>
  <script src="src/community-feedback-refinement.js"></script>
</body>
</html>
